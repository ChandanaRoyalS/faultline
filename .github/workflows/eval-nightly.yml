# T4.5: the full catalog, nightly, with its results appended to the eval database.
#
# **Not a required check and never will be** - it runs on a schedule, so there is no pull request
# for it to gate. Its job is the trend line: every run lands in `eval_runs` under a config
# fingerprint, and `faultline-compare` reads them.
#
# Cost is the reason this is nightly rather than per-push. Fifteen runnable scenarios at dev sweep
# 8's measured $0.70 is roughly $10.50 a night, which is a real number and belongs here rather
# than in a surprise invoice.
#
# R=1, like the smoke suite, and for the same reason: nightly is change detection. The plan's
# weekly R=3 consolidation is the tier that produces something comparable, and it is not this
# workflow.
name: eval-nightly

on:
  schedule:
    # 04:00 UTC. After the day's merges, before anyone looks.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: eval-world
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-extras --all-groups

      - name: Refuse early if there is no key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "REFUSED: no ANTHROPIC_API_KEY secret. Nothing was started."
            exit 1
          fi

      - name: Bring up the platform and the world
        id: boot
        run: make eval-up

      - name: Migrate and seed
        run: |
          uv run faultline-migrate
          uv run faultline-seed --create-schema

      - name: The catalog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # **This was twenty lines of shell**, and it was the only thing in the repository that
        # could run a catalog - so Gate 4's condition could not be met by `make eval`, the command
        # it names, and the logic that did meet it was untested and reachable only by GitHub.
        # `faultline-sweep` is that loop with tests behind it: the same countdown, the same "a
        # discard must not end the night", the same INVALID.md exclusion.
        #
        # `|| true` stays. The sweep exits 1 on a partial catalog, deliberately - a night that
        # scored eight of seventeen is not a pass - but the steps after this one load and label
        # what *did* run, and a red step here would skip them.
        run: uv run faultline-sweep --tier nightly || true

      # **`always()` alone was wrong, and `!= 'skipped'` was wrong one state later.** The key
      # check refusing means nothing was started, and an unconditional `always()` ran the
      # database load against a Postgres that was never booted. Conditioning on the boot having
      # *run* fixed the refusal case and left the failure case: a boot that fails is not
      # `'skipped'` either, so the first real boot failure produced two errors - a kafka
      # dependency failure, and a database error from a load that should never have started.
      #
      # A step that consumes what the boot produced needs the boot to have **succeeded**. Only
      # `Tear down` keeps `!= 'skipped'`, because cleaning up after a half-started world is
      # exactly when cleanup matters.
      - name: Why the world did not come up
        # **The first boot failed and took its own evidence with it.** Kafka went unhealthy
        # eight seconds after starting, the boot failed on the dependency, and `Tear down` ran
        # and removed the container - so the run that would say why produced nothing to read,
        # and the next attempt would have had to fail again to be diagnosed.
        #
        # This is the harness's own rule applied to its CI: a discarded run is recorded with its
        # reason, never deleted. A boot that fails is the same kind of event, and it costs
        # nothing to capture because it happens before the first model call.
        if: failure() && steps.boot.outcome == 'failure'
        run: |
          echo "::group::containers"
          docker ps -a
          echo "::endgroup::"
          echo "::group::kafka"
          (cd world && docker compose --progress plain \
            -f docker-compose.yml \
            -f ../compose/world-arm64.override.yml \
            -f ../compose/telemetry.yml \
            logs --no-color --tail 200 kafka) || echo "kafka has no logs to give"
          echo "::endgroup::"
          echo "::group::memory and disk"
          free -m || true
          df -h / || true
          nproc || true
          echo "::endgroup::"

      - name: Append to the eval database
        if: always() && steps.boot.outcome == 'success'
        run: uv run faultline-eval-db load

      - name: Tear down
        if: always() && steps.boot.outcome != 'skipped'
        run: make eval-down

      - uses: actions/upload-artifact@v4
        # Also conditioned: `evals/runs/` holds 128 committed run directories, so an
        # unconditional upload ships the repository's whole recorded history as a
        # build artifact on every refusal.
        if: always() && steps.boot.outcome == 'success'
        with:
          name: nightly-run-artifacts
          path: evals/runs/
