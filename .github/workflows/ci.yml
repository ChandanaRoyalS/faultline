name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI attribution in history
        run: |
          if git log --all --format=%B | grep -iE 'co-authored-by:.*(claude|anthropic)|generated with.*claude'; then
            echo '::error::AI attribution trailer found in commit history'; exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-groups
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t faultline:ci .
      # T0.2's deliverable is "build artifacts published per commit". A build that is
      # thrown away proves the Dockerfile parses and nothing else, and T5.5 deploys "the
      # same images CI publishes to" - so the registry has to exist well before then.
      # Pull requests build without publishing; only a commit that has landed on main
      # becomes an image. Tagged by sha so a deployment can name exactly what it runs.
      - name: Publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker tag faultline:ci "$image:${{ github.sha }}"
          docker tag faultline:ci "$image:latest"
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # **`--all-extras`, and only on this job.** T6.4's retrieval gate measures the pipeline
      # production runs, which means the real sentence-transformer embedder rather than the
      # hashing one - a gate over a different embedder would pass while an embedder swap
      # regressed retrieval, and noticing an embedder swap is one of the three things §2.4
      # names the gate for. `embeddings` is an extra rather than a group, so `--all-groups`
      # alone leaves it out; the gate shipped un-runnable here and reported green for one run
      # because the passing run predated it.
      #
      # The cost is real and is taken deliberately: torch comes from the CPU index on Linux
      # (see pyproject's `[tool.uv.sources]`), so this is not the 3 GB CUDA install, but the
      # job does now download an embedding model from the HF hub at test time. `checks` is
      # deliberately left on `--all-groups` so the fast job stays fast.
      - name: Install
        run: uv sync --all-groups --all-extras
      # T2.3's deliverable names "integration tests running real Postgres and Redis via
      # testcontainers". They are deselected from the default run so a clean clone with no
      # Docker still passes Gate 0 - which makes this job the only thing that executes them.
      # Without it, the marker is a way to write a test that never runs, and the guard in
      # tests/conftest.py would have been loosened for nothing.
      # **Pull the test images first, with retries, and fail at a step that says so.**
      #
      # These images are pulled anonymously from public registries at test time, and that has
      # now failed twice in two days for the same image: Docker Hub denied anonymous pulls of
      # `minio/minio` on 2026-09-11 (which is why `docker-compose.yml` moved to Quay, with the
      # reason in a comment there), and Quay answered 404 for the moved tag on 2026-09-12 and
      # then served it again two minutes later on a re-run of the same commit. A flap should
      # cost thirty seconds, not a red build and a re-run nobody records.
      #
      # Retries here rather than in the tests: testcontainers pulls inside a fixture, so a
      # registry failure surfaces as `ImageNotFound` inside a stack trace in four unrelated
      # archive tests. A named step turns a real removal into a legible failure and keeps the
      # flap out of the test report entirely.
      #
      # **This list is duplicated from the tests on purpose and is held by
      # `test_the_prepulled_images_are_the_ones_the_tests_ask_for`** - a stale entry here would
      # pre-pull one image while the tests pulled another, which is the same flap wearing a
      # green step.
      #
      # Not covered: the embedding model this job downloads from the HF hub at test time. Same
      # failure class, different remedy, and no observed failure yet to justify one.
      - name: Pull test images
        run: |
          for image in \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z \
            pgvector/pgvector:pg16 \
            redis:latest
          do
            for attempt in 1 2 3; do
              if docker pull --quiet "$image"; then break; fi
              if [ "$attempt" = 3 ]; then
                echo "::error::could not pull $image after 3 attempts"
                exit 1
              fi
              echo "pull of $image failed (attempt $attempt); retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
          done
      - name: Integration tests
        run: uv run pytest -m integration -o addopts=-q
