# T4.5: the eval smoke subset, on every change touching prompts, context or models.
#
# **This workflow is not a required check and must not be made one until it can pass.** It boots
# the world and makes real model calls, so it needs both a working world in Actions and an
# ANTHROPIC_API_KEY with credit. Neither is true today. It is landed running rather than
# commented out, because a workflow that has never executed is a workflow nobody knows is broken,
# and its first red run is information.
#
# What it is for: change detection. Four scenarios at R=1 has an MDE near 44pp (evals/MDE.md), so
# this cannot tell anyone whether a prompt edit helped. It tells them the pipeline still completes
# on all four fault classes, which is what a pre-merge check is for. The output says so itself -
# see the "Label the result non-citable" step, which the plan requires so that a smoke number
# cannot be screenshotted into a README six weeks later.
name: eval-smoke

on:
  pull_request:
    paths:
      # The plan's "prompts/context/models". Every path here is one whose change can move what a
      # model is asked or what it is given, which is the class of change a smoke run exists for.
      - "src/faultline/agents/roles.py"
      - "src/faultline/agents/contracts.py"
      - "src/faultline/agents/briefing.py"
      - "src/faultline/agents/evidence.py"
      - "src/faultline/agents/settings.py"
      - "src/faultline/agents/investigation.py"
      - "src/faultline/context/**"
      - "src/faultline/tools/**"
      - ".github/workflows/eval-smoke.yml"
  workflow_dispatch:

concurrency:
  # One world, one lock. Two smoke runs at once would inject into the same stack, which is the
  # condition the harness's own world lock refuses - better to queue here than to discard there.
  group: eval-world
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Four scenarios, three 300-second settle windows between them, plus a fifteen-service
    # boot. The old 45 left no margin over the waits alone once `faultline-sweep` started
    # honouring them, and a smoke run killed by its own timeout looks identical to a pipeline
    # that hung.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-extras --all-groups

      - name: Refuse early if there is no key
        # Before the world comes up, not after. Booting a fifteen-service stack to discover the
        # model is unreachable is the same defect Q20 records in the harness.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "REFUSED: no ANTHROPIC_API_KEY secret. Nothing was started."
            exit 1
          fi

      - name: Bring up the platform and the world
        id: boot
        run: make eval-up

      - name: Migrate and seed
        run: |
          uv run faultline-migrate
          uv run faultline-seed --create-schema

      - name: Smoke subset
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # **This was the loop the nightly already shed, and it could not have passed.** Four
        # `faultline-eval` calls back to back, `set -e`, no settle between them: every scored run
        # leaves a resolved incident, and a firing inside the orchestrator's 300s window reopens
        # it rather than opening a new one. Scenario 1 would score, scenario 2 would be refused
        # with exit 3, and `set -e` would end the job there - after spending on scenario 1. The
        # first real sweep scored 1 of 5 for exactly this reason before `faultline-sweep` learned
        # to wait.
        #
        # So the smoke subset runs through the same driver as the nightly, with the same tested
        # countdown, settle and retry. `smoke.SMOKE_SCENARIOS` stays the single source of truth
        # for which four scenarios these are - the scope is read out of it rather than restated
        # here, so the workflow cannot drift from the module a test already pins.
        #
        # No `|| true`, unlike the nightly. A nightly that scored eight of seventeen still has
        # something to load and label; a pre-merge smoke that did not complete its four is a
        # failed check, which is the whole point of it being a check.
        run: |
          uv run faultline-sweep --tier ci-smoke \
            --only "$(uv run python -c 'from evalharness import smoke; print(",".join(smoke.scenario_ids()))')"

      # **`always()` alone was wrong and the first red run proved it.** When the key check
      # refuses, nothing has been started - and an unconditional `always()` here ran the database
      # load against a Postgres that was never booted, failing a second time with an error about
      # a database when the real answer was "there is no key". Conditioned on the boot step
      # having actually run, so a refusal produces one clear failure instead of a cascade.
      - name: Load results into the eval database
        if: always() && steps.boot.outcome != 'skipped'
        run: uv run faultline-eval-db load

      - name: Label the result non-citable
        # T4.5: "smoke results are labeled non-citable in the CI output itself (R=1 is change
        # detection, never a finding)". The text is in evalharness.smoke and asserted by a test,
        # so this label cannot drift from the reason for it. Conditioned on the boot
        # like every other cleanup step: a label on a run that never started labels
        # nothing.
        if: always() && steps.boot.outcome != 'skipped'
        run: uv run python -c "from evalharness import smoke; print(smoke.NON_CITABLE)"

      - name: Tear down
        if: always() && steps.boot.outcome != 'skipped'
        run: make eval-down

      - uses: actions/upload-artifact@v4
        # Also conditioned: `evals/runs/` holds 128 committed run directories, so an
        # unconditional upload ships the repository's whole recorded history as a
        # build artifact on every refusal.
        if: always() && steps.boot.outcome != 'skipped'
        with:
          name: smoke-run-artifacts
          path: evals/runs/
