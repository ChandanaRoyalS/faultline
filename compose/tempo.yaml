# T6.1 - Grafana Tempo, the trace store the trace tool reads.
#
# Beside Jaeger, not instead of it. Jaeger is the demo's own trace UI behind frontend-proxy and a
# service in somebody else's compose file (ADR-0026); the collector fans traces out to both, the
# tool reads this one. The execution plan's word for T6.1 is "add".
#
# Local storage, single binary, no object store: the same shape as the demo's Jaeger all-in-one,
# and the same trade - a trace exists as long as the container does, and `block_retention` bounds
# how long that is. 24h covers a day of recording and a sweep, and a reader clicking a citation the
# next morning; longer was the first draft and bought nothing the harness reads.
#
# `usage_report.reporting_enabled: false` is not cosmetic. Tempo phones home by default, and this
# world is the one THREAT-MODEL thesis 2 wants no unexplained egress from. T6.8 restricts egress
# structurally; until then, nothing in this file asks for any.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# Memory, bounded on evidence rather than hoped for. Idle on the reference platform for two
# hours before the first recording, Tempo at these defaults reached 367 and 379 MiB of its 400 MiB
# limit and tripped the harness's 90% headroom gate twice (2026-09-08, before any bundle was
# recorded). The ingester keeps the head block and every completed block in memory for
# `complete_block_timeout` (15m by default) after cutting it, so at this span rate four blocks sit
# in RAM at once. Smaller blocks, cut and released sooner; the Go runtime's own limit is set in
# compose/telemetry.yml (GOMEMLIMIT), which is what makes the container limit a target the
# collector sees rather than a cliff it finds.
#
# **`max_block_duration` is 30s because 5m made the trace tool blind to the incident.** Nothing is
# searchable until a block is cut, so with 5m blocks the newest searchable trace froze at a fixed
# instant while the clock ran on. Measured 2026-09-09, twelve samples fifteen seconds apart: the
# newest trace sat at 02:27:03 through five consecutive minutes - 138s behind, then 153, 169, 184,
# 199, 214, 229, 244, 259, 274, 289 - and then snapped to 14s behind as the block was cut. **At any
# moment the tool was blind to the last 0-5 minutes**, which is precisely the window an
# investigation asks about: onset is 3-6 minutes before the agent runs. Two dev sweep 12 verdicts
# said so in their own words - *"every returned trace predates onset"* - and both were wrong.
#
# At 30s the same measurement reads 6-88s behind, median around 14s, with no monotonic climb, and
# memory went **down**, 55% to 40% of the limit, because blocks are released sooner than they
# accumulate. The cost of this line is more, smaller blocks for the compactor; the cost of the
# previous one was a trace analyst that could not see the fault it was dispatched to explain.
ingester:
  max_block_duration: 30s
  max_block_bytes: 52428800
  complete_block_timeout: 2m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
