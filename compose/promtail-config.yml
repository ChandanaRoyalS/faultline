# T1.2 - ship container logs into Loki, labelled by service.
#
# No drop stage. Everything a container writes reaches Loki. T1.2 filtered
# dead-dependency noise from the real Erlang flag service; ADR-0006 replaced that
# service with a stub that answers, so the noise no longer exists and the filter
# was removed rather than left inert. History and measurements: ADR-0005.
#
# Standing rule from that ADR: anything that removes telemetry is an evidence gap
# by construction and ships with a measurement of what it removes. If noise
# returns, the fix is a scoped filter plus a test proving what it drops - not a
# term match, and not an unmeasured one.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # /cart-service -> service="cart-service"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "service"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
