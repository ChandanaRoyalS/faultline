# T1.2 - register Loki with the demo's Grafana.
# Provisioned as a file rather than clicked in the UI, so a clean clone comes up
# fully wired (the Gate 5 condition), not half-configured.
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    isDefault: false
    editable: false
