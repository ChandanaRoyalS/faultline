# T1.1 - ARM/emulation headroom for the OTel demo (pinned v1.2.1).
#
# The demo sets tight per-container memory limits tuned for native x86. Under
# emulation on Apple Silicon the same workloads use more memory and sit at
# their ceilings. An OOM-killed container is an incident Faultline did not
# inject, and it would pollute the baseline every eval number depends on.
# Limits are raised, not removed, so genuine runaway memory is still caught.
services:
  adservice:
    deploy: { resources: { limits: { memory: 700M } } }
  cartservice:
    deploy: { resources: { limits: { memory: 400M } } }
  checkoutservice:
    deploy: { resources: { limits: { memory: 120M } } }
  currencyservice:
    deploy: { resources: { limits: { memory: 100M } } }
  emailservice:
    deploy: { resources: { limits: { memory: 250M } } }
  frauddetectionservice:
    deploy: { resources: { limits: { memory: 500M } } }
  frontend:
    deploy: { resources: { limits: { memory: 500M } } }
  frontendproxy:
    deploy: { resources: { limits: { memory: 300M } } }
  # 1200M sat inside kafka's working set: measured at 1.165GiB of 1.172GiB, 99.5% of the
  # limit, with nothing injected. The T1.5 rehearsal pre-flight gate refuses to start
  # against a container above 90%, because one that OOMs mid-run writes a broad spurious
  # incident into the bundle as though it were the injected fault.
  kafka:
    deploy: { resources: { limits: { memory: 2g } } }
  loadgenerator:
    deploy: { resources: { limits: { memory: 300M } } }
  # 200M sat inside the working set: measured at 191.5MiB of 200MiB, 95.7%, idle. Raised
  # for the same reason as kafka - the rehearsal pre-flight gate will not run against it.
  paymentservice:
    deploy: { resources: { limits: { memory: 320M } } }
  productcatalogservice:
    deploy: { resources: { limits: { memory: 120M } } }
  # 120M sat inside the working set: measured at 95.8MiB of 120MiB, 79.8%, idle - the
  # highest in the world and ten points from the rehearsal pre-flight gate, which refuses
  # to start against a container above 90%. Raised before it blocks a rehearsal mid-catalog
  # rather than after. No scenario targets quoteservice, so this limit is not a fault
  # parameter (unlike adservice 700M and recommendationservice 800M, which must not move).
  quoteservice:
    deploy: { resources: { limits: { memory: 200M } } }
  recommendationservice:
    deploy: { resources: { limits: { memory: 800M } } }
  shippingservice:
    deploy: { resources: { limits: { memory: 120M } } }
  otelcol:
    deploy: { resources: { limits: { memory: 300M } } }
  accountingservice:
    deploy: { resources: { limits: { memory: 300M } } }
  # The real service (Elixir/Erlang) segfaults under emulation and its native
  # build is blocked upstream. Replaced with a native-arm64 gRPC stub that
  # implements the same contract - see ADR-0005 and ADR-0006. Built by
  # `make ffs-stub`; compose runs with --no-build so this image is used as-is.
  featureflagservice:
    image: faultline/ffs-stub:1
