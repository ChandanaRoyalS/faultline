# T1.2 - log storage for the world.
#
# The OTel demo ships Prometheus (metrics), Jaeger (traces) and Grafana, but no
# log store. Faultline's log analyst agent needs one, so we add Loki plus
# Promtail, which reads container stdout via the Docker socket and ships it.
#
# Everything is version-pinned: a demo that behaves differently in month five is
# not a reproducible environment (see the clean-clone gate condition).
services:
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          memory: 400M

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../compose/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 200M

  # Pin Grafana to a predictable port so dashboards and demo links are stable.
  grafana:
    ports:
      - "3000:3000"
    volumes:
      - ../compose/grafana-loki-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=:9093
    volumes:
      - ../compose/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    deploy:
      resources:
        limits:
          memory: 200M

  # Point Prometheus at our config (rules + Alertmanager) and keep more history:
  # the demo's 1h retention is too short to investigate an incident after the fact.
  prometheus:
    volumes:
      - ../compose/prometheus/prometheus-config.yaml:/etc/prometheus/faultline-prometheus.yaml:ro
      - ../compose/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - --config.file=/etc/prometheus/faultline-prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --web.console.templates=/etc/prometheus/consoles
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.enable-lifecycle
      - --web.route-prefix=/
