# T7.28 - merged into the collector's configuration as its second `--config`.
#
# THIS FILE, NOT THE CLONE'S. The demo ships `world/src/otelcollector/otelcol-config-extras.yml`
# as the designed merge point, and T7.26 specified the change there. It cannot go there: `world/`
# is gitignored (ADR-0026 - it is somebody else's repository, cloned at a tag), so an edit would
# be lost by the next `make world-up` on a fresh checkout and could never be committed. This file
# is mounted over that path by `compose/telemetry.yml` instead, so the change is versioned here
# and `observability_digest` covers the file that is actually in effect.
#
# T7.1 recorded 600M for otel-col as "a timer, not a fix": the raise defers the ceiling and
# changes nothing about the collector's behaviour. A memory_limiter does change it - under
# pressure the collector refuses and drops rather than growing until the kernel kills it.
#
# Be clear what that buys. It converts an OOM into backpressure. It does NOT stop growth, and
# dropped telemetry means gaps in captures - a better failure, not the absence of one.
#
# 450 MiB against the 600M container limit, with a 100 MiB spike allowance, so the soft limit is
# 350 MiB. Measured headroom at the time of writing: 144 MiB after two days of uptime, against
# the recorder's 540 MiB pre-flight tripwire.
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 450
    spike_limit_mib: 100

# T6.1 - a second trace sink. The demo's own config exports traces to `otlp` (Jaeger, at
# jaeger:4317) and `logging`; this adds Tempo beside them. **The exporter list below restates the
# demo's two on purpose**: the collector merges its configs by replacing lists, not appending to
# them, so a list naming only `otlp/tempo` would silently stop Jaeger receiving anything and the
# demo's trace UI would go dark. The demo's list is read from
# world/src/otelcollector/otelcol-config.yml at v1.2.1 - `exporters: [logging, otlp]` - and
# `tests/test_world_generations.py`'s digest over that file is what says so if it moves.
exporters:
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

# memory_limiter MUST be first in every pipeline: it can only refuse data it sees before another
# processor has buffered it.
service:
  pipelines:
    traces:
      processors: [memory_limiter, spanmetrics, batch]
      exporters: [logging, otlp, otlp/tempo]
    metrics:
      processors: [memory_limiter, batch]
