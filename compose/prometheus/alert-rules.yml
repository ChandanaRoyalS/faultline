# T1.3 - alert rules, with thresholds grounded in the measured baseline.
#
# Baseline on a healthy world (2026-08-22, re-measured 2026-08-23 over 29 quiet minutes):
#   error ratio  : 0.000 on every service, no sample above the 5% threshold
#   p95 latency  : 1.9-9.6ms for most services; checkout 37ms, frontend 42ms
#   cartservice  : BIMODAL - mean 22ms, but excursions to 353ms with nothing injected.
#                  One such excursion in 29 minutes, lasting 105s. It does not fire only
#                  because the `for: 3m` clause outlasts it, by about 75 seconds.
#                  See ADR-0012 - the rule is deliberately not tuned around this.
#
# Thresholds are therefore set well clear of healthy behaviour but low enough to
# catch injected faults. They are tuned to THIS environment, not copied from a
# tutorial - emulation makes latency here unlike a native host.
groups:
  - name: faultline-slo
    interval: 15s
    rules:
      - alert: ServiceHighErrorRate
        expr: |
          sum by (service_name) (rate(calls_total{status_code="STATUS_CODE_ERROR"}[2m]))
          /
          sum by (service_name) (rate(calls_total[2m])) > 0.05
        for: 2m
        labels:
          severity: critical
          signal: errors
        annotations:
          summary: "{{ $labels.service_name }} error rate above 5%"
          description: "{{ $labels.service_name }} is failing {{ $value | humanizePercentage }} of calls (baseline 0%)."

      - alert: ServiceHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (service_name, le) (rate(latency_bucket[2m]))
          ) > 250
        for: 3m
        labels:
          severity: warning
          signal: latency
        annotations:
          summary: "{{ $labels.service_name }} p95 latency above 250ms"
          description: "p95 is {{ $value | printf \"%.0f\" }}ms. Healthy baseline is under 50ms for most services, but cartservice is bimodal and reaches 353ms unfaulted for up to ~105s - the 3m `for` clause, not the threshold, is what separates that from a real regression."

      - alert: ServiceNoTraffic
        # Two guards, both learned from false positives on a healthy world:
        #   1. Fires only for services that WERE serving and then stopped.
        #   2. Excludes frontend-proxy. It is Envoy - an infrastructure
        #      component that emits a few spans at startup and none after, so
        #      "no traffic" is its healthy steady state. Requests do flow
        #      through it; it simply is not part of the span-metrics pipeline.
        # An alert that fires on a healthy system trains its reader to ignore
        # it, and would corrupt every eval scenario built on this baseline.
        expr: |
          sum by (service_name) (rate(calls_total{service_name!="frontend-proxy"}[3m])) == 0
          and
          sum by (service_name) (rate(calls_total{service_name!="frontend-proxy"}[30m] offset 10m)) > 0
        for: 3m
        labels:
          severity: critical
          signal: availability
        annotations:
          summary: "{{ $labels.service_name }} is serving no traffic"
          description: "No calls recorded for 3 minutes on a service that normally serves continuously."
