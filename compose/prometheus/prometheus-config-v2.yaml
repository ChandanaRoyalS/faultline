# T7.1 - Faultline's Prometheus config for the v2 world. Replaces the demo's via --config.file
# so rules and Alertmanager can be added without editing the pinned clone, exactly as the v1 file
# does (ADR-0026: the clone is somebody else's repository).
#
# **The scrape jobs are gone, and that is not an omission.** v1's collector exposes a Prometheus
# exporter and this file scrapes `otelcol:9464` and `otelcol:8888`. v2's collector **pushes**
# instead: its metrics pipeline ends `exporters: [otlphttp/prometheus, debug]`, aimed at
# `http://prometheus:9090/api/v1/otlp`, and v2's Prometheus runs with `--web.enable-otlp-receiver`
# to accept it. Metrics arrive without anybody scraping anything.
#
# **The consequence is a trap and it is handled in `telemetry-v2.yml`, not here.** Faultline's
# overlay replaces Prometheus's `command:` wholesale, so an overlay that forgets
# `--web.enable-otlp-receiver` leaves a Prometheus that starts cleanly, scrapes nothing, receives
# nothing, and reports no error - every metric silently absent with no failing container to show
# for it. The v2 overlay restates that flag for this reason and says so.
#
# Retention is 15d rather than v2's own 7d, for the reason T7.1 gave on the v1 world: six hours
# once cost a backfill outright, because a bundle's window was gone before the question was asked.
global:
  evaluation_interval: 15s
  scrape_interval: 5s

# **The `otlp:` block below is the demo's own, and this file dropped it once.** Measured on
# 2026-09-23 during T7.0's A6 (`2026-09-23-the-writer-that-was-not-single.md`): after
# `docker compose up -d accounting` recreated the container, the service consumed and wrote every
# order and its exporter logged `Export succeeded` for traces every five seconds - Tempo had them -
# yet `traces_span_metrics_calls_total{service_name="accounting"}` stayed flat at 4748 and
# `ServiceNoTraffic/accounting` fired on a healthy service. The one series it had carried
# `{job="opentelemetry-demo/accounting"}` and no `instance` label at all: the .NET SDK sets no
# `service.instance.id`, so every container that has ever run under that service name writes to
# the same series, and the spanmetrics connector keeps emitting the dead container's counters
# (it never expires them) in front of the live container's. Two writers, one series; Prometheus
# keeps the first sample per timestamp and the live one is the second. During the fault only the
# error series were visible - new label sets, no collision - which is why A6 read "100 % errors at
# 0.137 req/s" and a restart could not fix it.
#
# **This block was restored first, and it was not the fix.** It is the demo's own ingestion
# setting and it stays for parity with `src/prometheus/prometheus-config.yaml` at tag 2.2.0 -
# the list is verbatim, unused entries included, so a diff shows nothing but the comments - but
# measured after the reload, every accounting series carried `host_name="docker-desktop"`: the
# demo's `resourcedetection` processor stamps the collector host's name over the app's before the
# connector ever sees the span, so old container and new were still one series and the live
# one was still refused. **The fix is upstream, in `otelcol-extras-v2.yml`**: the connector is
# keyed on the service rather than on every resource attribute, so a recreated container
# continues its service's counters instead of starting a rival copy. Every rule and capture
# query aggregates by `service_name`, so nothing promoted here changes any rule's arithmetic.
otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - container.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - kafka.cluster.alias
    - collector.instance.id

# Also the demo's: the two writers stamp their samples inside the same flush, and without an
# out-of-order window the second is refused as out of order rather than merely as a duplicate.
storage:
  tsdb:
    out_of_order_time_window: 30m

# `/etc/faultline` is `compose/prometheus/` mounted as a DIRECTORY rather than as two individual
# files, so that a rule file replaced by `git am` is actually seen by a container that is already
# running - see the block on `prometheus` in `compose/telemetry-v2.yml`, which carries the
# measurement. The file keeps its repository name inside the container, so a shell in there cannot
# mistake it for v1's.
rule_files:
  - /etc/faultline/alert-rules-v2.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Prometheus's own metrics, which no push covers. The collector's internal telemetry reaches this
# server over OTLP with everything else, so it needs no job of its own here.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
