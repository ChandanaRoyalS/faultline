# T7.1 - the alert rules, ported to the v2 world.
#
# **The logic is unchanged and that is the finding.** All three rules aggregate
# `sum by (service_name)` over span metrics and name no service except the one exclusion, so the
# v1 -> v2 service renaming (`cartservice` -> `cart`, `adservice` -> `ad`, and the rest) costs
# nothing here. `frontend-proxy` is spelled identically in both worlds, so the exclusion ports
# verbatim.
#
# **What does change is the metric names, because v2 runs `spanmetrics` as a CONNECTOR.**
# v1's collector runs it as a processor in the traces pipeline
# (`processors: [memory_limiter, spanmetrics, batch]`) and emits `calls_total` / `latency_bucket`.
# v2 wires it as an exporter on traces and a receiver on metrics
# (`exporters: [otlp, debug, spanmetrics]`, `receivers: [..., spanmetrics]`), which emits under a
# `traces_span_metrics_` namespace with the histogram in milliseconds:
#
#   calls_total     ->  traces_span_metrics_calls_total
#   latency_bucket  ->  traces_span_metrics_duration_milliseconds_bucket
#
# **Read off v2's own Grafana dashboards rather than inferred from the connector's defaults**
# (`src/grafana/provisioning/dashboards/demo/*.json` at tag 2.2.0 query these names directly), so
# this is what the world actually emits and not what the documentation says it should.
#
# **The thresholds are v1's and are still provisional.** 5% errors and 250 ms p95 were grounded in
# a measured baseline on the v1 world (T1.3). **They are not evidence here** until a quiet v2 world
# is measured against them, and nothing may be scored on them until it is.
#
# **The rate windows, however, are v2's and are measured** (2026-09-22,
# `docs/evidence/world-v2-trial/2026-09-22-the-first-baseline.md`). The first quiet baseline
# reported p95s of 15000 ms on six services and error ratios reaching 100% on a world with nothing
# injected. None of it was behaviour: most of v2 ran at 0.05-0.15 req/s, so a `[2m]` window held
# **six to eight samples**, a p95 over six spans is the maximum, and one failed call in six is
# 16.7%.
#
# **Two levers were tried and only the pair works.**
#
# Raising `LOCUST_USERS` 5 -> 25 (`world-v2.override.yml`) bought a real **2.6-4.5x**, which is
# **sublinear** - the note that proposed it called the linear assumption a hypothesis and the
# hypothesis is falsified. More importantly it **cannot reach every service**: `image-provider`
# measured **0.100 req/s before and 0.100 after**, unmoved by five times the load, so no amount of
# load makes it measurable.
#
# So the windows widen from `[2m]` to `[5m]`. At 25 users that puts every service, `image-provider`
# included, over thirty samples per window.
#
# **What it costs, and why that is affordable here specifically.** First fire moves from about four
# minutes to about seven. That would be the wrong trade for spike detection and is the right one
# here, because **every fault this benchmark injects is sustained** - a wrong image, a reverted
# config, a flag left on - and persists until the harness reverts it. A longer window delays the
# detection of a sustained fault; it does not miss it.
#
# **What was considered and rejected**: a minimum-traffic guard on each rule, which is idiomatic
# here (`ServiceNoTraffic` already carries two guards). It would make a fault on a quiet service
# undetectable by construction, and `payment` - at 0.133 req/s, one of the quietest - is on the
# checkout path.
groups:
  - name: faultline-slo
    interval: 15s
    rules:
      - alert: ServiceHighErrorRate
        expr: |
          sum by (service_name) (rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m]))
          /
          sum by (service_name) (rate(traces_span_metrics_calls_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          signal: errors
        annotations:
          summary: "{{ $labels.service_name }} error rate above 5%"
          description: "{{ $labels.service_name }} is failing {{ $value | humanizePercentage }} of calls. NOTE: the 5% threshold is inherited from the v1 world and has no measured baseline here yet."

      - alert: ServiceHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket[5m]))
          ) > 250
        for: 3m
        labels:
          severity: warning
          signal: latency
        annotations:
          summary: "{{ $labels.service_name }} p95 latency above 250ms"
          description: "p95 is {{ $value | printf \"%.0f\" }}ms. NOTE: the 250ms threshold is inherited from the v1 world, where it was grounded in a measured baseline; v2 has no baseline yet. A container recreated in the last few minutes is still warming up and is not a baseline reading."

      - alert: ServiceNoTraffic
        # Both guards are v1's and both still apply, for reasons that survive the world move:
        #   1. Fires only for services that WERE serving and then stopped.
        #   2. Excludes frontend-proxy - Envoy, which emits a few spans at startup and none
        #      after, so "no traffic" is its healthy steady state. v2 spells the service
        #      `frontend-proxy` exactly as v1's container was named, so this ports verbatim.
        # An alert that fires on a healthy system trains its reader to ignore it.
        expr: |
          sum by (service_name) (rate(traces_span_metrics_calls_total{service_name!="frontend-proxy"}[5m])) == 0
          and
          sum by (service_name) (rate(traces_span_metrics_calls_total{service_name!="frontend-proxy"}[30m] offset 10m)) > 0
        for: 3m
        labels:
          severity: critical
          signal: availability
        annotations:
          summary: "{{ $labels.service_name }} is serving no traffic"
          description: "No calls recorded for 3 minutes on a service that normally serves continuously."
