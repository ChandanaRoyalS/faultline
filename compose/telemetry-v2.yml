# T7.1 - Faultline's telemetry stack, overlaid on the v2 world.
#
# The same job `telemetry.yml` does for v1: the demo ships metrics, traces and Grafana but no log
# store Faultline's log analyst can read and no Alertmanager, so this adds Loki, Promtail, Tempo
# and Alertmanager, and points the demo's own Prometheus, Grafana and collector at Faultline's
# configuration. Everything is version-pinned for the same reason.
#
# **Four differences from the v1 file, every one forced by v2 rather than chosen:**
#
#   1. The collector's service key is `otel-collector`, not `otelcol`.
#   2. Prometheus must keep `--web.enable-otlp-receiver`. See the block on that service - it is
#      the one change here that fails silently.
#   3. v2 ships OpenSearch as its log store and its collector has a `logs` pipeline aimed at it.
#      Loki and Promtail are added beside that rather than replacing it, because Promtail reads
#      container stdout through the Docker socket and does not care what else is collecting.
#      Whether OpenSearch survives into the world proper is a separate decision; it is left alone
#      here so this overlay changes as little as possible.
#   4. v2's Grafana already provisions its own datasources; Faultline's Loki and Tempo files are
#      mounted alongside them under the same provisioning directory, not over it.
#
# **A fifth difference is NOT forced by v2 and is a defect fix v1 has not received**: Prometheus and
# Alertmanager take their config from a mounted *directory* rather than from individual files. The
# measurement that produced it is on the `prometheus` service below. v1 is left as it is on purpose
# - every published figure was measured on that world, and it is not changed for tidiness while it
# is still the reference.
services:
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          memory: 400M

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../compose/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 200M

  # The trace store the trace tool reads, beside the demo's own Jaeger, which stays as the demo's
  # UI. **The config is v2's own file** (Q91): v1's `tempo.yaml` is in v1's observability digest;
  # v2 needed compaction bounded and v1 did not, so the tuning lives in `tempo-v2.yaml`.
  #
  # **The limit is measured on this world, not carried from v1's 400M** (Q91, 2026-09-24). With
  # the compaction bounds in place Tempo was still OOM-killed, 51 minutes in, the moment the trace
  # tool searched one id across a dozen 30-second blocks. `container_memory_usage_total_bytes`
  # from the collector's `docker_stats` over that life: **idle 150 MiB four minutes after a clean
  # start; sampled peak 374 MiB** (the kill itself, above 400, fell between samples); and the
  # curve is a sawtooth, not a climb - 102, 275, 138, 322, 147 MiB at consecutive five-minute
  # steps - as blocks complete and compact. A query landing on the top of a swing is what went
  # over. So: peak 374 + two ~220 MiB swings coinciding (compaction and a query) ~ 815 -> 1024M,
  # with GOMEMLIMIT at 75% so the Go runtime sees the ceiling before the kernel does.
  # `tests/test_world_v2.py` pins the limit to at least twice the sampled peak.
  tempo:
    image: grafana/tempo:2.4.2
    container_name: tempo
    command: -config.file=/etc/tempo/tempo.yaml
    environment:
      GOMEMLIMIT: 768MiB
    volumes:
      - ../compose/tempo-v2.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"
    deploy:
      resources:
        limits:
          memory: 1024M

  grafana:
    volumes:
      - ../compose/grafana-loki-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - ../compose/grafana-tempo-datasource.yml:/etc/grafana/provisioning/datasources/tempo.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - --config.file=/etc/faultline/alertmanager.yml
      - --web.listen-address=:9093
    # Mounted as a directory for the reason given on `prometheus` below. Alertmanager also has a
    # reload endpoint, and its config is the one most likely to be edited while the world is up.
    volumes:
      - ../compose/prometheus:/etc/faultline:ro
    ports:
      - "9093:9093"
    deploy:
      resources:
        limits:
          memory: 200M

  otel-collector:
    volumes:
      - ../compose/otelcol-extras-v2.yml:/etc/otelcol-config-extras.yml:ro
    depends_on:
      tempo:
        condition: service_started
    # 200M -> 400M by the headroom rule stated in `world-v2.override.yml`'s last block, where the
    # measurement is: an 8-hour one-minute high of 192 MiB (96%), and the cgroup at its limit 116
    # times. The demo's own `memory_limiter` values are left as they are (`otelcol-extras-v2.yml`).
    deploy: { resources: { limits: { memory: 400M } } }

  # **`--web.enable-otlp-receiver` is load-bearing and this overlay is why it could go missing.**
  # Replacing `command:` replaces it wholesale, and v2's collector does not expose a scrape
  # endpoint - it PUSHES to http://prometheus:9090/api/v1/otlp. Drop that flag and Prometheus
  # starts cleanly, stays healthy, scrapes its one job, and receives no application metrics at
  # all: no failing container, no error in any log, every alert rule evaluating against an empty
  # series. Restated here with the rest of v2's command for exactly that reason.
  #
  # `--enable-feature=exemplar-storage` is carried over for the same reason: it is v2's, and
  # dropping it silently loses exemplars rather than failing.
  #
  # Retention is 15d against v2's own 7d - T7.1's argument on the v1 world, where six hours once
  # cost a backfill that could never be taken again.
  #
  # **The config is mounted as a DIRECTORY, and that is a measured fix rather than a style choice**
  # (2026-09-22, `docs/evidence/world-v2-trial/2026-09-22-the-mount-that-detached.md`).
  #
  # These two files were mounted individually, which is what every config in this repo does and
  # what the v1 file still does. A single-file bind mount binds the host **inode**, not the path.
  # `git am` and `git checkout` do not edit a file in place - they write a new one and rename it
  # over the old - so the moment a merge touched `alert-rules-v2.yml`, the running container's
  # mount pointed at an inode the host directory no longer named, and the path inside the container
  # became `ENOENT`. Measured, in Prometheus's own words:
  #
  #   loading groups failed ... open /etc/prometheus/alert-rules.yml: no such file or directory
  #   Failed to apply configuration ... error loading rules, PREVIOUS RULE SET RESTORED
  #
  # **The last clause is the whole danger.** Prometheus kept serving the rules it already had, the
  # containers all reported `Running`, `docker compose up -d` recreated nothing because no compose
  # *path* had changed, and `/api/v1/rules` answered - with the old windows. A 45-minute baseline
  # was taken against rules that had been silently frozen for two hours, and it looked like a
  # result. A directory mount resolves the name on every lookup, so a renamed-over file is seen.
  #
  # `/etc/faultline`, not `/etc/prometheus`: mounting over `/etc/prometheus` would shadow the
  # image's own `consoles/` and `console_libraries/`, which two flags below point at. The new path
  # also means the file is called `alert-rules-v2.yml` inside the container, so a shell in there
  # can no longer confuse the two worlds' rules. v1's `alert-rules.yml` and `prometheus-config.yaml`
  # are visible in that directory and referenced by nothing here; they are the v1 world's and this
  # container never opens them.
  prometheus:
    volumes:
      - ../compose/prometheus:/etc/faultline:ro
    command:
      - --config.file=/etc/faultline/prometheus-config-v2.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.templates=/etc/prometheus/consoles
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.enable-lifecycle
      - --web.route-prefix=/
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    # 200M -> 400M by the same rule (`world-v2.override.yml`, last block): an 8-hour one-minute
    # high of 195 MiB, and the cgroup at its limit 3,751 times, with the kernel reclaiming its
    # chunk cache to stay under. Every capture a bundle holds is read from this container.
    deploy: { resources: { limits: { memory: 400M } } }
