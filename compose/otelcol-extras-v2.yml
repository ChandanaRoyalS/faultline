# T7.1 - the collector's second `--config` on the v2 world.
#
# v2 keeps v1's merge point: its command is
# `[ "--config=/etc/otelcol-config.yml", "--config=/etc/otelcol-config-extras.yml" ]` and the
# extras path is a mount, so Faultline's file goes over it from this repository rather than into
# the gitignored clone - the same argument `otelcol-extras.yml` makes for v1.
#
# **The exporter list is restated on purpose and the reason is unchanged from v1**: the collector
# merges configs by *replacing* lists, not appending to them. A list naming only `otlp/tempo`
# would silently stop Jaeger and `spanmetrics` receiving anything - and stopping `spanmetrics`
# would take every alert rule with it, since all three read `traces_span_metrics_*`. v2's own list
# is `exporters: [otlp, debug, spanmetrics]`, read from `src/otel-collector/otelcol-config.yml` at
# tag 2.2.0.
#
# **Two differences from the v1 extras file, both from v2's own pipeline:**
#   - `debug` replaces v1's `logging` exporter, which v2 no longer defines.
#   - `spanmetrics` is in the *exporter* list because v2 runs it as a connector; v1 has it as a
#     processor in `processors:`. Dropping it here is the silent failure described above.
#
# The `memory_limiter` values are v1's and are deliberately not copied: v2 sets its own limits in
# `src/otel-collector/otelcol-config.yml` against a 200M container, where v1's were tuned to a
# 600M one. Overriding them on an unmeasured world would be carrying a number across a world
# boundary, which is the mistake `alert-rules-v2.yml` also refuses to make.
exporters:
  otlp/tempo:
    # 4417, not 4317: Tempo's receiver is kept off the port every SDK targets, so a client that
    # reconnects to a stale address never mistakes Tempo for the collector (Q95, `tempo-v2.yaml`).
    endpoint: "tempo:4417"
    tls:
      insecure: true
    # **A Tempo outage must cost traces, not alerts** (Q93, measured 2026-09-24). With the
    # defaults - retries for up to five minutes, a queue of a thousand batches - Tempo going down
    # at 02:00 made this exporter queue and retry until the collector's memory limiter tripped
    # (`Memory usage is above soft limit. Refusing data.` at 02:01:52) and the OTLP receiver
    # started refusing EVERY service's spans (`product-catalog`: `data refused due to high memory
    # usage`, `sending queue is full`). Refused spans never reach the spanmetrics connector, so
    # the alert rules read a quiet world while a trace store was down - the same silent species
    # as the two-writer bug, from the other end of the pipeline.
    #
    # No retries: a failed send is dropped at once and logged, the queue stays near empty, memory
    # stays flat, and the receiver keeps accepting. Traces emitted while Tempo is down are lost,
    # which they were anyway; the metrics and the other exporters are not. The queue is kept and
    # kept small so a momentary blip still smooths out without accumulating.
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: true
      queue_size: 200

# **A recreated container must continue its service's counters, not start a second copy of
# them.** Measured 2026-09-23 during T7.0's A6 (`2026-09-23-the-writer-that-was-not-single.md`):
# the connector keys its per-resource metrics on *every* resource attribute by default, so a
# container recreated by `compose up -d` - new `container.id`, new `process.pid` - is a new
# resource, and the connector goes on emitting the dead one's flat counters, first, on every
# flush, for ever (`metrics_expiration` defaults to never). Prometheus names the series by
# `service.name` alone (the .NET SDK sets no `service.instance.id`), keeps the first sample per
# timestamp, and refuses the live container's as a duplicate: a healthy, exporting `accounting`
# read `0.000 req/s` and `ServiceNoTraffic` fired on it. Promoting resource attributes on the
# Prometheus side (the demo's `otlp:` block, restored in `prometheus-config-v2.yaml`) could not
# separate them on this world, because the `resourcedetection` processor two lines up the demo's
# traces pipeline stamps every resource's `host.name` with the collector host's - `docker-desktop`
# on every series, old container and new alike.
#
# This is the connector README's own remedy, in its own words: *"Use this in case changing
# resource attributes (e.g. process id) are breaking counter metrics."* Keyed on the service and
# its SDK, every container that has ever run as `accounting` is one resource, one counter, one
# writer; a recreate is a continuation rather than a rival. The list is the README's recommended
# one at the pinned 0.142.0. It changes no metric name, no dimension and no rule.
#
# **The file is a single-file bind mount, so a change here needs `up -d --force-recreate
# otel-collector`, not a restart** - the mount binds the inode, and `git am` replaces the file
# (`2026-09-22-the-mount-that-detached.md`). The collector has no reload, so a recreate is the
# only path anyway; its counters restart from zero, which `rate()` reads as one reset.
connectors:
  spanmetrics:
    resource_metrics_key_attributes:
      - service.name
      - telemetry.sdk.language
      - telemetry.sdk.name

service:
  pipelines:
    traces:
      exporters: [otlp, debug, spanmetrics, otlp/tempo]
