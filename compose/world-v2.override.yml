# T7.1 - the v2 world's headroom override, and it is NOT `world-arm64.override.yml` ported.
#
# **The arm64 file's stated reason does not apply here.** Its header says the demo's limits are
# "tuned for native x86" and that "under emulation on Apple Silicon the same workloads use more
# memory and sit at their ceilings". The 2026-09-22 trial measured v2 at `arm64/linux` **native**
# on the development machine - every image multi-arch, nothing emulated, 28 of 28 containers up on
# the first attempt with no override at all
# (`docs/evidence/world-v2-trial/2026-09-22-the-first-bring-up.md`). v1 by contrast logs
# "The requested image's platform (linux/amd64) does not match the detected host platform
# (linux/arm64/v8)" for sixteen services, which is the condition ADR-0005 described and v2 ends.
#
# **So this file exists for a different reason, and only for the containers that need it.**
# Two services sat at their ceilings *while idle* in that trial, which is the state the pre-flight
# gate refuses (`evalharness.gate`, 90% of limit):
#
#   llm       49.68 MiB / 50 MiB   = 99.4%
#   flagd-ui  187.1  MiB / 200 MiB = 93.5%
#
# Raised, not removed, so genuine runaway memory is still caught - the same discipline the arm64
# file states and the reason it was never a `mem_limit: 0`.
#
# **Measured, not guessed**: each new limit puts the observed idle figure near a third of the
# ceiling, which is where the rest of this world's services already sit and comfortably under the
# gate's 90%.
#
# **Two more were watched and deliberately left alone.** kafka at 485.9/620 (78%) and opensearch
# at 786/1024 (77%) are under the gate and are not raised on one idle reading; v1's kafka needed a
# *heap cap* rather than a raise (T7.27), and doing that here before this world has a measured
# growth trajectory would be copying a fix across a world boundary. If either trips the gate under
# load, that is a measurement and it gets its own row.
#
# **kafka tripped the gate on 2026-09-22 and this is that row.** opensearch has not and stays out.
services:
  llm:
    deploy: { resources: { limits: { memory: 150M } } }

  flagd-ui:
    deploy: { resources: { limits: { memory: 400M } } }

  # **The world is too quiet to measure, and this is the measured reason**
  # (`docs/evidence/world-v2-trial/2026-09-22-the-first-baseline.md`).
  #
  # v2's own `.env` ships `LOCUST_USERS=5` where v1 ships **10**, and spreads it across roughly
  # twice as many span-emitting services. The first 45-minute quiet baseline measured most of the
  # world at **0.05-0.15 req/s** - one request every ten to twenty seconds - so a `[2m]` rate
  # window sees **six to eight samples** on `payment`, `fraud-detection` and `ad`.
  #
  # At that density a p95 is the maximum of a handful of spans and lands in the histogram's top
  # bucket, and a single failed call is a 16.7% error ratio. The baseline duly reported **15000 ms
  # p95 on six services and error ratios to 100%** on a world with nothing injected, and fired
  # `ServiceHighLatency` twice. **None of that is behaviour; all of it is sampling noise.**
  #
  # **Raised rather than widening the rule windows**, which would buy the same sample count by
  # slowing first-fire from four minutes to thirteen on a loop that already carries a 300 s settle
  # - fixing the instrument to fit a thin world rather than the world. And rather than raising the
  # thresholds, which would fit these numbers by making them unable to detect a real fault either.
  #
  # **25 was a hypothesis with its arithmetic attached, and the measurement falsified part of it**
  # (2026-09-22, ten minutes after the raise). The reasoning was: a stable p95 wants ~30 samples per
  # 2m window, so >= 0.25 req/s; the quietest measured 0.050, which is 5x, and 5 x 5 = 25 *if* load
  # scales linearly. **It does not.** Measured after the raise:
  #
  #   payment          0.050 -> 0.133  (2.7x)     fraud-detection  0.052 -> 0.233  (4.5x)
  #   accounting       0.078 -> 0.200  (2.6x)     currency         0.073 -> 0.317  (4.3x)
  #   quote / shipping 0.075 -> 0.250  (3.3x)     email            0.100 -> 0.267  (2.7x)
  #   **image-provider 0.100 -> 0.100  (1.0x)**
  #
  # **`image-provider` did not move at all under five times the load**, so its rate is not a
  # function of user count and no raise reaches it. That is why the alert rules' windows widened to
  # `[5m]` rather than the load rising further - see `prometheus/alert-rules-v2.yml`, which carries
  # the argument. **25 stays** because 2.6-4.5x is a real gain and the pair is what works; it is
  # kept as a measured figure now rather than a hypothesis.
  load-generator:
    environment:
      LOCUST_USERS: 25

  # **kafka: 620M -> 1024M, and v1's remedy is falsified here rather than inherited**
  # (`docs/evidence/world-v2-trial/2026-09-22-the-recycle-that-does-not-recycle.md`).
  #
  # The gate refused a v2 sweep with kafka at 92.08%. v1's documented answer is a recycle - T7.30
  # measured 99.87% -> 26.27% - and `evalharness.sweep` runs it automatically. **Measured here it
  # bought three points: 92.08% -> 88.81%.**
  #
  # **Because it is not the same phenomenon.** v2 ships `-Xms400m` equal to `-Xmx400m`, so the JVM
  # commits its entire heap at startup and a restart re-commits it immediately. v1's growth was
  # Rosetta translation cache, which accumulates and is genuinely freed by a restart; this world
  # is native arm64 and has no Rosetta at all. Measured, 30 seconds after `docker restart kafka`:
  #
  #   anon 482.1 MiB  =  400 MiB committed heap  +  82 MiB non-heap
  #
  # **A freshly restarted kafka sits at 88.8% of 620M**, and the gate's guard is 90%. The
  # container is not near its limit because it grew - **it starts there.** No recycle cadence
  # fixes that, and on this world the gate would refuse nearly every sweep.
  #
  # **The number, reasoned rather than picked.** 400 MiB of committed heap is an irreducible
  # floor. Non-heap measured 82 MiB fresh and 164 MiB after five hours. 1024M puts a fresh
  # container at 54% and a five-hour-old one at ~58%, leaving ~330 MiB under the gate's 90% guard
  # - about twenty hours at the observed growth, which covers any sweep - while still catching
  # genuine runaway. It matches opensearch's existing ceiling and costs ~400 MiB on a machine
  # measured with 11 GB free.
  #
  # **Raised now specifically because it is free now and will not be later.** `rehearse` says in
  # as many words that raising a limit is the remedy that must not be taken, because the file
  # holding it feeds `world.compose_digest` and editing it invalidates every recorded bundle
  # (ADR-0014). That argument is exactly right for v1 and does not yet bind here: **no v2 bundle
  # exists**, and `InjectorSettings.compose_files` still names v1's three files, so nothing
  # currently digests this file at all. The second half of that is its own gap and is recorded in
  # the note rather than fixed here. The window closes the moment the injector is migrated.
  #
  # **Provisional, and Q88 is what settles it.** A ceiling only helps if the non-heap growth
  # plateaus. 82 -> 164 MiB in five hours is a doubling, and if it is linear rather than
  # asymptotic then no limit is sufficient and the answer is a heap or direct-buffer cap instead.
  # A sampler is collecting `anon` every five minutes; this figure moves if the curve says so.
  # **kafka's log directory is a size-capped tmpfs, so that a disk can be filled on purpose**
  # (T7.0 attempt A8, `evals/runs/PREREGISTRATION-T7.0.md`).
  #
  # The plan names disk fill as a fault class. ADR-0029's T7.0 addendum killed it because the
  # world declares no volumes: every container writes to its own overlay layer, which is the
  # host's disk, so a fill cannot be aimed at one service without taking the platform down with
  # it. That was a fact about the world as shipped. **The world is being re-founded, and giving
  # one service a bounded disk is a one-line change that is free right now** - no v2 bundle exists
  # and nothing digests this file yet - and will not be free once the injector is migrated.
  #
  # kafka's data lives at `/tmp/kraft-combined-logs` (apache/kafka:3.9.1's `log.dirs` default,
  # confirmed 2026-09-22 when `/var/lib/kafka/data` was 4.0K). A 256 MiB tmpfs there is enough for
  # the demo's traffic - ~1 KiB per order at 0.15 orders/s is ~13 MiB a day - and small enough to
  # fill in seconds. A Kafka broker whose only log dir cannot be written **halts**, which is what
  # a real disk-full outage does to a real broker, and `restart: unless-stopped` then crashloops
  # it against the still-full directory until the fill is removed or the container is recreated.
  #
  # **Why tmpfs and not a volume**: Docker Desktop cannot size-cap a disk volume. tmpfs can, and
  # its pages are charged to the cgroup of the process that writes them - `docker exec kafka dd`
  # runs inside kafka's cgroup, so the fill costs kafka up to 256 MiB of the 1024M ceiling above,
  # and cannot cost anything else on the machine. That is the whole blast radius, and it is why
  # this could not have been done at the shipped 620M.
  #
  # **The cost stated**: kafka's data is ephemeral across container recreation. It already was in
  # practice - the demo declares no volume for it - and orders are the only topic.
  #
  # If disk fill is measured not to page, this mount is removed in the same patch that records
  # why. If it pages, it stays and becomes the mechanism's precondition.
  kafka:
    deploy: { resources: { limits: { memory: 1024M } } }
    volumes:
      - type: tmpfs
        target: /tmp/kraft-combined-logs
        tmpfs:
          size: 268435456
