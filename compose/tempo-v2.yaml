# T7.0 - Grafana Tempo on the v2 world. `compose/tempo.yaml` is v1's, and is an input to v1's
# `observability_digest`, so v2's tuning lives here rather than there: editing v1's file would
# orphan every v1 bundle for a change v1 never needed.
#
# Everything below `compactor:` that is not in v1's file is the answer to Q91, measured 2026-09-24:
# Tempo was OOM-killed (`OOMKilled=true`, exit 137) 35 seconds after a restart, five seconds into
# its first compaction - four vParquet3 blocks merged at once on a store carrying 45 live blocks and
# 154 compacted metas - and again on the next restart, because the blocks were still there. On v1
# Tempo already idled at 92-95% of its 400 MiB limit (`telemetry.yml`); v2 emits more spans, the
# 30-second block cut that ADR-0037 requires (kept - see tempo.yaml for why 5m blinded the trace
# tool) makes many small blocks, and **the parquet writer buffers a 100 MiB row group by default**
# per output block while compacting. Under GOMEMLIMIT 320 MiB that is the peak.
#
# Bounded rather than the limit raised: the row group is capped at 10 MiB and a compacted block at
# 100 MiB, which keeps compaction's working set in tens of megabytes. **That was not enough on its
# own.** With the bounds in place Tempo lived 51 minutes and was killed the moment the trace tool
# searched one id across a dozen 30-second blocks - a second peak, on the query path. The limit was
# then measured rather than inherited (`container_memory_usage_total_bytes`: idle 150 MiB, sampled
# peak 374 MiB, a ~220 MiB sawtooth as blocks complete and compact) and set in `telemetry-v2.yml`
# at 1024M / GOMEMLIMIT 768MiB from that arithmetic. The bounds stay: they are what keep the
# sawtooth's amplitude where it was measured.
#
# Storage is ephemeral (only this file is mounted), so a `--force-recreate` starts it empty.

server:
  http_listen_port: 3200

# **The receiver is deliberately NOT on 4317** (Q95, measured 2026-09-24). Every SDK in the world
# is configured with `otel-collector:4317`, and a gRPC client only re-resolves that name after a
# connection attempt *fails*. When `tempo` and `otel-collector` were recreated together at 03:31,
# Tempo came up on the collector's former address (172.18.0.15); clients reconnecting to the
# address they had cached found an OTLP server on 4317 - this receiver - that accepts traces and
# refuses metrics, and stayed on it: `frontend`, `recommendation`, `product-reviews` and
# `image-provider` sent their traces here and bypassed the spanmetrics connector for two and a
# half hours (no series, no page on any of them - R2 measured the freeze without its caller's
# alert), while `product-catalog`'s metrics channel logged `unknown service MetricsService` once a
# minute. On a port no SDK targets, a stale address:4317 is refused, the client re-resolves, and
# the world heals itself at the next recreate instead of silently splitting.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4417

ingester:
  # ADR-0037: 30s so the trace tool is never more than a block behind the incident it explains.
  max_block_duration: 30s
  max_block_bytes: 52428800
  complete_block_timeout: 2m

compactor:
  compaction:
    block_retention: 24h
    # A compacted block may not exceed 100 MiB (default 100 GiB): with 30-second input blocks the
    # compactor would otherwise merge a day into one output and hold its row groups while doing so.
    max_block_bytes: 104857600

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    block:
      # The parquet row group the writer buffers in memory before flushing: 10 MiB, not the
      # default 100 MiB. This is the knob the OOM was about.
      parquet_row_group_size_bytes: 10485760

usage_report:
  reporting_enabled: false
