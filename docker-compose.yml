# Faultline compose profiles (T0.3).
#   --profile platform : Faultline's own services (Postgres, Redis, and later the API/worker)
#   --profile world    : the target environment - OTel demo + Prometheus/Loki/Grafana (T1.1-T1.2)
#   --profile eval     : eval-harness runs (Phase 4)
services:
  postgres:
    # pgvector, not plain postgres: ADR-0002 puts the vector store inside the system of
    # record, and postgres:16-alpine has no `vector` extension to enable (T2.4b, ADR-0018).
    #
    # Free to change: this file is NOT one of the three inputs to `world.compose_digest`
    # (ADR-0014 digests world/docker-compose.yml and the two compose/ world overrides), so
    # editing it invalidates no recorded bundle.
    #
    # Same PG major, different base image - alpine is musl and this is glibc, so an existing
    # pgdata volume carries a collation mismatch. Recreate it (`docker compose --profile
    # platform down -v`); the only data in it is the T2.2 smoke's incidents, already captured
    # in docs/evidence/t2.2-live-smoke/final-state.txt.
    image: pgvector/pgvector:pg16
    profiles: ["platform", "eval"]
    environment:
      POSTGRES_USER: faultline
      POSTGRES_PASSWORD: faultline-dev   # dev only; real secrets via .env
      POSTGRES_DB: faultline
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultline"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["platform", "eval"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # The evidence archive (T2.3, ADR-0034). S3-compatible, so the code that runs against this
    # in development runs against S3 itself in a deployment - `ArchiveSettings.endpoint_url`
    # is the only difference.
    #
    # Free to change, for the same reason postgres records above: this file is not one of the
    # three inputs to `world.compose_digest`, so editing it invalidates no recorded bundle.
    #
    # **The image: Bitnami's legacy build of the same MinIO release, since 2026-10-15.** MinIO
    # stopped publishing community images, and `RELEASE.2025-04-22T22-12-26Z` stopped resolving on
    # both Quay (this file's source since 2026-09-11, when Docker Hub first refused anonymous
    # pulls) and Docker Hub; CI's integration job failed on it from 2026-10-11 (docs/DEVIATIONS.md,
    # T0.2). `bitnamilegacy/minio:2025.4.22` is the same 2025-04-22 release, in a repository Bitnami
    # froze rather than updates, so the tag cannot move under us - and Bitnami has said the legacy
    # repositories are not permanent, which is the risk this pin carries and the reason it is
    # named here.
    #
    # **It starts differently**, and the service follows it: Bitnami's own entrypoint runs the
    # server (so there is no `command:`), keeps its data under `/bitnami/minio/data`, runs as a
    # non-root user and serves the console on 9001 by default. The health check reads MinIO's own
    # liveness endpoint rather than `mc ready local`, which depended on the upstream image's
    # client config.
    #
    # **A new volume, `miniodata-bitnami`, not the old `miniodata`.** The upstream image ran as
    # root, so a `miniodata` volume it created is root-owned, and Bitnami's non-root server cannot
    # write into it: on the owner's Mac the first start exited on `/bitnami/minio/data/.root_user:
    # Permission denied` (2026-10-15) while a fresh volume - every clean clone, and CI - works. A
    # separate name leaves any old volume and its contents untouched rather than chowning or
    # deleting them; anything archived under the old image is not carried across, and the archive
    # is off by default (ADR-0034).
    image: docker.io/bitnamilegacy/minio:2025.4.22
    profiles: ["platform", "eval"]
    environment:
      MINIO_ROOT_USER: faultline
      MINIO_ROOT_PASSWORD: faultline-dev   # dev only; real secrets via .env
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata-bitnami:/bitnami/minio/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus-self:
    # T6.6 / Q73: the platform's own Prometheus, scraping the platform's own `/metrics` (piece 3).
    # **Its own, not the world's** - `compose/prometheus/self.yaml` carries the argument: the
    # world's Prometheus config is inside `observability_digest`, the harness reads that target
    # set as a measurement, and the agent's own counters must not be one `promql_query` away from
    # the agent. This service is deployment configuration on the platform's project, the same
    # standing as postgres above; editing it invalidates no recorded bundle.
    #
    # 9091 on the host, because 9090 is the world's Prometheus. Grafana - the world's - reaches it
    # here at `host.docker.internal:9091` through the datasource `scripts/provision_dashboards.py`
    # pushes, the way it pushes the dashboards (ADR-0030). `extra_hosts` gives the scrape target's
    # name a meaning on a Linux host, where Docker Engine does not define it; on Docker Desktop
    # the entry is redundant and harmless (compose/linux-host-gateway.override.yml explains).
    image: prom/prometheus:v2.54.1
    profiles: ["platform"]
    ports: ["9091:9090"]
    volumes: ["./compose/prometheus/self.yaml:/etc/prometheus/prometheus.yml:ro"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    extra_hosts: ["host.docker.internal:host-gateway"]

  # T1.1-T1.3 add here (world profile): OpenTelemetry demo services, Prometheus, Loki,
  # Grafana, Alertmanager. Deliberately absent until Phase 1 - see the execution plan.

volumes:
  pgdata:
  miniodata-bitnami:
