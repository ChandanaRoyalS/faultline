# T2.3: "migrations from day one". See docs/adr/0033-migrations.md.
#
# There is deliberately no `sqlalchemy.url` here. env.py takes the DSN from
# OrchestratorSettings, so a migration run and the process it migrates for read the same
# configuration from the same place - a URL in this file would be a second source that drifts
# silently, and a migration pointed at the wrong database is not a failure you notice quickly.
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
