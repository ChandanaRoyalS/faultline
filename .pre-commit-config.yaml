default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # CAPTURED EVIDENCE is never rewritten. The class: anything recorded from the
      # running world rather than authored by hand - metric JSON, container logs, and the
      # summaries generated from them. A formatting hook that strips a trailing space or
      # adds a final newline makes the committed file something other than what the world
      # produced, and a faithful record is the entire point of these trees.
      #
      # Listed by directory because a regex cannot tell a capture from source, and the two
      # live side by side: evals/scenarios/*.yaml IS authored and must stay formatted, while
      # evals/scenarios/artifacts/ under it is not. Adding a directory that holds captures
      # means adding it here. See evals/scenarios/ARTIFACTS.md.
      #
      # Three trees now, each added after a hook had already rewritten a capture in it:
      # bundles, then baselines, then docs/evidence. The cost of listing whole directories
      # is that the authored files inside them - incident.md, and each evidence README -
      # stop being formatted too. That is the trade already accepted for incident.md, and
      # it is the cheap side: an unformatted README is untidy, a rewritten capture is a
      # record of something the world did not produce.
      #
      # Only the rewriting hooks are excluded. check-yaml, check-json,
      # check-added-large-files and detect-private-key still apply to all three: they read
      # and never write, and they are exactly the guards captures should keep.
      - id: trailing-whitespace
        exclude: &captured_evidence |
          (?x)
          ^(
              evals/scenarios/artifacts   # rehearsal bundles
            | evals/baselines             # quiet-world captures
            | docs/evidence               # webhook payloads, service logs, psql dumps
          ) /
      - id: end-of-file-fixer
        exclude: *captured_evidence
      - id: check-yaml
      - id: check-json
      # docs/spec/ holds the two specification PDFs. They are committed once, never
      # change, and are the documents this repo is judged against - the one legitimate
      # large binary here. The default guard stays for everything else.
      - id: check-added-large-files
        exclude: ^docs/spec/
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: block AI co-author trailers in commit messages
        language: pygrep
        entry: '(?i)(co-authored-by:.*(claude|anthropic)|generated with.*claude)'
        stages: [commit-msg]
      # T7.47: branch-before-commit was a rule followed by memory, and it failed once -
      # T7.46 committed to main and was caught only because the push had no branch to match.
      # Every one of the last 40 commits on main carries a `(#NN)` squash-merge suffix, so
      # nothing legitimate commits there locally, and merges happen on GitHub's side where
      # this hook never runs. Escape hatch: `git commit --no-verify`.
      - id: no-commit-on-main
        name: refuse a commit on main (branch first)
        language: system
        entry: scripts/no-commit-on-main.sh
        always_run: true
        pass_filenames: false
