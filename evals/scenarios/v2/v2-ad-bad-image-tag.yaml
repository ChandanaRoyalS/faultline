# v2/bad_deploy-3 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, bad_deploy row 3. The row's
# design, v2-payment-bad-image-tag, and the listed reserve, v2-currency-bad-image-tag, were passed
# over for section 1's reason (each would put in the corpus the first half of a holdout's evidence:
# v2-payment-flag-unreachable's and v2-checkout-currency-misconfig's). A new reserve, decided and
# recorded before authoring: ad, a leaf off the order path that no holdout involves. The tag was
# checked absent from the registry and the host (2026-09-27).
id: v2-ad-bad-image-tag
title: Ad deployed on an image tag that was never published
fault_class: bad_deploy
split: dev
slot: v2/bad_deploy-3
world: v2
injection:
  target: ad
  method: v2-ad-bad-image-tag
  params:
    image: "ghcr.io/open-telemetry/demo:2.2.0-ad-hotfix.2"
    # The injector needs this stated rather than inferred: a bare image swap either resolves and
    # starts (then misbehaves) or resolves nowhere. Here it is the latter.
    expect_start: "no"
ground_truth:
  root_cause: >
    A deploy pointed ad at image tag ghcr.io/open-telemetry/demo:2.2.0-ad-hotfix.2, which does not
    exist in the registry. The running container was removed and its replacement never started,
    so the ad service is absent rather than unhealthy: the storefront's ad requests fail, while
    browsing, carts and orders are untouched. Rolling back to the published image fixes it.
  category: bad_deploy
expected_evidence:
  # A new design: nothing here is measured yet. Written before the first recording and checked
  # against the bundle, as every v2 scenario's list has been, and corrected there. Measured at rest
  # (2026-09-27): ad serves 0.18 GetAds a second, all from the frontend, of the frontend's 11.6
  # spans a second. In v2-ad-flag-failure a tenth of GetAds failing moved the frontend and
  # frontend-proxy to about 1%, so every GetAds failing should move them to several percent.
  - alerts: ServiceHighErrorRate on the frontend and frontend-proxy is likely and not certain;
      ServiceNoTraffic on ad once its window drains; nothing on the order path
  - metrics: ad's call rate falls to zero rather than its error ratio rising; the frontend's error
      ratio rises while checkout, payment and the rest of the order path are unchanged
  - traces: the frontend's GetAds client spans end in error at the connection, with nothing beneath
      them, under the storefront's ad requests
  - logs: ad's Loki stream stops (14 to 28 lines a minute at rest); the frontend's log carries the
      failed ad calls
  - metrics: ad's JVM runtime series (51) stop - the process is gone, not unhealthy
  - change: a change record at onset - `image reference updated on ad`, to a tag the registry does
      not have
  - discriminator: the storefront's ad calls fail and ad is silent - an erroring service still
      records calls and a missing one does not; the change record at onset is the image, and its
      tag does not resolve
expected_remediation_class: rollback
rehearsed: false
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: Prometheus held 51 JVM runtime series for ad and its Loki stream logged 14 to 28 lines
# a minute. Both are what the fault removes: they answer by going idle or absent.
answers_idle_or_absent: [runtime, logs]
