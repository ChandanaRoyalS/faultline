# v2/feature_flag-4 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, feature_flag. Row 4
# (v2-image-provider-flag-slow-load) was blocked on its verification: nothing on this world triggers
# its flag. The slot passed to the reserves; paymentFailure was passed over for section 1's reason
# (it sits beside holdout row 5 on the charge step), and adFailure takes it. A new design. Its page
# is predicted to be marginal (ad's ratio about 4.7% against the 5% line), and the rule written
# before recording stands: any page is a scenario, no page blocks it.
id: v2-ad-flag-failure
title: A feature flag makes the ad service fail one request in ten
fault_class: feature_flag
split: dev
slot: v2/feature_flag-4
world: v2
injection:
  target: ad
  method: v2-ad-flag-failure
  params:
    flag: "adFailure"
    variant: "on"
ground_truth:
  root_cause: >
    The adFailure feature flag was switched on in the flag service. With it on, the ad service
    fails one GetAds request in ten with UNAVAILABLE, after choosing the ads, and the storefront's
    ad requests fail with it. The ad service is otherwise healthy, and nothing was deployed or
    reconfigured; no change record exists. The fault is the flag's value, and turning it off fixes
    it.
  category: feature_flag
expected_evidence:
  # Written before the first recording and checked against it (2026-09-26, t_inject 22:03:16,
  # revert at +15:31). The page was predicted to be marginal (about 4.7% against the 5% line); it
  # paged, late, so by the row's rule it is a scenario.
  - alerts: ServiceHighErrorRate on ad alone (page 10m31s), and nothing else during the fault or
      after the fix; the ratio touched the line at ~+6, fell under at ~+7 and restarted the hold,
      then stayed over from between +8 and +9
  - metrics: ad's error ratio rises to 2-3% and then hovers at 5-9% while its rate and latency
      hold; frontend and frontend-proxy rise to ~1%; no latency changes anywhere
  - logs: ad logs `GetAds Failed with status Status{code=UNAVAILABLE, description=null, cause=null}`
      for 22 of about 200 requests, 0 to 4 a minute, across targeted and random requests alike;
      the frontend logs `Error - 14 UNAVAILABLE` with empty details, once per failure
  - traces: failing requests end at ad's own GetAds span, in error, with no status message, under
      the frontend's /api/data; the ads were chosen before it failed
  - metrics: ad's JVM runtime series (51) report through the fault - the process is up
  - change: nothing recorded - no deploy, no configuration change, no restart; flagd reloads its
      own file and leaves no change record
  - discriminator: a steady random tenth of requests failing with UNAVAILABLE and no description,
      from a service that is up, fast and unstrained, with nothing in change history, is a
      deliberate branch - the flag's value is the change
expected_remediation_class: config_revert
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running
# world 2026-09-26, as the candidate list asks: Prometheus held 50 JVM runtime series for ad (14
# families), and its Loki stream logged 24 to 30 lines a minute at rest. The first recording
# confirmed both classes: 51 runtime series and 500 target log lines, and the recorder derived
# [runtime, logs].
answers_idle_or_absent: [runtime, logs]
