# v2/resource_exhaustion-2 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, resource_exhaustion row 2 -
# dev-only: v1's frauddetection-memory-squeeze is a published dev design, carried to v2's
# fraud-detection. The limit is re-measured on v2 under the 500M the world revision gave it,
# never copied: chosen once, by the row's rule, from the JVM's own series (2026-09-27).
id: v2-fraud-detection-memory-squeeze
title: Fraud detection memory limit cut below what its JVM needs to run
fault_class: resource_exhaustion
split: dev
slot: v2/resource_exhaustion-2
world: v2
injection:
  target: fraud-detection
  method: v2-fraud-detection-memory-squeeze
  params:
    # The JVM's own committed memory at its eight-hour high (168.1 MiB), rounded down to 16 MiB.
    # 62 % of the 256 MiB working set, so the running JVM is killed at once; and under the ~190 MiB
    # (100 non-heap plus ~88 outside the JVM) a restarted one needs before it can serve, so it
    # cannot come back. Not tuned after recording: a page of any shape is the scenario, and no
    # page blocks it.
    memory: "160m"
ground_truth:
  root_cause: >
    The fraud detection container's memory limit was lowered to 160m, below the working set of a
    JVM that had been running under 500M, and below what the process needs outside its heap at
    all. The kernel kills the container and the restart policy brings it back, and each new JVM
    is killed again before it can consume, so orders stop being checked for fraud. Nothing calls
    fraud-detection synchronously, so the storefront, checkout and accounting are untouched and
    the only sign is its own silence. Nothing about its image, code or configuration changed;
    restoring the limit fixes it.
  category: resource_exhaustion
expected_evidence:
  # Carried from v1's design, the limit re-measured, predicted before recording and checked against
  # the first recording, on the revised world, 2026-09-27 (t_inject 13:32:34, revert at +12:15).
  # Every prediction held: one alert, on the target, once its window drained; nothing else moved;
  # nineteen JVM starts, none consuming; the probe sampled exit 137 with OOMKilled set between
  # every kill and the next start. Not predicted: the backlog - the orders it missed waited on the
  # topic and it consumed them all in the first seconds back. The list below states the recording.
  - alerts: ServiceNoTraffic on fraud-detection alone (page 7m15s) - one alert, none after the
      fix; nothing on the storefront, checkout, payment or accounting; no flagd blip
  - metrics: fraud-detection's span rate falls from ~0.25 a second to 0.14 at +1, 0.06 at +3 and
      nothing from +4 with no error ratio of its own, and from then its error ratio and p95 have no
      value; every other error ratio zero, every other rate and latency unchanged, accounting
      consuming at its usual 0.3-0.5 a second; after the fix fraud-detection's rate at 0.5-0.7,
      twice its usual, as it clears the backlog
  - traces: no fraud-detection span at all during the fault - no `orders receive`, no `orders
      process` - against 108 orders published and 109 traces with an accounting span; the only
      error traces in the fault are three routine flag-stream closes on ad, recommendation and
      product-reviews
  - logs: fraud-detection's last `Consumed record` 23 s before onset; from eight seconds after it,
      JVM start-up banners - `Picked up JAVA_TOOL_OPTIONS`, the OpenJDK warning, the agent's
      version - nineteen times in twelve minutes, seven in the first 50 seconds, then gaps of 15,
      29 and 54 s, then once a minute; none reaching the application's own start-up; no error,
      stack trace or shutdown line; after the fix, dozens of `Consumed record` lines in one second
      and 157 in five minutes against 46 in a normal five; accounting's `Order details` 115 over
      the fault, unbroken
  - metrics: fraud-detection's 51 JVM runtime series hold their last values for four minutes (the
      store's lookback) and vanish; no new instance's series before the fix (the recovery's first
      export fell outside the capture's window)
  - container: sampled every 10 s - `state=restarting exit=137 oom=true` in 68 samples across
      restart counts 7 to 19 with the limit at 160m, the kernel naming the cause between every kill
      and the next start; 20 restarts by the fix (nineteen and the recovery), the limit back at 500M
      (not agent-visible)
  - change: a change record at onset - `memory limit lowered on fraud-detection`, carrying
      `memory=160m` - and no deploy, no image change (the same 2.2.0-fraud-detection before and
      after), no environment change
  - discriminator: a consumer that goes silent with no caller to notice, whose log is a JVM
      starting nineteen times with no error of its own, whose image is unchanged and whose change
      record is its memory limit, was starved - a broker misconfiguration shows the broker refused
      in the log and a variable in the record (v2-accounting-kafka-misconfig, the same one-alert
      page on the other consumer), and a flag leaves no record and a process that stays up
expected_remediation_class: config_revert
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: fraud-detection holds 51 JVM runtime series and logs 4 to 15 lines a minute. Both are
# what the fault removes: they answer by going idle or absent. The first recording (2026-09-27)
# confirmed both classes: 51 runtime series (the old instance's; the recovery's first export fell
# outside the window) and 275 target log lines, and the recorder derived [runtime, logs].
answers_idle_or_absent: [runtime, logs]
