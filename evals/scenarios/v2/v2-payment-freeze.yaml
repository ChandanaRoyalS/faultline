# v2/process_freeze-4 (HOLDOUT) - see SPLIT-V2.md. Nothing may be tuned against this scenario.
# Slot allocated before authoring; do not move. Candidate order and eligibility:
# docs/design/t7.1-candidates.md, process_freeze row 4 - new: the freeze at the last step of an
# order. Measured before authoring (2026-09-27): only checkout calls payment, once an order, after
# the cart read, the catalog lookups, both conversions and the shipping quote; one request in
# sixteen; payment holds 75 runtime series and logs every charge.
id: v2-payment-freeze
title: The payment process is frozen - its socket accepts and nothing answers
fault_class: process_freeze
split: holdout
slot: v2/process_freeze-4
world: v2
injection:
  target: payment
  method: v2-payment-freeze
  params: {}
ground_truth:
  root_cause: >
    The payment container was paused (docker pause): the process exists and holds its port, the
    kernel accepts connections into the backlog, and nothing answers them. Only checkout calls
    payment, once an order, after the cart read, the catalog lookups, the conversions and the
    shipping quote, so every order hangs at its charge with no deadline of its own, five steps
    done and none of the rest - no shipment, no confirmation email, no order record - while the
    storefront browses, adds to carts and views them as before. Payment itself neither errors nor
    logs, because it is not running.
  category: process_freeze
expected_evidence:
  # A new design: predicted before recording from the freeze's mechanism and rows 1 to 3, and
  # checked against the first recording, on the revised world, 2026-09-27 (t_inject 23:17:20,
  # revert at +12:16). The mechanism's predictions held - payment, email and accounting silent
  # and nothing before the charge, checkout keeping a pulse, the frontend unmoved, payment's
  # series and log both stopping - and two hedged ones went the other way from row 3: the page
  # was the silence itself, at 7m16s, with fraud-detection's thin ratio following two minutes
  # later rather than leading; and the proxy's p95 held the ceiling for three minutes this time,
  # so it and the load generator paged on latency. Not predicted: checkout's rate halved rather
  # than fell by a third (six spans of about eleven survive the hang), every held order
  # completed, and - as in row 3 - the recorder's all-clear came before the recovery's spans,
  # closing at the ceiling, could hold a latency rule's three minutes. The list below states the
  # recording. Distinct from row 3 on (a) - seven alerts on six services against nine on seven,
  # the storefront edge paging here and not there, shipping, quote and currency serving - on
  # (c), a log that stops mid-stream where currency has none, and on (d), the open span.
  - alerts: ServiceNoTraffic on payment, email and accounting together (page 7m16s);
      ServiceHighLatency on frontend-proxy at +8:15, its p95 at the ceiling from +5 on the
      sixteenth of requests that hang; ServiceHighErrorRate on fraud-detection at +9:15 (its one
      stream span at 100 % on a rate of 0.004) and ServiceHighLatency on load-generator the same
      minute; ServiceHighLatency on fraud-detection at +10:15; seven alerts on six services by
      the fix, none after it, all clear 1m00s after the resume; no alert on checkout, shipping,
      quote, currency, the frontend, cart, product-catalog, ad or recommendation
  - metrics: payment's rate from 0.3 a second to nothing by +4 with no error ratio of its own,
      and from then no ratio or p95; email's and accounting's to zero with it, fraud-detection's
      to its stream span and then zero; checkout's rate about halved (2.0 to 0.9-1.2 - the cart
      read, the catalog lookups, both conversions and the quote before the hung charge still
      export) and its p95 down from 39 ms to 7; shipping's about halved (quotes continue,
      shipments stop), currency's and quote's unchanged; cart's down a quarter (the emptyings
      and the blocked users); the frontend's error ratio zero and its p95 41 to 45 ms, its rate
      from 12.4 to about 9.6; the proxy's error ratio peaking at 3.1 % and the load generator's
      at 3.4 %, their p95s at the ceiling from +5 and +6 to the fix; product-catalog, ad and
      recommendation serving
  - metrics: payment's 75 Node runtime series stop at the freeze - their last samples from the
      minutes before onset - hold for the store's four-minute lookback and drop out of queries
      from +4; back 14 s after the unpause
  - traces: every proxy error trace (93 - 48 user_checkout_multi, 45 user_checkout_single) ends
      at its 15 s deadline; beneath it the frontend's POST /api/checkout stays open for the
      length of the freeze (266, 469 and 729 s in the three drawn) on its PlaceOrder call, and
      checkout's PlaceOrder stays open at oteldemo.PaymentService/Charge - after
      prepareOrderItemsAndShippingQuoteFromCart has completed in full in 8 to 13 ms - for
      265,782, 469,026 and 729,167 ms, with the shipment, the cart emptying, the email and the
      order record done in milliseconds once it returns; payment has no spans during the freeze
      and its spans appear only after the resume; no error trace on checkout, the frontend or
      payment at any point
  - logs: payment's log - a record of a few dozen lines per charge, hundreds of lines a minute -
      shows three charge records in the seconds before onset, the last eight seconds before, and
      nothing for twelve minutes - no error, no shutdown line, no start-up line - then a hundred
      charge records in the minute after the unpause; the frontend logs nothing while the fault
      holds and nothing after; email's, accounting's and fraud-detection's order lines stop with
      the charges and resume with them
  - recovery: at the unpause every held order wakes together - the first charge lands 1.8 s
      after the resume, all 114 orders complete in under a millisecond each after waiting up to
      twelve minutes, none fail; the no-traffic and latency alerts clear within a minute as the
      windows refill and the 15 s spans age out, all clear at 1m00s; the wave is in the numbers -
      checkout's and the frontend's p95 at the ceiling from +13 as minutes-long spans close, the
      order path at two to three times its rate, cart's p95 about 40 ms on the burst of emptyings
      - and not in the alerts on record, the window closing two minutes after the all-clear,
      before a latency rule could hold its three
  - change: nothing recorded - no deploy, no config change, no limit, no flag; the change history
      is empty for the whole window
  - discriminator: a partition of the same service looks identical on alerts, metrics and traces;
      the freeze is the one whose target logs nothing at all from the moment it stops, where a
      partitioned target keeps running and logs its export failures; against the other faults on
      this target - a slow payment (v2-payment-dependency-latency) shows checkout's latency with
      payment's spans present and slow; a starved payment (v2-payment-memory-squeeze) shows
      latency on payment itself and start-up lines repeating; a flag that fails charges
      (v2-payment-flag-unreachable) shows errors on checkout with payment idle and exporting -
      here the callers wait rather than fail, payment's series and log both stop, and nothing was
      changed
expected_remediation_class: restart
# The freeze resolves when the process is unfrozen; where an operator cannot `unpause`, a restart
# is what does it (knowledge/runbooks/class-process-freeze.md). Nothing was changed, so nothing
# is reverted.
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: payment holds 75 Node runtime series and logs 180 to 1,260 lines a minute. A paused
# process exports and writes nothing, so both answer by going absent - frozen-or-cut-off from
# idle, as the row's note says, not freeze from partition, which its log would tell apart. The
# first recording (2026-09-27) confirmed both: 75 runtime series (the same process's, gapped from
# +4 to +12:30) and 500 target log lines, the burst after the unpause; the recorder derived
# [runtime, logs].
answers_idle_or_absent: [runtime, logs]
