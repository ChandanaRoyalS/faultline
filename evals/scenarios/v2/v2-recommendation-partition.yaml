# v2/network_partition-4 (HOLDOUT) - see SPLIT-V2.md. Nothing may be tuned against this scenario.
# Slot allocated before authoring; do not move. Candidate order and eligibility:
# docs/design/t7.1-candidates.md, network_partition reserves - new: the row's last reserve, taking
# the holdout slot after cart, payment, shipping, checkout and email were each measured silent while
# cut off and blocked. Measured before authoring (2026-09-28): recommendation is on
# `opentelemetry-demo` alone with aliases `recommendation` (twice); only the frontend calls it,
# 0.18 ListRecommendations a second, 2.0 % of its non-internal spans, every one the load
# generator's recommendations task through /api/recommendations (the frontend's gateway sets no
# deadline); on every call it lists the catalog; 20 Python runtime series; about two log lines a
# minute at rest, one per request; under a ten-minute cut it wrote ten lines, every one the SDK's,
# and paged at +440 s.
id: v2-recommendation-partition
title: The recommendation service is cut from the network - its process runs and reaches nothing
fault_class: network_partition
split: holdout
slot: v2/network_partition-4
world: v2
injection:
  target: recommendation
  method: v2-recommendation-partition
  params:
    network: opentelemetry-demo
ground_truth:
  root_cause: >
    The recommendation container was disconnected from the demo network (docker network
    disconnect): the process kept running, its port stayed open on an address nothing could reach,
    packets on its established connections were dropped rather than reset, and nothing it tried to
    reach answered. Only the frontend calls it, once per recommendations request and with no
    deadline, so every recommendations request hangs until the proxy cuts it at fifteen seconds -
    the smallest share of requests on this row - while the rest of the storefront and every order
    run as before; recommendation's own call into the catalog, made on every request, hangs the
    same way from its side. Recommendation itself is alive and says so - its SDK logs each failed
    telemetry export, once a minute for as long as it is cut off - while its own request lines
    stop, because nothing reaches it.
  category: network_partition
expected_evidence:
  # A new design: predicted before recording from the row's mechanism, the ad recording (row -2,
  # the same shape on the edge), the catalog recording (row 1, the other side of this target's
  # recovery) and a ten-minute measurement cut of recommendation on 2026-09-28 (nothing
  # recorded), and checked against the first recording, on the revised world, 2026-09-28
  # (t_inject 11:46:36, revert at +11:46). Every prediction held: the thin page from the edge's
  # latency at 6m46s with the culprit named as silence a minute later, no error-ratio alert,
  # nothing on the frontend or the order path; the log in the SDK's format, one line per failure;
  # the runtime gap; and the recovery as row 1's from the caller's side - the held requests
  # failing at the reconnect, four recovery-only alerts, the wave on record. The list below
  # states the recording.
  - alerts: the page is thin and from the storefront edge - ServiceHighLatency on frontend-proxy
      and load-generator together (page 6m46s), their p95s at the ceiling from +3 on the
      recommendations requests that hang; ServiceNoTraffic on recommendation at +7:30, the
      culprit named on the page as silence; no error-ratio alert during the cut - the load
      generator's ratio 3.2 to 4.5 %, the proxy's 2.9 to 4.2 %, under the line; nothing on the
      frontend, nothing on the order path, no dead end; three alerts on three services by the
      fix; four more in the recovery (below); all clear 6m01s after the reconnect
  - metrics: frontend-proxy's and load-generator's p95 at the histogram's ceiling (15000 ms)
      from +3 to two minutes past the fix and their error ratios under the line for the length
      of the cut, touching 5.2 and 5.4 % only in the minute of the reconnect as the held
      requests fail together; the frontend's error ratio zero for the length of the cut, its
      p95 45 to 71 ms, its rate from 12.2 a second to 8.0 as the blocked users wait
  - metrics: recommendation's request rate from 0.7 a second to 0.13 at +3 and zero from +4,
      and from +4 to the reconnect no error ratio and no p95 - not zero errors, no samples;
      product-catalog's rate halved (5.2 to 2.3 a second - recommendation's ListProducts is
      about half its calls at rest) with its error ratio zero and its p95 unmoved; every other
      service's rate holding, 75 orders completing during the cut
  - metrics: recommendation's 20 Python runtime series stop at the cut - the SDK cannot reach
      the collector, its last report the one before onset - hold for the store's lookback and
      drop out of queries at +4:15; back 14 s after the reconnect
  - logs: THE DESIGN - recommendation's SDK writes each failed export to its console at ERROR,
      in the service's own log format, and the lines are the fault's - none in the five minutes
      before onset. "Failed to export metrics to otel-collector:4317" at +28 s and then once
      every seventy seconds for as long as it is cut off - the reader's minute plus the export's
      ten-second timeout - and "Failed to export traces" twice, at +88 s and +688 s, when a span
      batch it held could not be sent; one line per failure, no stack trace, eleven lines over
      the cut. Its own request lines ("Receive ListRecommendations"), about two a minute at
      rest, stop 4.6 s before the cut and return 10 s after the reconnect; in the minute after
      it, its log carries the tracebacks of its own calls into the catalog failing with
      "Connection reset by peer"
  - traces: every proxy error trace ends at its 15 s deadline and every one is a
      recommendations request (121 - load-generator user_get_recommendations, GET
      /api/recommendations); below it the frontend's GET /api/recommendations and its
      grpc.oteldemo.RecommendationService/ListRecommendations stay open for the length of the
      cut - 203, 471 and 706 s in the three drawn - and end in error at the reconnect;
      recommendation has no spans during the cut - nothing reaches it, and what it sends
      reaches nothing - and its spans appear only after the reconnect; the frontend's error
      traces are the held requests, all closing in the minute after the fix
  - recovery: ROW 1's, FROM THE CALLER'S SIDE - at the reconnect recommendation is back under
      its captured aliases on the same address, and the requests the frontend held open through
      the cut fail together rather than complete - 126 frontend error lines in the minute after
      the fix, its error ratio 17.5 % and its p95 at the ceiling from +12 to +15 as the held
      spans close at their minutes-long lengths; recommendation's own calls into the catalog,
      held through the cut, are reset ("Connection reset by peer" - the catalog's Go server
      resets its callers, as in row 1), and for the first thirty seconds its flag resolves into
      flagd fail at their 500 ms deadline on a stale provider connection, so its error ratio
      reads 35 % and its p95 770 ms in the minute after the fix, falling over four; four
      recovery-only alerts - ServiceHighErrorRate on the frontend and recommendation at +14:30,
      ServiceHighLatency on both at +15:30 - the no-traffic alert clearing 29 s after the
      reconnect, the edge's latency alerts 3m29s after, all clear 6m01s after the fix; the wave
      is on record; no restart of recommendation or of product-catalog
  - change: nothing recorded - no deploy, no config, no flag; the history is empty for the
      whole window (the injector records no change for this class)
  - discriminator: a freeze of recommendation would look the same on alerts, metrics, runtime
      series and traces for the length of the fault; the partition is the one whose target keeps
      running and logs its failed exports once a minute, where a frozen target logs nothing -
      here from the Python SDK's own logger, in a log that is quiet at rest (two lines a minute)
      and goes quiet on requests at the same moment it starts on exports; against the other
      fault on this target - v2-recommendation-memory-squeeze shows a container killed at once
      and restarting, its start-up lines repeating - here recommendation serves nothing, errors
      nothing during the fault, restarts never, and nothing was changed
expected_remediation_class: restart
# The partition resolves when the container is put back on its network; where an operator cannot
# reconnect it with its aliases, recreating or restarting the container does it
# (knowledge/runbooks/class-network-partition.md). Nothing was changed, so nothing is reverted.
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-28: recommendation holds 20 Python runtime series and writes about two lines a minute at
# rest - a thin log, and one that under the cut adds one line per failed export and a burst of
# request lines and tracebacks after the reconnect. Declared [runtime, logs] on the prediction that
# the capture's window would hold more than the derivation's ten lines. The first recording
# (2026-09-28) held 20 runtime series (gapped from +4:15 to 14 s after the reconnect) and 201
# target log lines - 73 before onset, 128 from it - and the recorder derived [runtime, logs].
answers_idle_or_absent: [runtime, logs]
