# v2/resource_exhaustion-1 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, resource_exhaustion row 1 -
# dev-only: v1's ad-memory-squeeze is a published dev design, carried to v2's ad. The limit is
# re-measured on v2, never copied: chosen once, by a stated rule, from ad's own JVM series
# (2026-09-27), before recording.
id: v2-ad-memory-squeeze
title: Ad service memory limit cut below what its JVM needs to run
fault_class: resource_exhaustion
split: dev
slot: v2/resource_exhaustion-1
world: v2
injection:
  target: ad
  method: v2-ad-memory-squeeze
  params:
    # The JVM's own committed memory at its eight-hour high (157.6 MiB), rounded down to 16 MiB.
    # 62 % of the 230 MiB working set, so the running JVM is killed at once; and nothing left for
    # the ~80 MiB the container holds outside the JVM, so a restarted one cannot reach a serving
    # state. Not tuned after recording: a page of any shape is the scenario, and no page blocks it.
    memory: "144m"
ground_truth:
  root_cause: >
    The ad service container's memory limit was lowered to 144m, below the working set of a JVM
    that had sized its heap against the previous 300M ceiling, and below what the process needs
    outside its heap at all. The kernel kills the container and the restart policy brings it
    back, and each new JVM is killed again before it can serve steadily, so the storefront's ad
    requests fail while every other service is healthy. Nothing about ad's image, code or
    configuration changed; restoring the limit fixes it.
  category: resource_exhaustion
expected_evidence:
  # Carried from v1's design, the limit re-measured, predicted before recording and checked against
  # the first recording, on the revised world, 2026-09-27 (t_inject 12:39:52, revert at +10:01).
  # Every prediction held, in its stronger form: ad never served during the fault - seventeen JVM
  # starts, none reaching `listening` - the storefront paged on errors at 5m01s and ServiceNoTraffic
  # on ad followed; nothing on the order path. The list below states the recording. The container's
  # exit code and OOM flag were not sampled for this run (the probe's file was overwritten by a
  # second pass through the commands after the recording); the restart count, 18 by the fix, is on
  # record from docker inspect afterwards, and the kills are read from the log and the series.
  - alerts: ServiceHighErrorRate on frontend-proxy and frontend together (page 5m01s), then
      ServiceNoTraffic on ad at +7:45 - three alerts by the fix and none after it; load-generator
      rises to 4.7% and stays under the line; nothing on the order path
  - metrics: ad's call rate falls from ~0.45 a second to nothing by +5 with no error ratio of its
      own, and from then its error ratio and p95 have no value; the frontend's error ratio climbs
      from 1.5% at +1 through 5.2% at +3 to 8.4% by the fix, frontend-proxy's with it; every other
      error ratio zero; no latency moves; checkout, cart, payment and the catalog hold their rates
  - traces: every frontend error trace (125) is a storefront ad request ending in
      frontend/grpc.oteldemo.AdService/GetAds with no ad span beneath, and beneath the call the
      frontend's own attempts - dns.lookup `getaddrinfo ENOTFOUND ad`, tcp.connect refused and
      unreachable at ad's address, some waiting eleven and fourteen seconds; not one ad server span
      in the fault; checkout has no error trace
  - logs: ad's log ends its ordinary work two seconds before onset and one second after it turns
      into JVM start-up banners - `Picked up JAVA_TOOL_OPTIONS`, the OpenJDK warning, the agent's
      version - seventeen times in ten minutes, eight in the first 45 seconds, then gaps of 28 and
      53 s, then once a minute; eleven reach `Ad service starting.` and none `started, listening`;
      no error, stack trace or shutdown line before any of them; the frontend logs UNAVAILABLE 125
      times, 2 to 16 a minute, and 13 more in the five minutes after the fix
  - metrics: ad's 51 JVM runtime series hold their last values for four minutes (the store's
      lookback) and vanish; no new instance's series until after the fix, when a second set of 51
      begins - a process that is merely idle keeps exporting them
  - container: the restart count 18 by the fix - seventeen in the fault and the recovery's start -
      with the limit at 144m through the fault and 300M after; exit code and OOM flag not sampled
      this recording (not agent-visible in any case)
  - change: a change record at onset - `memory limit lowered on ad`, carrying `memory=144m` - and
      no deploy, no image change (the same 2.2.0-ad before and after), no environment change
  - discriminator: a JVM that starts seventeen times and never listens, with no error of its own,
      an unchanged image and a change record that is its memory limit, was starved - a wrong image
      shows another program in the log and an image in the record (v2-ad-bad-image-tag, the same
      page), a flag leaves no record and a process that stays up, and a slowdown would show latency
      where here there is none
expected_remediation_class: config_revert
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: ad holds 50 JVM runtime series and logs 14 to 38 lines a minute. Both are what the
# fault removes, in bursts or entirely: they answer by going idle or absent. The first recording
# (2026-09-27) confirmed both classes: 102 runtime series (51 for the old instance, 51 for the
# new) and 231 target log lines, and the recorder derived [runtime, logs].
answers_idle_or_absent: [runtime, logs]
