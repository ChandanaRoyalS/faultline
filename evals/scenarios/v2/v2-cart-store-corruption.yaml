# v2/datastore_corruption-1 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, datastore_corruption row 1 -
# dev-only: A4b and R4b are published. The only design in the row the injector can inject today:
# rows 2 to 4 each need a new store tool first. Measured before authoring (2026-09-28): the store
# holds 988 hashes, one `cart` field each, with TTLs up to an hour, at 1.6 MiB under no maxmemory;
# a stale stop file from R4b sits in its /tmp, which the injector clears before it starts; cart
# serves 1.6 spans a second (GetCart 0.9, AddItem 0.5, EmptyCart 0.2) for two callers - the
# frontend (GetCart 0.74/s and AddItem 0.51/s, 12 % of its non-internal spans) and checkout
# (GetCart and EmptyCart 0.17/s each, 15 % of its); cart holds 42 .NET runtime series and writes
# 160 lines a minute, the store 5 lines per five-minute save and none between.
# Q120's audit, 2026-09-30: the traces item below was read while Tempo's search saw only its
# ingester's last minutes. By the repair the window was past the 24 h retention and was deleted,
# so it could not be re-read; it stands as read, a sample of the fault's newest minutes
# (docs/evidence/q120-audit/README.md).
id: v2-cart-store-corruption
title: Every cart in the store is unreadable - the store answers, and what it holds cannot be parsed
fault_class: datastore_corruption
split: dev
slot: v2/datastore_corruption-1
world: v2
injection:
  target: valkey-cart
  method: v2-cart-store-corruption
  params:
    cli: valkey-cli
    field: cart
    interval: "0.05"
ground_truth:
  root_cause: >
    The cart store's contents were corrupted: a loop inside valkey-cart overwrote the cart field of
    every hash with bytes that are not a serialised cart, every 50 milliseconds, faster than a
    cart is written and read back. The store stayed up, reachable and fast, and answered every
    request; the cart service connected, read, and could not decode what it read, so every read
    of a cart that existed failed as a parse error with a failed-precondition status, while writes
    and reads of carts that did not yet exist succeeded. Every order fails at its first step, the
    cart read; the storefront's add-to-cart and cart views fail when they land on a corrupted
    cart. Nothing was deployed, configured or flagged; the address was right all along.
  category: datastore_corruption
expected_evidence:
  # Pre-registered from A4b (by hand, 2026-09-23) and R4b (through the injector, 2026-09-24);
  # restated after the recording of 2026-09-28 12:41 UTC, and restated again after the re-record
  # of 2026-09-29 00:20 UTC, which replaced it (superseded/20260928T124100Z). The first recording
  # was made on a cart whose store commands had gone untraced since the v2-cart-partition
  # measurement's reconnect (Q116), and its page - cart beside checkout - was computed over cart's
  # server spans alone. On the defined world cart emits a client span for every store command, and
  # the re-record's predictions were written before it (t7.1-candidates.md): cart under its line,
  # checkout at its line, a page on checkout alone possible, not certain. That is what happened.
  # The same fault on the same world 20 minutes later (v2-inj-cart-store-corruption-log-checkout)
  # did not page inside 900 s and paged at 16m30s: a ratio at its line pages by chance.
  - alerts: ServiceHighErrorRate on checkout alone at 6m16s - its ratio 5.5 % at +4, a 7.2 % peak
      at +6 - and nothing else; cart at 1.2 to 2.8 %, never near its line; the frontend at 3.2 %
      and the proxy at 3.5 %, under theirs; no latency alert, no no-traffic alert; one alert on
      one service by the fix. THE ALERT CLEARED ON ITS OWN under two minutes after firing and
      about three minutes before the fix, the ratio falling through 4.5, 3.0, 2.0 % with the
      fault still running; the record's fix-to-all-clear is 0 s for that reason
  - metrics: checkout's error ratio 1.8 % at +1 rising to 7.2 % at +6 and falling to 1.3 % at +11,
      its p95 falling from 21 to 10-18 ms as the failed orders are the short ones; cart's 1.2 to
      2.8 % with its p95 at 2 ms throughout, its span rate unchanged at 3.3 to 4.3 a second (a
      client span for every store command, HGET, HMSET, EXPIRE, about 2.3 a second at rest); the
      frontend's ratio peaking at 3.2 %, the proxy's at 3.5 %, the load generator's at 1.9 %,
      every p95 unmoved; the frontend's rate 11 to 12 a second throughout
  - metrics: cart's .NET runtime series continue without a gap - the service is healthy, its
      store is not; valkey-cart exports no runtime series on this world and the recorder derived
      none for it
  - logs: THE CULPRIT IS ONE HOP PAST THE PAGE, AND ITS LOG NAMES THE FAULT - cart's log, 30 to
      67 GetCartAsync lines a minute and unchanged, adds from +10 s the line "Error status code
      'FailedPrecondition' with detail 'Can't access cart storage.
      Google.Protobuf.InvalidProtocolBufferException - While parsing a protocol message, the
      input ended unexpectedly in the middle of a field'" - 44 in the fault's eleven minutes, up
      to ten a minute, none before and none after - a decode failure with the connection fine;
      checkout's log carries nothing; the store's own log - the recorder's capture, 60 lines -
      saves every 61 s from +22 s on "10000 changes in 60 seconds", eleven saves, where at rest
      it saves every five minutes on a hundred changes
  - traces: checkout's error traces are orders, 16 to 27 ms edge to end, PlaceOrder in error in
      under a millisecond with "cart failure - failed to get user cart during checkout",
      CartService/GetCart beneath it, cart's own server span in error at 0.4 to 0.6 ms carrying
      the FailedPrecondition detail, and beneath that the store command it made - HGET, 0.2 ms,
      NOT in error - the store answered and what it answered could not be read, the class's
      fingerprint in one tree; the frontend's error traces add user_add_to_cart, AddItem failing
      the same way over the same successful HGET; nothing over the proxy's timeout, nothing slow.
      Tempo had been restarted eleven minutes before the onset (Q115) and its search returned a
      subset - 9 of cart's error traces against 44 parse-failure lines in Loki - so trace counts
      are not evidence here and the narrative cites none
  - recovery: the loop stopped after 12,707 sweeps (about nineteen a second over 11m16s) and the
      store flushed - 255 keys at the first sweep, 0 after the flush, refilling from its clients;
      clean - no parse-failure line, no error trace, no alert after the fix; the ratios at 1 %
      and under within two minutes as their windows drained; no restart of cart or valkey-cart
  - change: nothing recorded - no deploy, no config, no flag; the change history is empty for
      the whole window (the store's contents changed, and nothing records those)
  - discriminator: against v2-cart-valkey-misconfig (cart cannot connect - connection failures in
      its log and an address in the change record), against v2-cart-freeze (nothing answers -
      callers hang to the proxy's deadline, latency rules fire, cart's log stops), against
      v2-valkey-cart-dependency-latency (the store answers slowly - cart's p95 rises, nothing
      errors) - here the store answered at once, cart's p95 did not move, cart's log named a
      decode failure with the connection fine, and the change record was empty; the fix is neither
      a revert nor a restart but discarding or restoring the store's contents. Held on the
      recording
expected_remediation_class: restore_data
# The wrong thing is the stored contents, so the fix is to discard or restore them
# (knowledge/runbooks/class-datastore-corruption.md). Recreating cart changes nothing - it reads
# the same bytes on its next request; reverting configuration changes nothing - the address was
# right. The injector's restore is the flush.
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). The target is the store,
# valkey-cart, which exports no runtime series and writes five lines per RDB save, every five
# minutes at rest and every minute under the sweep's writes - so the capture's window was
# predicted to hold more than the derivation's ten lines and the recorder to derive [logs]. It
# did: the 2026-09-28 recording captured 65 lines (5 before the onset, 60 from it) and zero
# runtime series, and derived [logs], as declared; the re-record of 2026-09-29 captured 60 (5 and
# 55) and zero, and derived [logs] again. The log that answers the fault is cart's, one
# hop over, which the recorder does not capture and the agent reads through Loki.
answers_idle_or_absent: [logs]
