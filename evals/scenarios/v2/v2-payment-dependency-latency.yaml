# v2/dependency_latency-3 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, dependency_latency row 3 - a new
# design: 300ms on payment, a leaf only checkout calls. The leaf's own spans cannot show an egress
# delay (v1's ad-dependency-latency), so the page rests on checkout, whose charge spans were
# measured before authoring (2026-09-27) to be a large enough share for its p95 to cross the line.
id: v2-payment-dependency-latency
title: Payment's replies are late, and only checkout can tell
fault_class: dependency_latency
split: dev
slot: v2/dependency_latency-3
world: v2
injection:
  target: payment
  method: v2-payment-dependency-latency
  params:
    delay_ms: 300
    jitter_ms: 0
    duration: "1h"
    # payment's one interface (ip link from a helper in its network namespace, 2026-09-27; the
    # image is distroless and has no shell). The rule delays packets leaving payment: its replies
    # to checkout, and its telemetry on its way out.
    interface: "eth0"
ground_truth:
  root_cause: >
    A traffic-shaping rule attached to the payment service's network namespace adds 300ms of
    delay to every packet leaving the container. Payment's own code, image, configuration and
    process are untouched, and it answers every charge in its usual milliseconds; its answers are
    late arriving. Payment calls nothing, so the delay never enters its own spans: only checkout,
    which waits on every charge, shows it. Every order takes about 300ms longer and nothing fails.
    Recreating the payment container clears the rule, which is bound to the container's network
    namespace.
  category: dependency_latency
expected_evidence:
  # A new design: predicted before recording and checked against the recording on the revised
  # world, 2026-09-27 (t_inject 10:27:19, revert at +10:35 - the second recording; the first, the
  # same day, paged at 6m05s but began the second its predecessor's alert cleared, with the
  # previous run's tail still in checkout's window, and is under superseded/). Every prediction
  # held: checkout alone paged, payment's p95 never moved, the storefront stayed under the line,
  # the whole 300ms sat after payment's span. Not predicted: the page came at 5m35s rather than
  # four to five minutes, and the proxy's and the load generator's p95s brushed 200 late.
  - alerts: ServiceHighLatency on checkout alone (page 5m35s) - one alert, none after the fix;
      payment never pages; the frontend, frontend-proxy and load-generator stay under the line;
      no ServiceHighErrorRate anywhere and nothing goes quiet
  - metrics: checkout's p95 steps from 35-39ms to 270 at +3, 306 at +4 and 335-338 from +5;
      payment's p95 stays at 2-10ms throughout; the frontend's sits at 43-48, frontend-proxy's at
      45-50 and load-generator's at 47-54, the last two brushing 200 in the two minutes before the
      fix; every error ratio zero; checkout's rate dips from ~1.9 to 1.3-1.45 a second mid-fault
      and recovers before the fix; nothing else moves
  - traces: in 76 traces drawn under the fault every order is slow in one place - checkout's
      Charge client span 303ms (311 at p95, from 2-10 at rest) over payment's Charge server span
      of 0.8ms (5.6 at p95, unchanged), the whole gap after payment's span ends; PlaceOrder
      329-373ms from 27-79; the cart read, product lookups, currency conversions, shipping quote,
      shipment, cart emptying and confirmation unchanged; no span errors; the agent's trace tool
      names PlaceOrder to Charge as the degrading hop on every payment and checkout trace
  - logs: payment's log goes on as before - `Charge request received.` with each card, amount and
      loyalty level, 84 charges over the fault at 3 to 13 a minute - with no error or warning; the
      frontend's log shows nothing new
  - metrics: payment's 75 Node runtime series report every 15 s without a gap - event-loop delay
      flat, utilisation 0.2%, heap steady, collections on cadence - the process is up and idle
  - change: a change record at onset under payment's name that is none of the familiar kinds -
      not a deploy, an image, an environment variable or a limit - `traffic-shaping container
      attached to payment's network namespace`, carrying `eth0 delay=300ms jitter=0ms`; nothing
      on checkout
  - discriminator: a callee whose own span is fast beneath a client span 300ms longer, the gap
      after the callee's span rather than inside it, on every call and at every traffic level,
      has replies held on their way out - a delay on the callee's egress; a slow callee shows the
      time inside its span, a slow caller slows more than the one call, and a leaf's egress delay
      never enters the leaf's own metrics, so the culprit is the one service that reports nothing
      wrong
# The rule lives in the container's network namespace, so recreating the container is what
# clears it - a restart, not a rollback or a config revert; the same class as the row's carries.
expected_remediation_class: restart
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: payment holds 75 Node runtime series and logs 360 to 900 lines a minute. The fault
# slows payment's replies and removes neither. The recording (2026-09-27) confirmed it: 75
# runtime series, 500 target log lines, and the recorder derived [runtime, logs].
answers_idle_or_absent: [runtime, logs]
