# v2/bad_config-4 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md. A new design, the row's second
# reserve. The first reserve (v2-fraud-detection-kafka-misconfig) was passed over because it shares
# holdout row 5's mechanism (decided 2026-09-26, recorded in the candidate list).
id: v2-frontend-cart-misconfig
title: Frontend pointed at a cart port where nothing listens
fault_class: bad_config
split: dev
slot: v2/bad_config-4
world: v2
storm: true
injection:
  target: frontend
  method: v2-frontend-cart-misconfig
  params:
    env_var: "CART_ADDR"
    value: "cart:7071"
ground_truth:
  root_cause: >
    The frontend's CART_ADDR was changed to a port on the cart host where nothing listens. Cart
    itself is healthy and keeps serving its other caller, checkout. Every cart call the frontend
    makes is refused, so the storefront's cart operations fail while the service they name is up.
    No service's code is wrong and cart is not at fault; the fault is the address the frontend
    holds for cart.
  category: bad_config
expected_evidence:
  # Written before the first recording and corrected against it (2026-09-26). Re-recorded on the
  # revised world on 2026-09-27 (t_inject 03:33:31, revert at +8m17s) and restated against that
  # recording. Checkout is on the page: the frontend cannot fill carts, so checkout reads empty
  # ones and fails every order at shipping's quote.
  - alerts: ServiceHighErrorRate on checkout, frontend and frontend-proxy together at 3m17s,
      load-generator a minute later; ServiceNoTraffic on accounting, currency, email, payment and
      quote at +7m15s; fraud-detection ServiceHighErrorRate at +7m15s and fraud-detection and
      flagd ServiceHighLatency at +8m15s (flagd EventStream reconnect exposed by the stopped
      orders, not a second fault); cart never alerts; nothing starts after the fix
  - metrics: frontend's error ratio peaks at ~29% at +4m and eases to ~24% by the fix while its
      latency (~42ms to ~37ms) and request rate (~12.4/s to ~10.5/s) hold; checkout's reaches
      exactly 0.5 (two of four spans in every order) while its latency falls from ~35ms to ~8ms;
      cart's request rate falls from ~4.5/s to ~0.3/s, never to zero, with zero errors
  - logs: the frontend, silent at rest, logs `14 UNAVAILABLE ... connect ECONNREFUSED ...:7071`
      from its start until the fix (552 lines, 22-112 a minute, none before or after), beside
      checkout's mislabelled error (`shipping quote failure`, `failed POST to email service`,
      `expected 200, got 400`); cart's own log shows GetCartAsync continuing (99 in the fault)
      while AddItemAsync all but stops (19, against 166 in the five minutes before)
  - traces: the frontend's grpc.oteldemo.CartService/AddItem client span under /api/cart errors
      with no cart span beneath it (the degrading hop); checkout's PlaceOrder errors in every
      sampled trace with the hop at prepareOrderItemsAndShippingQuoteFromCart to its HTTP POST
      to shipping, no product or currency calls between (the cart is empty); fraud-detection's
      only error spans are its flagd EventStream, closed by server-side timeout
  - metrics: the frontend's Node runtime series (75) report without a gap - the process is up and
      answering
  - change: CART_ADDR on frontend changed to cart:7071, coinciding with onset; nothing changed on
      cart, checkout or shipping
  - discriminator: checkout pages beside the frontend with an error naming shipping and email, and
      none of the three is at fault; its trace shows an empty cart, and the frontend's cart span
      (nothing beneath it), its log (the refused port) and the change record name the address
expected_remediation_class: config_revert
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running
# world 2026-09-26, as the candidate list now asks: Prometheus holds 75 Node runtime series for
# frontend (16 families, nodejs_eventloop_* and v8js_*), and the frontend's Loki stream exists but
# logged 0 lines in 15 minutes at rest. Logs were declared because the fault should make it log.
# The first recording confirmed both: 75 runtime series and 400 target log lines (the capture's
# limit), and the recorder derived [runtime, logs]. The 2026-09-27 re-record on the revised world
# derived the same: 75 runtime series, 400 target log lines, [runtime, logs].
answers_idle_or_absent: [runtime, logs]
