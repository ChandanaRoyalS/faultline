# v2/bad_deploy-2 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, bad_deploy row 2 - dev-only:
# v1's shipping-wrong-image is a published dev design, carried to v2's shipping. The image was
# checked present in the registry and on the host before authoring (2026-09-27).
id: v2-shipping-wrong-image
title: Shipping deployed with another service's image
fault_class: bad_deploy
split: dev
slot: v2/bad_deploy-2
world: v2
injection:
  target: shipping
  method: v2-shipping-wrong-image
  params:
    image: "ghcr.io/open-telemetry/demo:2.2.0-ad"
    # The image exists, so the deploy succeeds and the container starts; what runs in it is a
    # JVM, in a slot sized for a Rust binary.
    expect_start: "yes"
ground_truth:
  root_cause: >
    A deploy put the ad service's image, ghcr.io/open-telemetry/demo:2.2.0-ad, into the shipping
    service's slot. The image exists and the deploy succeeded, but what it runs is the ad service's
    Java process, which does not fit shipping's 20M memory limit and has none of the configuration
    it needs, so it is killed as it starts and restarts, over and over, and never serves. Shipping
    quotes and shipments fail, so every order fails at the shipping quote. The memory limit was not
    changed. Rolling back to shipping's own image fixes it.
  category: bad_deploy
expected_evidence:
  # Carried from v1's design and not measured on v2 yet. Written before the first recording and
  # checked against the bundle, as every v2 scenario's list has been, and corrected there. Measured
  # at rest (2026-09-27): shipping serves get-quote and ship-order at 0.12 a second each, holds no
  # runtime series, and writes no log line Loki holds.
  - alerts: ServiceHighErrorRate on checkout, the storefront's edge perhaps following; later
      ServiceNoTraffic on shipping and on the services an order reaches after its quote
  - metrics: shipping's call rate falls to zero rather than its error ratio rising; checkout's
      error ratio rises while its latency falls
  - traces: checkout's shipping quote call fails at the connection with nothing beneath it; the
      steps before it (cart, catalog, currency) succeed
  - logs: a Loki stream for shipping appears where none was, a Java process's start-up lines
      repeating with nothing after them
  - metrics: shipping has no runtime series before or during the fault
  - change: a change record at onset - `image reference updated on shipping`, to
      ghcr.io/open-telemetry/demo:2.2.0-ad, the ad service's image
  - discriminator: a service killed at start over and over with its memory limit unchanged, whose
      log is suddenly another runtime's, was given the wrong image - the change record names it,
      and a memory-limit fault would show the limit lowered instead
expected_remediation_class: rollback
rehearsed: false
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: no runtime series for shipping and no Loki stream (v2's shipping logs nothing to
# stdout). The ad image's JVM writes its start-up lines to stdout, so the fault itself should give
# the capture a talkative stream, as v1's did ([logs]). If the bundle's capture says otherwise, the
# declaration is corrected against it, not argued with.
answers_idle_or_absent: [logs]
