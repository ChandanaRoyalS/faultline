# v2/bad_config-5 (HOLDOUT) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Nothing may be tuned against this scenario (ADR-0008): its bundle lands under artifacts/holdout/
# and never reaches a corpus.
#
# Candidate order and eligibility: docs/design/t7.1-candidates.md, bad_config row 5 - a new design
# (v1's attempt produced no artifact). The candidate list's value was `kafka:9093`, carried from
# v1; on v2 9093 is Kafka's controller listener, so the value is `kafka:9094`, where nothing
# listens, to keep the row's mechanism (decided 2026-09-26, written in the candidate list before
# recording). Accounting is also dev row 1's target (v2-accounting-bad-credential): the split
# quarantines faults and artifacts, not services (ADR-0008), and that narrative shares nothing of
# this mechanism - its consumer kept reading the topic throughout.
id: v2-accounting-kafka-misconfig
title: Accounting pointed at a Kafka port where nothing listens
fault_class: bad_config
split: holdout
slot: v2/bad_config-5
world: v2
injection:
  target: accounting
  method: v2-accounting-kafka-misconfig
  params:
    env_var: "KAFKA_ADDR"
    value: "kafka:9094"
ground_truth:
  root_cause: >
    The accounting service's KAFKA_ADDR was changed to a port on the Kafka host where nothing
    listens. Kafka is healthy: checkout keeps publishing orders and fraud-detection keeps consuming
    the same topic. Accounting stays up, cannot reach its broker, and consumes nothing, so orders
    stop being recorded while nothing that calls a service fails. No service's code is wrong and
    Kafka is not at fault; the fault is the broker address accounting holds.
  category: bad_config
expected_evidence:
  # Written before the first recording and checked against it (2026-09-26, t_inject 06:42:40,
  # revert at +12:47). Re-recorded on the revised world on 2026-09-27 (t_inject 04:03:17, revert
  # at +12:32) and restated against that recording; the design held. The first recording's probe
  # during the fault saw one container, restarts 0 - no crashloop (T7.56).
  - alerts: ServiceNoTraffic on accounting alone (page 7m32s); no error-rate or latency alert
      anywhere, during the fault or after the fix, because nothing calls accounting and nothing
      upstream waits on it
  - metrics: accounting's request rate falls from ~0.55/s to zero by ~+5:00 and its error ratio
      and latency have no values from then; checkout's error ratio stays zero and fraud-detection
      keeps its traffic without alerting
  - logs: accounting's `Order details` lines (6 to 13 a minute) stop; its Kafka client logs
      `1/1 brokers are down` 14,495 times (~790 to 1,160 a minute) with `kafka:9094` in the thread
      name, and `Connection refused` for 172.18.0.2:9094 from the start (54, 4 to 6 a minute);
      within a minute of the fix it logs 90 orders, the backlog
  - traces: accounting has no spans in the fault window (its span rate is zero from ~+5:00);
      checkout's orders keep completing without error; after the fix accounting's span rate
      returns at about twice its usual level while it catches up
  - metrics: accounting's .NET runtime series (42) report through the fault without a gap - the
      process is up
  - change: KAFKA_ADDR on accounting changed to kafka:9094, coinciding with onset; nothing changed
      on kafka, checkout or fraud-detection
  - discriminator: a silent service that is alive and has no caller to fail; the broker is healthy,
      because fraud-detection keeps reading the same topic (2 to 11 orders a minute, 93 in all, per
      its log), so the fault is the address accounting holds for it - its own log shows it trying
      and doing no work; the orders are delayed, not lost (accounting's catch-up totals the same
      93, then 49 in the five minutes after, a normal pace)
expected_remediation_class: config_revert
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running
# world 2026-09-26, as the candidate list asks: Prometheus holds 42 .NET runtime series for
# accounting (24 families, dotnet_*), and its Loki stream logged 4 to 26 lines a minute at rest
# over 15 minutes. The first recording confirmed both: 42 runtime series and 484 target log lines,
# and the recorder derived [runtime, logs].
# The 2026-09-27 re-record derived the same: 42 runtime series, 500 target log lines (the capture's
# limit), [runtime, logs].
answers_idle_or_absent: [runtime, logs]
