# v2/feature_flag-5 (HOLDOUT) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Nothing may be tuned against this scenario (ADR-0008): its bundle lands under artifacts/holdout/
# and never reaches a corpus.
#
# Candidate order and eligibility: docs/design/t7.1-candidates.md, feature_flag row 5 - a new
# design. The flag acts in checkout's code, so the target is checkout; payment is never called.
# The id is the candidate list's.
id: v2-payment-flag-unreachable
title: A feature flag makes checkout charge cards at an address that does not exist
fault_class: feature_flag
split: holdout
slot: v2/feature_flag-5
world: v2
injection:
  target: checkout
  method: v2-payment-flag-unreachable
  params:
    flag: "paymentUnreachable"
    variant: "on"
ground_truth:
  root_cause: >
    The paymentUnreachable feature flag was switched on in the flag service. With it on, checkout
    charges the card through a client built on an address that does not exist instead of the
    payment service's, so every order fails at the charge, after the cart, the product lookups,
    the currency conversions and the shipping quote have succeeded. The payment service is healthy
    and is never called. Nothing was deployed or reconfigured and no change record exists; the
    fault is the flag's value, and turning it off fixes it.
  category: feature_flag
expected_evidence:
  # Written before the first recording and checked against it (2026-09-26, t_inject 22:41:46,
  # revert at +9:00, now in superseded/). Re-recorded on the revised world on 2026-09-27 (t_inject
  # 05:52:37, revert at +9:16) and restated from that capture and its live read-back. Checkout and
  # payment did not restart during the fault; the recording batch restarted checkout one second
  # after the all-clear (4m02s after the fix), so no goroutine reading after that is usable.
  - alerts: ServiceHighErrorRate on checkout alone (page 4m16s); at +8:00 ServiceNoTraffic on
      payment, email and accounting together and ServiceHighErrorRate on fraud-detection; at +9:00,
      16 s before the fix, ServiceHighLatency on fraud-detection and flagd - seven alerts on six
      services by the fix and none after it; frontend (4.6%), frontend-proxy (5.0%, just under) and
      load-generator (2.7%) rise and stay under the line
  - metrics: checkout's error ratio reaches 19% at +4 and holds at 20-21%, while its p95 holds at
      32-40ms - failed orders end at the charge; payment's, email's and accounting's rates fall to
      zero with no errors of their own; cart, product-catalog, currency and quote keep their rates,
      and shipping falls from ~0.4 to ~0.25 spans a second as its ship-order calls stop
  - metrics: fraud-detection's and flagd's alerts are a dead end - with orders gone, fraud-detection
      reports only its flagd EventStream client spans, ended by flagd with `stream closed due to
      server-side timeout` (the routine ten-minute reconnect), so its error ratio reads 100% and its
      p95 sits at the histogram's top, and flagd's ten-minute EventStream server spans push its p95
      over the line; no order is involved, and fraud-detection never reads as no-traffic
  - logs: checkout has no Loki stream; the frontend logs checkout's `failed to charge card - could
      not charge the card - rpc error - code = Unavailable desc = name resolver error - produced
      zero addresses` on two lines per error, 140 lines for ~70 failed orders, 2 to 11 orders a
      minute, none before or after; payment's `Charge request received.` runs 44 in the five
      minutes before onset, 3 during the fault (none after the first minute) and 66 in the five
      after the fix
  - traces: checkout's PlaceOrder errors with that text, the failing hop being checkout's
      PaymentService Charge client span; beneath PlaceOrder the cart read, the product lookups, the
      currency conversions and the shipping quote succeed, and the Charge span errors in no
      measurable time with `name resolver error - produced zero addresses` and no payment span
      beneath it; nothing after the charge runs
  - metrics: checkout's Go runtime series (9) report through the fault without a gap; its goroutine
      count (go_goroutine_count) climbs from 78 by about 35 a minute to 358 at the last reading
      before the fix and still reads 360 four minutes after it, the last reading before the
      restart; stack memory 1.9 to 2.7MB - a client built per charge and never closed
  - change: nothing recorded - no deploy, no configuration change, no restart; flagd reloads its
      own file and leaves no change record
  - discriminator: checkout cannot resolve the name it charges at while resolving its other
      dependencies in the same request, and payment is healthy and idle; nothing changed in change
      history - not checkout's configuration, not payment - so the address checkout used came from
      somewhere else, and on this world that is a feature flag
expected_remediation_class: config_revert
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Checkout's reachability was
# measured on the running world the same day for v2-checkout-currency-misconfig and confirmed by its
# bundle: 9 Go runtime series, no Loki stream (checkout logs only over OTLP). The first recording
# confirmed it: 9 runtime series and 0 target log lines, and the recorder derived [runtime]. The
# 2026-09-27 re-record captured the same 9 runtime series and 0 target log lines and derived the
# same [runtime].
answers_idle_or_absent: [runtime]
