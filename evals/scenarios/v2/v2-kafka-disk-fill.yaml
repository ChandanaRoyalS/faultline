# v2/disk_fill-1 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, disk_fill row 1 - dev-only:
# A8b and R5 are published. The only design in the row with its precondition in place: the 256 MiB
# tmpfs world-v2.override.yml mounts at kafka's log directory. Measured before authoring
# (2026-09-28): the broker names the directory on its own lines - `dir=/tmp/kafka-logs` on every
# LocalLog line, 142 lines in five minutes at rest - and the tmpfs is mounted there, 25 MiB of 256
# used; the broker at 355 MiB of its 1024M with no restarts since R5's recreate four days before;
# the three services the restore restarts at 58, 48 and 73 % of their limits, postgresql at 23 %;
# kafka holds 52 JVM runtime series; checkout produces 0.19 orders a second to one topic, which
# accounting (0.19 consumer spans a second, 58 lines per five minutes) and fraud-detection (0.37,
# 29 lines) read; checkout writes no log lines at all (its logger routes into OTLP).
id: v2-kafka-disk-fill
title: The broker's only disk is full - it halts and restarts, halts again, and every order hangs
fault_class: disk_fill
split: dev
slot: v2/disk_fill-1
world: v2
injection:
  target: kafka
  method: v2-kafka-disk-fill
  params:
    service: kafka
    directory: /tmp/kafka-logs
    restart_after: accounting,fraud-detection,checkout
ground_truth:
  root_cause: >
    Kafka's only log directory filled to capacity: a file written into /tmp/kafka-logs until the
    device had no space left. A broker whose every log directory has failed halts itself within
    seconds, and its supervisor restarts it against the same full directory, so it crashloops for
    the length of the fault, each start ending in the same storage failure. Checkout produces
    every order to that broker with no fallback, so every order hangs on its produce until the
    client's delivery timeout and then fails; the two consumers of the orders topic, accounting
    and fraud-detection, have nothing to read and go silent. Nothing was deployed, configured or
    flagged; the broker's address, image and configuration were right all along, and its disk was
    full.
  category: disk_fill
expected_evidence:
  # From A8b (by hand, 2026-09-24) and R5 (through the injector, the same day), both on the world
  # before its revision; predicted before recording and checked against the bundle. The class's
  # shape, measured twice: a halted broker presents as a checkout hang, then as checkout errors,
  # then as two consumers gone quiet - the freeze's shape from a dependency that is up, reachable,
  # restarting, and cannot write.
  - alerts: ServiceHighLatency on checkout FIRST, at five and a half to six and a half minutes
      (A8b +6:31, R5 +5:36) - the producer blocks to its delivery timeout, so the p95 crosses
      before any error lands; ServiceHighErrorRate on checkout a minute after (+7:01, +7:06);
      ServiceNoTraffic on accounting at seven and a half to eight and a half (+8:31, +7:36); a
      brief ServiceHighErrorRate on fraud-detection as its fetches fail loudly before its rate
      drains (A8b +6:31, R5 +8:36), then its latency rule, then its own ServiceNoTraffic late
      (A8b +11:31, R5 after the window) - inside this recording's window only if the hold
      reaches it; the frontend and the proxy under their lines (R5 proxy 2.95 %, load generator
      3.42 %); no alert on kafka, which has no rule of its own. Four to six alerts on three
      services by the fix, the culprit on none of them
  - metrics: checkout's p95 at the histogram ceiling, 15000 ms, from about +3 and its error
      ratio 6 to 7 % from about +6 (A8b 6.49 %, R5 6.42 %), its rate about halved as hung orders
      hold its capacity; accounting's and fraud-detection's rates to zero by about +4 - no
      samples, not zero errors - and staying there; the frontend's throughput down with zero
      errors and its p95 unmoved (the hang holds its capacity, it does not fail); the proxy's
      and the load generator's p95s at or near the ceiling on the hung checkouts, their error
      ratios under 5 %; nothing else moving
  - metrics: kafka's 52 JVM runtime series STOP at the onset and stay absent for the fault -
      each restarted JVM lives seconds, less than one export interval, so nothing it starts
      reaches the collector - and resume after the recreate; the consumers' and checkout's
      runtime series continue through the fault (they are alive and starved) and restart at
      the fix, when all three are restarted. Predicted, not measured - restated if the halting
      broker flushes on the way down
  - logs: THE CULPRIT NAMES ITS OWN FAULT IN SECONDS - kafka's log, 28 lines a minute at rest
      (segment rolls, snapshots, all INFO), writes within five seconds of the onset (A8b +2 s,
      R5 +5 s) "Error while writing to checkpoint file" naming
      /tmp/kafka-logs/replication-offset-checkpoint, with "java.io.IOException - No space left on
      device" beneath it, and then "Shutdown
      broker because all log dirs in /tmp/kafka-logs have failed"; then a start-up banner every
      five to sixty seconds for the length of the fault (the supervisor's backoff), each ending
      in a storage error naming /tmp/kafka-logs (R5 read AccessDeniedException on
      meta.properties; the exact line is restated from the capture); a few thousand lines over
      the fault, under the capture's 20,000-line ceiling (Q113 landed for this recording);
      accounting's Order details lines and fraud-detection's Consumed record lines stop by
      about +1 and their clients write broker-down lines instead (accounting's rdkafka "brokers
      are down" naming kafka:9094, fraud-detection's client "Broker may not be available");
      checkout's log carries nothing, because it writes nothing
  - traces: checkout's PlaceOrder traces hold the producer span "orders publish" open for tens
      of seconds and ending in error (R5 49 to 78 s) - the degrading hop, the culprit's operation
      named in the hop line - under an order that had already prepared, quoted, charged and
      shipped; the proxy cuts the request at its fifteen-second timeout above it, so the error
      traces are longer than fifteen seconds edge to end; no consumer spans from either
      consumer for the length of the fault; nothing anywhere else slow
  - recovery: the restore removes the fill where it can and, where the crashloop is too fast for
      an exec to land (A8b and R5 both), recreates the broker on an empty directory and then
      restarts accounting, fraud-detection and checkout, which do not reconnect on their own;
      all clear in four to four and a half minutes (A8b +4:04, R5 +4:30); NO duplicate-key wave
      on accounting - an empty broker has nothing to redeliver (recycle_effect v2, measured
      twice); the three restarted services' runtime series restart; kafka's 52 series return.
      The other branch, pre-registered - if the rm lands in a moment the broker is up between
      restarts, the broker keeps its data and comes up on its own, and the consumers' restart
      replays whatever offsets were uncommitted, about four minutes of duplicate-key errors on
      accounting (A8's first revert). Q111 applies - the window closes two minutes after the
      all-clear
  - change: nothing recorded - no deploy, no config, no flag; the change history is empty for
      the whole window (a disk filling is not a change anything records)
  - discriminator: against v2-accounting-kafka-misconfig (one consumer with a wrong address -
      the broker healthy, the other consumer consuming, checkout unaffected, an address in the
      change record), against a wrong KAFKA_ADDR on checkout (the consumers starve but the
      broker's log is clean and checkout's client names the address it cannot reach), against a
      frozen broker (nothing answers and nothing is written - the log stops rather than
      repeats) - here the broker's own log names the storage failure in seconds and then
      repeats a start-up every backoff, its restart count climbs, its runtime series are absent,
      both consumers are silent and checkout hangs on its produce; the fix is neither a revert
      nor a restart of the broker as it stands - a restarted broker halts again on the same full
      disk - but freeing the directory, and then restarting what stopped consuming
expected_remediation_class: free_storage
# The wrong thing is a full disk, so the fix is to free it (knowledge/runbooks/class-disk-fill.md):
# remove what filled it, or recreate the broker on an empty directory. Restarting the broker as it
# stands changes nothing - it halts again in seconds; reverting configuration changes nothing -
# nothing was configured. The consumers are restarted after, as the runbook's second step, because
# in this world they do not reconnect to a broker that went away.
rehearsed: false
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). The target is the broker,
# which holds 52 JVM runtime series and writes about 28 lines a minute at rest, so the recorder is
# predicted to derive [runtime, logs]: the runtime class because the series exist (and are
# predicted to stop under the fault - a halted broker's JVM lives less than an export interval),
# the logs class because the capture's window holds far more than the derivation's ten lines
# before the onset and thousands from it. Restated to the measurement if the recorder derives
# otherwise.
answers_idle_or_absent: [runtime, logs]
