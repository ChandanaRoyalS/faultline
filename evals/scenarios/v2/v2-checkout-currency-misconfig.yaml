# v2/bad_config-6 (HOLDOUT) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Nothing may be tuned against this scenario (ADR-0008): its bundle lands under artifacts/holdout/
# and never reaches a corpus.
#
# Candidate order and eligibility: docs/design/t7.1-candidates.md, bad_config row 6 - a new design
# (v1's spare, never recorded). Kept although it is close to the dev scenario
# v2-shipping-quote-misconfig; its distinctness is decided at rehearsal against that scenario,
# named as the comparator before recording, and predicted on (a) alone (candidate list,
# 2026-09-26). The value is v1's name for the service, which does not resolve on v2.
id: v2-checkout-currency-misconfig
title: Checkout pointed at a currency host that does not exist
fault_class: bad_config
split: holdout
slot: v2/bad_config-6
world: v2
storm: true
injection:
  target: checkout
  method: v2-checkout-currency-misconfig
  params:
    env_var: "CURRENCY_ADDR"
    value: "currencyservice:7001"
ground_truth:
  root_cause: >
    Checkout's CURRENCY_ADDR was changed to a host name that does not resolve. Checkout stays up
    and every order fails at its first price conversion, before shipping is asked for a quote and
    before payment is charged. Currency itself is healthy and goes idle, because checkout is the
    caller that stopped reaching it. No service's code is wrong and currency is not at fault; the
    fault is the address checkout holds for currency.
  category: bad_config
expected_evidence:
  # Written before the first recording and checked against it (2026-09-26, t_inject 08:00:53,
  # revert at +9:31); that recording's probe during the fault saw one checkout container,
  # restarts 0 - no crashloop. Re-recorded on the revised world on 2026-09-27 (t_inject 04:22:29,
  # revert at +9:17) and restated against that recording. Distinct from
  # v2-shipping-quote-misconfig on (a), as predicted before recording and still so after its own
  # re-record: there shipping pages (checkout a minute later); here checkout pages alone and
  # shipping goes quiet.
  - alerts: ServiceHighErrorRate on checkout alone (page 4m17s); frontend and frontend-proxy errors
      two minutes later (+6m15s); ServiceNoTraffic on currency, shipping, quote, payment, email and
      accounting three minutes after the page (+7m15s). Shipping does not page with errors.
      Fraud-detection ServiceHighErrorRate at +8m15s and fraud-detection and flagd
      ServiceHighLatency at +9m15s, from its flagd EventStream's ten-minute server-side close in a
      window with no orders; nothing starts after the fix
  - metrics: checkout's error ratio settles at exactly 0.4 (two of five spans in every order) while
      its latency falls from ~40ms to under 4ms; currency's request rate falls from ~0.3/s to zero
      by ~+5:00 with no error series at all; frontend's error ratio peaks at ~6%
  - logs: neither checkout nor currency has a Loki stream; the frontend's log carries checkout's
      error text (`failed to prepare order`, `failed to convert price of ... to USD`), 164 lines
      over ~10 minutes (4 to 32 a minute, two lines per error), none before or after
  - traces: checkout's PlaceOrder errors with that text; oteldemo.CurrencyService/Convert errors
      with `name resolver error - produced zero addresses` and no currency span beneath it (the
      degrading hop from prepareOrderItemsAndShippingQuoteFromCart, 10 of 10 sampled traces); no
      shipping or payment call follows; fraud-detection's only error spans are its flagd
      EventStream, closed by server-side timeout
  - metrics: checkout's Go runtime series (9) report through the fault without a gap - the process
      is up
  - change: CURRENCY_ADDR on checkout changed to currencyservice:7001, coinciding with onset;
      nothing changed on currency
  - discriminator: checkout pages and its error names the currency step, and currency is among the
      services that went quiet; but currency is idle, not failing (no errors, no spans), the failing
      call never reaches it, and its error is a name-resolution failure in checkout - the fault is
      checkout's configuration, not currency
expected_remediation_class: config_revert
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running
# world 2026-09-26, as the candidate list asks: Prometheus holds 9 Go runtime series for checkout
# (8 families, go_*), and Loki has no checkout stream in 24 hours (checkout logs only over OTLP,
# to a store no tool reads). The first recording confirmed it: 9 runtime series, 0 target log
# lines, and the recorder derived [runtime].
# The 2026-09-27 re-record derived the same: 9 runtime series, 0 target log lines, [runtime].
answers_idle_or_absent: [runtime]
