# v2/datastore_corruption-2 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, datastore_corruption row 3 -
# dev-only: A10 and R6 are published. Row 2 (the orders topic) left no scenario file: A9 blocked it
# by hand, so this is the row's second scenario and takes the second slot. The injector's SQL form
# (0289) runs A10's write. Measured before authoring (2026-09-30 05:40 UTC, read-only): the table
# at rest - 10 rows, 10 descriptions, fingerprint f9b57aae49e7ad4305e3120a54fdc20d, the catalog as
# shipped; product-catalog serving about 2.2 GetProduct and 0.19 ListProducts server spans a
# second, each over one sql.conn.query client span (OmitRows), about 4.7 spans a second in all;
# its callers the frontend (GetProduct 1.93/s), checkout (GetProduct 0.25/s) and recommendation
# (ListProducts 0.19/s, the only caller of the list); NO runtime series for product-catalog under
# the recorder's selector (its container log ends on metric-upload deadlines from 2026-09-28 -
# Q119) and none for postgresql; postgresql's own log 22 lines in the last hour, all routine
# checkpoints, a start and a complete every five minutes.
id: v2-postgresql-catalog-corruption
title: Every product description in the catalog database is NULL - the catalog cannot read its rows
fault_class: datastore_corruption
split: dev
slot: v2/datastore_corruption-2
world: v2
injection:
  target: postgresql
  method: v2-postgresql-catalog-corruption
  params:
    table: catalog.products
    column: description
    key: id
    database: otel
    user: root
ground_truth:
  root_cause: >
    The product catalog's rows in its Postgres database were corrupted: the description column of
    every row in catalog.products was set to NULL. The column accepts NULL, so the database took
    the write and went on answering every query at once; the product-catalog service scans each
    row's description into a string and cannot scan a NULL, so every read of a row failed after
    the query had returned. Every product list failed with the scan error naming the description
    column, and every single-product lookup failed and was reported as "Product Not Found" for
    products the table holds. Recommendations, product pages, cart views and every order failed
    fast; orders failed before payment, so everything an order reaches after its product lookups
    went silent. Nothing was deployed, configured or flagged, and neither the catalog nor its
    database was down or slow.
  category: datastore_corruption
expected_evidence:
  # From A10 (by hand, 2026-09-30 04:16) and R6 (through the injector, 05:04), both on the revised
  # world; predicted before recording and checked against the bundle. The class's shape on a SQL
  # store: the reader of the store pages on its own error rate with its callers, because every
  # one of its server spans fails and they are half of what it emits; the store emits no span and
  # no line about it; nothing is slow.
  - alerts: ServiceHighErrorRate on five services in one evaluation at three to four minutes -
      frontend, frontend-proxy, load-generator, product-catalog and recommendation (A10 +3:00,
      R6 +3:31) - the catalog among the first, not a hop below them; checkout's a minute later
      (+4:00, +4:31); ServiceNoTraffic on the six services only a placed order reaches -
      accounting, currency, email, payment, quote, shipping - at seven and a half to eight minutes
      (A10 +8:00, R6 +7:31), which with the fix at page + 5:00 is at the fix's edge, so before it
      is likely and not certain; fraud-detection possibly raising a short ServiceHighErrorRate
      and ServiceHighLatency once orders stop (R6, +7:31 to +9:01) or ServiceNoTraffic (A10
      +10:00, after the fix here) - the dead end the freeze and the partition of the catalog also
      show; no latency alert on the catalog's path; nothing on postgresql, which emits no spans;
      a storm by the record's measure - ten or more alerts by the fix - likely
  - metrics: product-catalog's error ratio at 50 % (every server span fails; its database spans,
      the other half, succeed) with its p95 at 2 to 4 ms and its span rate about 2.8 a second;
      recommendation at about 67 %; the frontend and frontend-proxy at 53 to 56 %; checkout at
      50 % with a 2 to 3 ms p95; the load generator at 28 to 30 %; accounting, currency, email,
      payment, quote, shipping, kafka and fraud-detection at 0 req/s; every p95 on the path
      unmoved
  - metrics: no runtime series for the target - postgresql exports none on this world - and none
      for product-catalog, whose metric exports have failed since 2026-09-28 (Q119); a responder
      cannot read either process's own health from its runtime, and nothing here turns on it
  # Quoted text below writes the logs' and spans' colons as " - ", this file's YAML rule.
  - logs: THE READER'S WORDS NAME THE FAULT, ONE HOP OVER FROM THE STORE - recommendation's log
      from within seconds of the onset, "Exception calling application - <_InactiveRpcError ...
      StatusCode.INTERNAL details = "failed to load products - failed to get products from rows
      - failed to scan product row - sql - Scan error on column index 2, name "description" -
      converting NULL to string is unsupported"", a few a minute to the fix; the frontend's log
      the same text relayed, and "Error - 5 NOT_FOUND - Product Not Found - <id>" for ids the
      table holds; product-catalog's log nothing, as at rest; the store's own log - the
      recorder's capture, the target's - routine checkpoints every five minutes and no line
      naming an update, a table or an error
  - traces: product-catalog's ListProducts server span in error in under a millisecond or two
      with the scan error naming the description column, and its GetProduct span in error with
      "Product Not Found - <id>" for ids the table holds, EACH OVER A sql.conn.query CLIENT SPAN
      NOT IN ERROR - the database answered and what it answered could not be read, the class's
      fingerprint in one tree (R6, every trace read); the degrading hop ends at the catalog's
      span, not at the database; checkout's PlaceOrder in error with "failed to prepare order -
      failed to get product" after a cart read that succeeded, before any charge; recommendation's
      get_product_list in error over its failed ListProducts; nothing slow, nothing over the
      proxy's timeout
  - recovery: the saved descriptions written back in one statement and the table's fingerprint
      back at f9b57aae49e7ad4305e3120a54fdc20d; the errors stop at the write, with nothing
      restarted - the catalog reads on every call and its connections are untouched; the
      no-traffic alerts clear within about a minute as orders flow, the error-rate alerts as
      their windows drain; all clear in four and a half to five minutes (A10 4m30s, R6 5m01s);
      no alert only in recovery
  - change: nothing recorded - no deploy, no config, no flag; the change history is empty for
      the whole window (the store's contents changed, and nothing records those)
  - discriminator: against v2-product-catalog-flag-failure (a flag refuses one product in its own
      words, lists succeed, and the catalog stays under its line), against v2-product-catalog-freeze
      and v2-product-catalog-partition (the callers page on errors and latency and the catalog
      goes silent; the same six order-only services starve, so that silence does not tell them
      apart), against a slow catalog (nothing errs) - here the catalog pages on its own error
      rate, keeps answering at its usual rate and speed, its spans fail over database queries
      that succeed, and the callers' logs carry the reader's own words - a NULL that cannot be
      scanned into a named column; the fix is neither a revert, a restart nor a flag, but
      restoring the table's contents
expected_remediation_class: restore_data
# The wrong thing is the stored contents, so the fix is to restore them
# (knowledge/runbooks/class-datastore-corruption.md). Restarting product-catalog changes nothing -
# it reads the same NULLs on its next query; restarting postgresql changes nothing - the rows are
# in its data; reverting configuration changes nothing - nothing was configured. The injector's
# restore writes the saved values back and checks the fingerprint.
rehearsed: false
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). The target is the store,
# postgresql, which exports no runtime series and writes two lines per five-minute checkpoint -
# 22 in the hour before authoring. The recorder's window runs from five minutes before the
# onset to two minutes after all clear, about twenty minutes on A10's and R6's timings, so its
# capture is predicted at seven to nine lines, under the derivation's ten: no class can answer
# whether the target was idle or absent, and the narrative must not turn on it - it does not,
# the store answering every query throughout. Restated to the measurement if the recorder derives
# otherwise (a slower clear puts it over ten).
answers_idle_or_absent: []
