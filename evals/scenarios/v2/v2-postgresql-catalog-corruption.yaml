# v2/datastore_corruption-2 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, datastore_corruption row 3 -
# dev-only: A10 and R6 are published. Row 2 (the orders topic) left no scenario file: A9 blocked it
# by hand, so this is the row's second scenario and takes the second slot. The injector's SQL form
# (0289) runs A10's write. Measured before authoring (2026-09-30 05:40 UTC, read-only): the table
# at rest - 10 rows, 10 descriptions, fingerprint f9b57aae49e7ad4305e3120a54fdc20d, the catalog as
# shipped; product-catalog serving about 2.2 GetProduct and 0.19 ListProducts server spans a
# second, each over one sql.conn.query client span (OmitRows), about 4.7 spans a second in all;
# its callers the frontend (GetProduct 1.93/s), checkout (GetProduct 0.25/s) and recommendation
# (ListProducts 0.19/s, the only caller of the list); NO runtime series for product-catalog under
# the recorder's selector (its container log ends on metric-upload deadlines from 2026-09-28 -
# Q119) and none for postgresql; postgresql's own log 22 lines in the last hour, all routine
# checkpoints, a start and a complete every five minutes.
# Recorded twice on 2026-09-30. The first recording (05:53 UTC, superseded/20260930T055341Z/) is
# INVALID by Q120's registered rule: Tempo's search had been blind to its stored blocks since
# 2026-09-28 14:55, its repair was accepted on substance and failed its acceptance as written, and
# the registration's consequence of that is a re-record. The re-record (06:52 UTC) is the recording
# of record, made on a world that passed the Q120 trace-depth check; its read-back was run at once.
# Q119 had cleared on its own before it (product-catalog's 9 runtime series back by 06:49).
id: v2-postgresql-catalog-corruption
title: Every product description in the catalog database is NULL - the catalog cannot read its rows
fault_class: datastore_corruption
split: dev
slot: v2/datastore_corruption-2
world: v2
injection:
  target: postgresql
  method: v2-postgresql-catalog-corruption
  params:
    table: catalog.products
    column: description
    key: id
    database: otel
    user: root
ground_truth:
  root_cause: >
    The product catalog's rows in its Postgres database were corrupted: the description column of
    every row in catalog.products was set to NULL. The column accepts NULL, so the database took
    the write and went on answering every query at once; the product-catalog service scans each
    row's description into a string and cannot scan a NULL, so every read of a row failed after
    the query had returned. Every product list failed with the scan error naming the description
    column, and every single-product lookup failed and was reported as "Product Not Found" for
    products the table holds. Recommendations, product pages, cart views and every order failed
    fast; orders failed before payment, so everything an order reaches after its product lookups
    went silent. Nothing was deployed, configured or flagged, and neither the catalog nor its
    database was down or slow.
  category: datastore_corruption
expected_evidence:
  # Predicted before recording from A10 (by hand) and R6 (through the injector), both on the
  # revised world; restated here to the recording of record, 2026-09-30 06:52:53 UTC (the first,
  # 05:53, is superseded as invalid - see the header). What the prediction got wrong is kept in
  # t7.1-candidates.md; the lines below are what was recorded, and quoted text writes the logs'
  # and spans' colons as " - ", this file's YAML rule.
  - alerts: ServiceHighErrorRate on five services in one evaluation at 3m45s - recommendation,
      product-catalog, load-generator, frontend-proxy and frontend - the reader of the corrupted
      store among them; checkout's a minute later; ServiceNoTraffic on accounting, currency,
      email, payment, quote and shipping together at 7m30s and ServiceHighErrorRate on
      fraud-detection at 8m30s, both before the fix at 8m45s - thirteen alerts on thirteen
      services by the fix, no latency alert among them; one alert only in recovery,
      ServiceHighLatency on fraud-detection 45 s after the fix, for under a minute (the first
      recording showed the same); nothing on postgresql, which emits no spans
  - metrics: product-catalog's error ratio at 50 % from T+5 to the fix (every server span fails,
      its database spans - the other half - succeed), its p95 FALLING from about 4.4 to 1.9 ms and
      its rate from about 5.5 to 2.8 spans a second; recommendation at 67 %; the frontend and the
      proxy at 49 to 55 %; checkout at 50 % with its p95 from about 25 to 3.5 ms; the load
      generator at 28 to 30 %; payment, email, currency, quote, shipping, accounting and
      fraud-detection at zero rate from T+5; cart, ad and product-reviews unmoved
  - metrics: no runtime series for the target - postgresql exports none on this world - and the
      recorder derived none; product-catalog's own nine Go series were reporting (Q119 had
      cleared), which nothing here turns on
  - logs: THE READER'S WORDS NAME THE FAULT, ONE HOP OVER FROM THE STORE - recommendation's log
      from 7 s after the onset, "Exception calling application - <_InactiveRpcError ...
      StatusCode.INTERNAL details = "failed to load products - failed to get products from rows
      - failed to scan product row - sql - Scan error on column index 2, name "description" -
      converting NULL to string is unsupported"", 376 such lines to the fix, none before or after;
      the frontend's log the same text relayed, and "Error - 5 NOT_FOUND - Product Not Found -
      <id>" 1,112 times for all ten products in the table, 98 to 128 each, none before;
      product-catalog's log nothing, as at rest; accounting's "Order details" 43 in the five
      minutes before and none from onset to fix; the store's own log - the recorder's capture, 5
      lines - routine checkpoints only, the one inside the fault skipped for want of writes and
      the next writing 42 buffers against 120 to 165 at rest
  - traces: product-catalog's GetProduct server span in error in 0.3 to 0.8 ms with "Product Not
      Found - <id>" for ids the table holds, EACH OVER A sql.conn.query CLIENT SPAN NOT IN ERROR -
      the database answered and what it answered could not be read, the class's fingerprint in
      one tree; no database span in error in the whole window; its ListProducts spans in error in
      94 traces, one under each recommendations request; checkout's PlaceOrder in error with
      "failed to prepare order - failed to get product <id>" after a GetCart that succeeded, and
      nothing after it; the degrading hop ends at the catalog's span; nothing slow but
      fraud-detection's ten-minute flag stream, closed by the flag service on its timer
  - recovery: the saved descriptions written back and the table's fingerprint back at
      f9b57aae49e7ad4305e3120a54fdc20d; one lookup in error at the instant of the restore and
      none after; the no-traffic alerts cleared within a minute, checkout's error rate at 2m30s,
      the rest by 4m46s - all clear 4m46s; fraud-detection's latency the one alert only in
      recovery; nothing restarted
  - change: nothing recorded - no deploy, no config, no flag; the change history is empty for
      the whole window (the store's contents changed, and nothing records those)
  - discriminator: against v2-product-catalog-flag-failure (a flag refuses one product in its own
      words, lists succeed, and the catalog stays under its line), against v2-product-catalog-freeze
      and v2-product-catalog-partition (the callers page on errors and latency and the catalog
      goes silent; the same six order-only services starve, so that silence does not tell them
      apart), against a slow catalog (nothing errs) - here the catalog paged on its own error
      rate in the first evaluation, kept answering fast, its spans failed over database queries
      that succeeded, and the callers' logs carried the reader's own words, a NULL that cannot be
      scanned into a named column; the fix is neither a revert, a restart nor a flag, but
      restoring the table's contents. Held on the recording
expected_remediation_class: restore_data
# The wrong thing is the stored contents, so the fix is to restore them
# (knowledge/runbooks/class-datastore-corruption.md). Restarting product-catalog changes nothing -
# it reads the same NULLs on its next query; restarting postgresql changes nothing - the rows are
# in its data; reverting configuration changes nothing - nothing was configured. The injector's
# restore writes the saved values back and checks the fingerprint.
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). The target is the store,
# postgresql, which exports no runtime series and writes two lines per five-minute checkpoint -
# 22 in the hour before authoring - so the recorder's twenty-minute capture was predicted at seven
# to nine lines, under the derivation's ten. It held 6 on the first recording and 5 on the
# recording of record (a checkpoint is skipped when nothing has been written), and the recorder
# derived [] with none_can_answer both times, as declared. The narrative does not turn on whether
# the store was idle or absent: it answered every query throughout.
answers_idle_or_absent: []
