# v2/bad_config-1 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md (dev-only: A6 is published).
id: v2-accounting-bad-credential
title: Accounting's database password rotated to one the database does not accept
fault_class: bad_config
split: dev
slot: v2/bad_config-1
world: v2
injection:
  target: accounting
  method: v2-accounting-bad-credential
  params:
    env_var: "DB_CONNECTION_STRING"
    value: "Host=postgresql;Username=otelu;Password=otelp-2026q3;Database=otel"
ground_truth:
  root_cause: >
    The accounting service's DB_CONNECTION_STRING was changed so its password is one Postgres
    does not accept. Postgres is up and healthy and every other client of it is unaffected;
    accounting keeps consuming orders from Kafka and fails every write, because each connection
    it opens is refused at authentication.
  category: bad_config
expected_evidence:
  # From A6 (by hand, 2026-09-23), checked against this scenario's bundle as re-recorded on the
  # revised world on 2026-09-27 (raised memory limits; t_inject 2026-09-27T02:37:31+00:00, revert
  # at +8:16; three earlier recordings in superseded/) and the live read-back of its window.
  # Dev-only evidence.
  - alerts: ServiceHighErrorRate on accounting itself and nothing else, during the fault or after
      the fix (A6 +5:03, bundle +3:15 first seen, page 3m16s); nothing upstream pages - checkout
      publishes to Kafka and does not wait on accounting
  - metrics: accounting's error ratio reads zero before the fault, rises from +1:00 (7.8 %) and
      settles at exactly one third from +4:00 once the [5m] window fills - one failing span of
      three per order, so every order fails; its request rate (~0.35-0.45/s) and latency (~90ms)
      do not move; the alert clears 4m01s after the fix
  - logs: the recreated accounting starts at onset and takes its first order at +0:44; every order
      after that logs `Order parsing failed` wrapping `Npgsql.PostgresException 28P01` (password
      authentication failed for user "otelu"), about forty lines each - 66 failures (132
      'password authentication failed' lines) during the fault, up to 11 a minute, none in the
      five minutes before or after. A single `Cannot load library libgssapi_krb5.so.2` precedes the
      first failure - the driver reaching for another mechanism, not the cause. A start-to-fix
      logql_query returns the restart's banner at one end and the bottom of a 28P01 trace at the
      other; the label is in the elided middle (Q100)
  - traces: each order is order-consumed, orders receive and `CONNECT otel`; all 10 error traces
      read back name the connect span (hop order-consumed -> CONNECT otel) as the error, with status
      message `28P01`, and the consumer span around it is not
  - metrics: accounting's .NET runtime series (42) never drop out, and its PostgresException count
      in dotnet_exceptions_total, flat before the change, climbs ~2.5/s from the second minute to
      1,188 by the fix
  - metrics: fraud-detection, the other consumer of the same orders, keeps its rate and latency;
      its ~1.5 % error blip at +1 to +4 min is shared by flagd, ad, recommendation and
      product-reviews and recurs ten minutes later, after the fix - not orders. postgresql's other
      clients (product-catalog, product-reviews) show no change in latency, the catalog no errors -
      the messages and the database are fine; one client cannot authenticate
  - change: DB_CONNECTION_STRING updated on accounting, coinciding exactly with onset
  - discriminator: every write fails the same way from the first message, which separates a
      refused credential from a saturated pool or a slow database; and `28P01` means the database
      was reached and refused the password, which separates it from a wrong host or port
expected_remediation_class: config_revert
rehearsed: true
# Declared before recording, checked against the bundle after (T7.5): accounting is .NET, whose
# runtime series v2 carries by service_name (dotnet_*/process_*), and it logs every failure. The
# 2026-09-27 re-recording captured 42 runtime series and 474 target log lines and derived the same
# [runtime, logs].
answers_idle_or_absent: [runtime, logs]
