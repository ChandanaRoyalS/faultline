# v2/bad_config-1 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md (dev-only: A6 is published).
id: v2-accounting-bad-credential
title: Accounting's database password rotated to one the database does not accept
fault_class: bad_config
split: dev
slot: v2/bad_config-1
world: v2
injection:
  target: accounting
  method: v2-accounting-bad-credential
  params:
    env_var: "DB_CONNECTION_STRING"
    value: "Host=postgresql;Username=otelu;Password=otelp-2026q3;Database=otel"
ground_truth:
  root_cause: >
    The accounting service's DB_CONNECTION_STRING was changed so its password is one Postgres
    does not accept. Postgres is up and healthy and every other client of it is unaffected;
    accounting keeps consuming orders from Kafka and fails every write, because each connection
    it opens is refused at authentication.
  category: bad_config
expected_evidence:
  # From A6 (by hand, 2026-09-23), dev-only evidence. To be checked against the bundle at
  # rehearsal and corrected there, as the freeze's were.
  - alerts: ServiceHighErrorRate on accounting itself, about five minutes after the change (A6
      +5:03); nothing upstream pages - checkout publishes to Kafka and does not wait on accounting
  - logs: accounting logs the authentication failure on every order - `SqlState 28P01`,
      password authentication failed for user "otelu", thrown from the consumer's message handler
  - traces: accounting's database connection opens are error spans of their own; the consumer
      span around them carries the failure
  - metrics: postgresql and its other clients (product-catalog, product-reviews) show no error
      or latency change - the database is healthy and only one client cannot authenticate
  - container: accounting was recreated at onset and runs normally otherwise - not crashing,
      restarting or resource-constrained; it keeps consuming
  - change: DB_CONNECTION_STRING on accounting differs from the world's declared value, and the
      change coincides exactly with onset
  - discriminator: every write fails the same way from the first message, which separates a
      refused credential from a saturated pool or a slow database, and the error is an
      authentication refusal, not a connection refusal, which separates it from a wrong host or
      port
expected_remediation_class: config_revert
rehearsed: false
# Declared before recording, checked against the bundle after (T7.5): accounting is .NET, whose
# runtime series v2 carries by service_name (dotnet_*/process_*), and it logs every failure.
answers_idle_or_absent: [runtime, logs]
