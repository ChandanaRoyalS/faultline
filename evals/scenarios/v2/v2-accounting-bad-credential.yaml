# v2/bad_config-1 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md (dev-only: A6 is published).
id: v2-accounting-bad-credential
title: Accounting's database password rotated to one the database does not accept
fault_class: bad_config
split: dev
slot: v2/bad_config-1
world: v2
injection:
  target: accounting
  method: v2-accounting-bad-credential
  params:
    env_var: "DB_CONNECTION_STRING"
    value: "Host=postgresql;Username=otelu;Password=otelp-2026q3;Database=otel"
ground_truth:
  root_cause: >
    The accounting service's DB_CONNECTION_STRING was changed so its password is one Postgres
    does not accept. Postgres is up and healthy and every other client of it is unaffected;
    accounting keeps consuming orders from Kafka and fails every write, because each connection
    it opens is refused at authentication.
  category: bad_config
expected_evidence:
  # From A6 (by hand, 2026-09-23), checked against this scenario's bundle as re-recorded
  # 2026-09-26 on Tempo 2.6.1 (Q102, Q104; revert at +8:46; two earlier recordings in
  # superseded/) and the trace tool's read-back of its window. Dev-only evidence.
  - alerts: ServiceHighErrorRate on accounting itself and nothing else, during the fault or after
      the fix (A6 +5:03, bundle page 3m46s); nothing upstream pages - checkout publishes to Kafka
      and does not wait on accounting
  - metrics: accounting's error ratio reads zero before the fault, rises from ~+1:30 and settles
      at exactly one third once the [5m] window fills - one failing span of three per order, so
      every order fails; its request rate and latency do not move
  - logs: every order after the change logs `Order parsing failed:` wrapping
      `Npgsql.PostgresException 28P01` (password authentication failed for user "otelu"), about
      forty lines each; none before it does. A single `Cannot load library libgssapi_krb5.so.2`
      precedes the first failure - the driver reaching for another mechanism, not the cause. A
      start-to-fix logql_query returns the restart's banner at one end and the bottom of a 28P01
      trace at the other; the label is in the elided middle (Q100)
  - traces: each order is order-consumed, orders receive and `CONNECT otel`; the connect span is
      the error, with status message `28P01`, and the consumer span around it is not
  - metrics: accounting's .NET runtime series never drop out, and its PostgresException count in
      dotnet_exceptions_total appears at the change and climbs ~2/s through the fault
  - metrics: fraud-detection, the other consumer of the same orders, and postgresql's other
      clients (product-catalog, product-reviews) show no change in errors or latency - the messages
      and the database are fine; one client cannot authenticate
  - change: DB_CONNECTION_STRING updated on accounting, coinciding exactly with onset
  - discriminator: every write fails the same way from the first message, which separates a
      refused credential from a saturated pool or a slow database; and `28P01` means the database
      was reached and refused the password, which separates it from a wrong host or port
expected_remediation_class: config_revert
rehearsed: true
# Declared before recording, checked against the bundle after (T7.5): accounting is .NET, whose
# runtime series v2 carries by service_name (dotnet_*/process_*), and it logs every failure.
answers_idle_or_absent: [runtime, logs]
