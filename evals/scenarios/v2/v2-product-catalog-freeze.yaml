# v2/process_freeze-1 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md (dev-only: A2, R2b are published).
# The first scenario authored on the v2 world, and the first v2 bundle the recorder writes.
id: v2-product-catalog-freeze
title: The product catalog process is frozen - its socket accepts and nothing answers
fault_class: process_freeze
split: dev
slot: v2/process_freeze-1
world: v2
injection:
  target: product-catalog
  method: v2-product-catalog-freeze
  params: {}
ground_truth:
  root_cause: >
    The product-catalog container was paused (docker pause): the process exists and holds its
    port, the kernel accepts connections into the backlog, and nothing answers them. Every
    caller hangs to its own deadline, so the browse path and everything behind it stall; the
    catalog itself neither errors nor logs, because it is not running.
  category: process_freeze
expected_evidence:
  # From A2 (by hand) and R2b (through the injector, whole world), 2026-09-22 and 2026-09-24,
  # checked against this scenario's bundle (recorded 2026-09-24 on the world with Postgres at
  # 256M and the four headroom rows; revert at +9:46). All three are dev-only evidence.
  - alerts: the callers page, not the culprit - ServiceHighErrorRate on frontend-proxy and
      load-generator at ~+4:40 (A2 +4:36, R2b +4:35, bundle +4:46), their ServiceHighLatency within
      the minute; ServiceHighLatency/frontend about a minute after the page (bundle +5:45, R2b
      +6:35); ServiceNoTraffic on product-catalog at ~+7:35 to +8:00 with six starved services beside
      it (accounting, currency, email, payment, quote, shipping). Short error and latency alerts on
      recommendation, fraud-detection and flagd follow - sixteen alerts on thirteen services by the
      revert at +9:46 (R2b thirteen on ten by minute twelve)
  - metrics: frontend's p95 goes to the histogram's ceiling (15000ms) from ~+2:45 while it records
      no error at all - its error-ratio query returns no series, not zero - and its request rate
      falls ~80 % (10.8 to 2.1 req/s); the errors surface one hop up, at frontend-proxy (~28 %), as
      Envoy's upstream timeouts
  - metrics: product-catalog's request rate goes to zero by ~+4:45 and stays there, and from then
      on its error ratio and latency have no value at all - not zero errors, no samples
  - metrics: product-catalog's own runtime series (go_*, by service_name) stop moving at the
      freeze - its last once-a-minute report lands a quarter to half a minute before onset - and
      drop out of queries at ~+4:30 when Prometheus's five-minute lookback runs out, just before the
      page; back within 15 s of the unpause. A partition cuts them too (the SDK cannot export, R3),
      so this separates frozen-or-cut-off from idle, not freeze from partition
  - logs: product-catalog writes nothing for the whole window - not an error, not a line - and
      nothing in the healthy five minutes before the fault either, so silence alone is not the fault
  - traces: the proxy's spans end at its 15 s deadline (load-generator/GET -> frontend-proxy/ingress
      15001ms, error); below it frontend's call into the catalog
      (grpc.oteldemo.ProductCatalogService/GetProduct) stays open until the catalog resumes (up to
      531.8 s in this bundle's window), and the trace tool names it as the degrading hop, still
      waiting after the proxy gave up (rule 0, Q94). Some traces name frontend's call into
      recommendation instead, which waits on the catalog in turn. The catalog's own spans appear
      only after the resume, ~0.1 s each, none an error
  - change: nothing recorded - no deploy, no config, no flag
  - discriminator: a partition of the same service looks identical on alerts, metrics, runtime
      series and traces; the freeze is the one whose target logs nothing at all, where a
      partitioned target logs its export failures once a minute (R3)
expected_remediation_class: restart
# The freeze resolves when the process is unfrozen; where an operator cannot `unpause`, a restart
# is what does it (knowledge/runbooks/class-process-freeze.md). Nothing was changed, so nothing
# is reverted.
rehearsed: true
answers_idle_or_absent: [runtime]
