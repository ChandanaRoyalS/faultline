# v2/process_freeze-1 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md (dev-only: A2, R2b are published).
# The first scenario authored on the v2 world, and the first v2 bundle the recorder writes.
id: v2-product-catalog-freeze
title: The product catalog process is frozen - its socket accepts and nothing answers
fault_class: process_freeze
split: dev
slot: v2/process_freeze-1
world: v2
injection:
  target: product-catalog
  method: v2-product-catalog-freeze
  params: {}
ground_truth:
  root_cause: >
    The product-catalog container was paused (docker pause): the process exists and holds its
    port, the kernel accepts connections into the backlog, and nothing answers them. Every
    caller hangs to its own deadline, so the browse path and everything behind it stall; the
    catalog itself neither errors nor logs, because it is not running.
  category: process_freeze
expected_evidence:
  # From A2 (by hand) and R2b (through the injector, whole world), 2026-09-22 and 2026-09-24,
  # checked against this scenario's bundle as re-recorded 2026-09-26 on Tempo 2.6.1 and the 100M
  # catalog (Q101, Q102, Q104; revert at +10:01; two earlier recordings in superseded/). All three
  # are dev-only evidence.
  - alerts: the callers page, not the culprit - ServiceHighErrorRate and ServiceHighLatency on
      frontend-proxy and load-generator together (bundle +4:45 first seen, page at 5m01s; A2 +4:36,
      R2b +4:35); ServiceHighLatency/frontend about a minute later; ServiceNoTraffic on
      product-catalog under three minutes after the page, with eight starved services beside it
      (accounting, currency, email, fraud-detection, payment, quote, recommendation, shipping) -
      fourteen alerts on twelve services by the revert
  - metrics: frontend's p95 goes to the histogram's ceiling (15000ms) about a minute before the
      page, near it a minute earlier, while its error ratio reads zero - not one span ends in
      error - and its request rate falls ~80 % (12.8 to 2.2 req/s); the errors surface one hop
      up, at frontend-proxy (27-29 %), as Envoy's upstream timeouts
  - metrics: product-catalog's request rate goes to zero at the page and stays there, and from
      then on its error ratio and latency have no value at all - not zero errors, no samples
  - metrics: product-catalog's own runtime series (go_*, by service_name) stop moving at the
      freeze - its last once-a-minute report lands less than a minute before onset - and drop out
      of queries just under a minute before the page, when Prometheus's lookback runs out; back
      within 15 s of the unpause. A partition cuts them too (the SDK cannot export, R3), so this
      separates frozen-or-cut-off from idle, not freeze from partition
  - logs: product-catalog writes nothing for the whole window - not an error, not a line - and
      nothing in the healthy five minutes before the fault either, so silence alone is not the fault
  - traces: the proxy's spans end at its 15 s deadline (load-generator/GET ->
      frontend-proxy/ingress, error); below it frontend's call into the catalog
      (grpc.oteldemo.ProductCatalogService/GetProduct) stays open until the catalog resumes (up to
      588.3 s in this bundle's window), and the trace tool names it as the degrading hop, still
      waiting after the proxy gave up (rule 0, Q94). Some traces name checkout's call into the
      catalog, or frontend's call into recommendation, which waits on the catalog in turn. The
      catalog has no spans during the hang; its spans appear only after the resume, 80-450 ms
  - recovery: at the resume the woken backlog exhausts Postgres's connection slots (157 refusals,
      `too many clients already`), and the catalog answers `Product Not Found` for products that
      exist - errors on checkout, frontend and the catalog, and six recovery-only alerts. Postgres
      does not restart (it did at 80M, Q96). This is the fix's wave, not the fault
  - change: nothing recorded - no deploy, no config, no flag
  - discriminator: a partition of the same service looks identical on alerts, metrics, runtime
      series and traces; the freeze is the one whose target logs nothing at all, where a
      partitioned target logs its export failures once a minute (R3)
expected_remediation_class: restart
# The freeze resolves when the process is unfrozen; where an operator cannot `unpause`, a restart
# is what does it (knowledge/runbooks/class-process-freeze.md). Nothing was changed, so nothing
# is reverted.
rehearsed: true
answers_idle_or_absent: [runtime]
