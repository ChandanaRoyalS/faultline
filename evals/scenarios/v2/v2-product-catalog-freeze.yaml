# v2/process_freeze-1 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md (dev-only: A2, R2b are published).
# The first scenario authored on the v2 world, and the first v2 bundle the recorder writes.
id: v2-product-catalog-freeze
title: The product catalog process is frozen - its socket accepts and nothing answers
fault_class: process_freeze
split: dev
slot: v2/process_freeze-1
world: v2
injection:
  target: product-catalog
  method: v2-product-catalog-freeze
  params: {}
ground_truth:
  root_cause: >
    The product-catalog container was paused (docker pause): the process exists and holds its
    port, the kernel accepts connections into the backlog, and nothing answers them. Every
    caller hangs to its own deadline, so the browse path and everything behind it stall; the
    catalog itself neither errors nor logs, because it is not running.
  category: process_freeze
expected_evidence:
  # From A2 (by hand) and R2b (through the injector, whole world), 2026-09-22 and 2026-09-24,
  # checked against this scenario's bundle as re-recorded on the revised world on 2026-09-27
  # (raised memory limits; t_inject 2026-09-27T02:15:42+00:00, revert at +9:15; five earlier
  # recordings in superseded/). All three are dev-only evidence.
  - alerts: the callers page, not the culprit - ServiceHighErrorRate on frontend-proxy and
      load-generator (bundle +4:00 first seen, page at 4m15s; A2 +4:36, R2b +4:35), with
      ServiceHighLatency on the same two at +5:00; ServiceHighLatency/frontend at +6:00;
      ServiceNoTraffic on product-catalog at +8:00, 3m45s after the page, with six starved
      services beside it (accounting, currency, email, payment, quote, shipping) - sixteen alerts
      on thirteen services by the revert
  - alerts: (dead end) with orders stopped, fraud-detection raises ServiceHighErrorRate (+5:00)
      and ServiceHighLatency (+6:00) and flagd ServiceHighLatency (+6:00); their only error spans
      are fraud-detection's flagd.evaluation.v1.Service/EventStream stream, closed by flagd with
      "stream closed due to server-side timeout" (routine ten-minute reconnect), and flagd's
      EventStream spans are ten minutes long. ServiceHighErrorRate/recommendation (+6:00) rests
      on one request in five minutes (ratio 100 %, p95 at the ceiling) before its traffic goes
      to zero
  - metrics: frontend-proxy's p95 is at the histogram's ceiling (15000ms) from +2:00, frontend's
      from +3:00, while frontend's error ratio reads zero - not one span ends in error - and its
      request rate falls ~83 % (12.0 to 2.1 req/s); the errors surface one hop up, at
      frontend-proxy (25-29 % steady; load-generator 29-31 %), as Envoy's upstream timeouts
  - metrics: product-catalog's request rate goes to zero at +5:00, 45 s after the page, and
      stays there, and from then on its error ratio and latency have no value at all - not zero
      errors, no samples
  - metrics: product-catalog's own runtime series (go_*, by service_name) stop moving at the
      freeze - its last once-a-minute report lands 30 s before onset - and drop out of queries at
      the page (+4:30), when Prometheus's lookback runs out; back 15 s after the unpause. A
      partition cuts them too (the SDK cannot export, R3), so this separates frozen-or-cut-off
      from idle, not freeze from partition
  - logs: product-catalog writes nothing for the whole window - not an error, not a line (no
      Loki stream carries it) - and nothing in the healthy five minutes before the fault either,
      so silence alone is not the fault
  - traces: the proxy's spans end at its 15 s deadline (load-generator/GET ->
      frontend-proxy/ingress, error); below it frontend's call into the catalog
      (grpc.oteldemo.ProductCatalogService/GetProduct) stays open until the catalog resumes, and
      the trace tool names it as the degrading hop in all 6 frontend error traces drawn (rule 0,
      Q94); all 5 checkout error traces drawn name checkout's GetProduct call under
      prepareOrderItemsAndShippingQuoteFromCart. The catalog has no spans during the hang; its
      spans appear only after the resume
  - recovery: at the resume the woken backlog gets `Product Not Found` from the catalog for
      products that exist (checkout - "failed to prepare order - failed to get product"); frontend
      logs 77 error lines, all in the minute of the resume; frontend error ratio 11 %, catalog
      6 %, catalog p95 ~390ms against ~6ms; four recovery-only alerts (ServiceHighErrorRate/frontend
      at +12:00, ServiceHighLatency on checkout, product-catalog and recommendation at +13:00).
      This is the fix's wave, not the fault
  - change: nothing recorded - no deploy, no config, no flag
  - discriminator: a partition of the same service looks identical on alerts, metrics, runtime
      series and traces; the freeze is the one whose target logs nothing at all, where a
      partitioned target logs its export failures once a minute (R3)
expected_remediation_class: restart
# The freeze resolves when the process is unfrozen; where an operator cannot `unpause`, a restart
# is what does it (knowledge/runbooks/class-process-freeze.md). Nothing was changed, so nothing
# is reverted.
rehearsed: true
answers_idle_or_absent: [runtime]
