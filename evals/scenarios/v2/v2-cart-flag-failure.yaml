# v2/feature_flag-2 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, feature_flag row 2 - a new
# design. Read at source before authoring: the flag breaks only EmptyCart, and checkout ignores
# that error, so the page's shape is unmeasured; the candidate list records the reading and the
# rule (a page of any shape is a scenario, no page blocks it) before recording.
id: v2-cart-flag-failure
title: A feature flag makes the cart fail to empty after an order
fault_class: feature_flag
split: dev
slot: v2/feature_flag-2
world: v2
injection:
  target: cart
  method: v2-cart-flag-failure
  params:
    flag: "cartFailure"
    variant: "on"
ground_truth:
  root_cause: >
    The cartFailure feature flag was switched on in the flag service. With it on, the cart
    service's EmptyCart uses a store at a host that does not exist and fails, while adding to and
    reading carts keep using the real store and keep working. Checkout empties the customer's cart
    after an order is paid and shipped, and ignores that call's failure, so orders complete and the
    customers' carts are left full. Nothing was deployed or reconfigured and no change record
    exists; the cart is behaving exactly as written. The fault is the flag's value, and turning it
    off fixes it.
  category: feature_flag
expected_evidence:
  # Written before the first recording and checked against it (2026-09-26); re-recorded on the
  # revised world on 2026-09-27 (t_inject 04:59:36, revert at +10:16) and restated from that
  # capture and its live read-back. The page's shape was not predicted; it paged, so by the
  # candidate list's rule it is a scenario. Cart and checkout never restarted.
  - alerts: ServiceHighErrorRate on checkout alone (page 5m16s), and nothing else during the fault
      or after the fix; cart, where the flag acts, stays under the line (4.3% at most)
  - metrics: checkout's error ratio holds at 7.1-7.4% while its orders complete - payment, email
      and accounting keep their traffic, and frontend, frontend-proxy and load-generator stay at
      zero errors; checkout's p95 rises from ~34ms to 85-160ms (no latency alert), frontend's from
      ~42ms to ~68ms
  - logs: cart logs 98 EmptyCartAsync calls during the fault and 182 lines of `Wasn't able to
      connect to redis`, 2 to 26 a minute, none in the five minutes before onset or after the fix;
      its AddItemAsync lines continue at their usual pace (268 in the fault, 120 before, 176 after)
  - traces: checkout's orders complete with one failing call, oteldemo.CartService/EmptyCart, under
      a PlaceOrder that does not error; checkout's EmptyCart and cart's EmptyCart span both carry
      `Can't access cart storage` / `Wasn't able to connect to redis`, cart's with only a flagd
      lookup beneath it and no store call, while GetCart runs its HGET in about a millisecond
  - metrics: cart's .NET runtime series report through the fault without a gap (41 continuous, one
      instance) - the process is up; a new ApplicationException counter appears 30 s in and reaches
      91 by the fix, and socket exceptions climb from 5 to over 26,000, both stopping at the fix
  - change: nothing recorded - no deploy, no configuration change, no restart; flagd reloads its
      own file and leaves no change record
  - discriminator: the log says the cart cannot reach its store, and the store is healthy - cart
      reads and writes it for every other operation in the same minute; the one failing operation
      makes a flag lookup and never reaches the store, and nothing is in change history, so the
      flag's value is the change
expected_remediation_class: config_revert
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running
# world 2026-09-26, as the candidate list asks: Prometheus held 36 .NET runtime series for cart
# (24 families, dotnet_*), and its Loki stream logged 116 to 174 lines a minute at rest. The first
# recording confirmed both classes: 39 runtime series and 500 target log lines, and the recorder
# derived [runtime, logs]. The 2026-09-27 re-recording captured 42 runtime series and 80 target
# log lines and derived the same [runtime, logs].
answers_idle_or_absent: [runtime, logs]
