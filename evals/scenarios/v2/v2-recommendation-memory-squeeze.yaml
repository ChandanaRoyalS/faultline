# v2/resource_exhaustion-4 (HOLDOUT) - see SPLIT-V2.md. Nothing may be tuned against this scenario.
# Slot allocated before authoring; do not move. Candidate order and eligibility:
# docs/design/t7.1-candidates.md, resource_exhaustion row 4 - v1's holdout
# recommendation-memory-squeeze, carried to v2's recommendation under its 500M. The limit is
# re-measured on v2, never copied, and measured on a cold process (row 3's finding), before
# recording (2026-09-27).
id: v2-recommendation-memory-squeeze
title: Recommendation service memory limit cut below what its interpreter needs to start
fault_class: resource_exhaustion
split: holdout
slot: v2/resource_exhaustion-4
world: v2
injection:
  target: recommendation
  method: v2-recommendation-memory-squeeze
  params:
    # The memory a fresh interpreter holds, and the kernel cannot reclaim, at the moment it first
    # listens - 37.1 and 39.0 MiB in two cold runs of the same image - and the rule
    # 16 x (ceil(need / 16) - 2), the largest multiple of 16 MiB at least one step below the
    # need. A third of the 46 MiB the warm process holds, so it dies at once; under what the
    # interpreter needs to finish importing, so no instance ever listens. Not tuned after
    # recording: a page of any shape is the scenario, and no page blocks it.
    memory: "16m"
ground_truth:
  root_cause: >
    The recommendation service container's memory limit was lowered to 16m, below what its
    Python interpreter needs to finish starting. The kernel kills it before it can listen, the
    restart policy brings it back, and every new process is killed the same way, so the service
    is never available: the storefront's recommendation requests fail, and the process writes
    nothing, because nothing survives long enough to write. Nothing about its image, code or
    configuration changed; restoring the limit fixes it.
  category: resource_exhaustion
expected_evidence:
  # Carried from v1's holdout design, the limit re-measured on a cold process; predicted before
  # recording and to be checked against the bundle. Measured at rest (2026-09-27): recommendation
  # at 46 MiB (46.1 to 47.9 over eight hours) of 500M; the frontend its only caller, at 0.21
  # requests a second; the error rule counts every span, and a failed recommendation request
  # errors four frontend spans (the request, the route, the api route, the gRPC client) and two
  # frontend-proxy spans, which against their whole span rates is about 7.5 % and 7.7 % - over the
  # 5 % line, narrowly - and one load-generator span, 4.3 %, under it. v1's page was the frontend
  # and the load generator at 3m45s, then no-traffic on the target at +6:00.
  - alerts: ServiceHighErrorRate on the frontend and frontend-proxy, five to six minutes in
      (the five-minute ratio crossing 5 % after about three and a half minutes, then the two-minute
      hold), the frontend first or both together; ServiceNoTraffic on recommendation about eight
      minutes in, as its window drains; the load generator rising to about 4 % and staying under
      the line; nothing on the order path; the flag readers' routine stream reconnect possible
      and not a page
  - metrics: recommendation's call rate falls from 0.2 a second to nothing by +5 with no error
      ratio of its own, and from then its error ratio and p95 have no value; the frontend's error
      ratio climbs through 5 % to about 7 to 8 %, frontend-proxy's the same, the load generator's
      to about 4 %; product-catalog's rate falls by the four lookups each recommendation used to
      make; no latency moves anywhere, a refused connection costing nothing; checkout, cart and
      payment hold their rates
  - traces: every frontend error trace is a `user_get_recommendations` request ending at
      frontend/grpc.oteldemo.RecommendationService/ListRecommendations with no recommendation
      span beneath and no catalog lookups after it - the frontend's own attempts show a name
      that resolves to nothing or a connection refused at recommendation's address; not one
      recommendation server span in the fault; checkout has no error trace
  - logs: recommendation's stream ends at onset and shows nothing until after the fix - no
      shutdown line, no exception, no start-up banner, because the interpreter is killed while
      it is still importing and its stdout handler writes nothing a reader sees at start-up in
      any case; after the fix the first line is an ordinary request; the frontend logs
      UNAVAILABLE for every recommendation request, about twelve a minute
  - metrics: recommendation's process series (about twenty `process_*` series - interpreter
      memory, CPU, threads, garbage collection) hold their last values for the store's lookback
      and vanish, and no new instance's series appear before the fix - a process killed during
      import never initialises the SDK that would export them; a merely idle process keeps
      exporting
  - container: exit code 137 with OOMKilled set between every kill and the next start, the state
      `restarting` for most of the fault as the runtime backs off toward one start a minute, the
      restart count climbing past twenty, the limit at 16m (not agent-visible; the probe samples it)
  - change: a change record at onset - `memory limit lowered on recommendation`, carrying
      `memory=16m` - and no deploy, no image change, no environment change
  - discriminator: a service that goes silent with its image unchanged, its log empty rather than
      full of errors, and a change record that is its memory limit, was starved; a bad deploy
      shows an image in the record and another program's output in the log; a slow catalog
      (v2-product-catalog-dependency-latency, recommendation on its page too) shows latency with
      the target present, where here there is none and the target is absent; a flag leaves no
      record and a process that stays up; and the starved runtime that announces each restart
      (v2-ad-memory-squeeze) is told from this one, which never says a word, by its log
expected_remediation_class: config_revert
rehearsed: false
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: recommendation holds about twenty `process_*` series in the recorder's families and
# logs 12 to 19 lines a minute. Both are what the fault removes entirely: they answer by going
# absent. The interpreter is killed before its SDK initialises, so no new instance's series can
# appear under the fault; the runtime capture will hold the old instance's series only.
answers_idle_or_absent: [runtime, logs]
