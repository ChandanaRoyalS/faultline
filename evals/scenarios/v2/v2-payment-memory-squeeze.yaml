# v2/resource_exhaustion-3 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, resource_exhaustion reserve -
# new, added 2026-09-27 when row 3 (v2-cart-memory-squeeze) was blocked and the slot could not
# stay empty: slots are a contiguous prefix, and the holdout row 4 waits behind this one. The
# limit is measured on a cold process, the row's rule since row 3, before recording.
#
# Corrected 2026-09-27 after the first recording, before re-recording (the first is under
# superseded/): the ground truth said a process killed before it could listen, and the recording
# showed a process that read the new limit as it started, sized its heap to it, and ran inside
# it - slow, and killed every minute or two. The limit stays; the text of the mechanism moved,
# which moved the fingerprint, so the scenario is recorded again against the corrected text.
id: v2-payment-memory-squeeze
title: Payment service memory limit cut to what its runtime can barely run in
fault_class: resource_exhaustion
split: dev
slot: v2/resource_exhaustion-3
world: v2
injection:
  target: payment
  method: v2-payment-memory-squeeze
  params:
    # The memory a fresh Node process holds, and the kernel cannot reclaim, at the moment it
    # first listens: 108.0 MiB in two cold runs of the same image (anon 99.5, the heap's start-up
    # garbage before V8 collects it, kernel 8.5), settling to about 75 afterwards. The rule
    # 16 x (ceil(need / 16) - 2): 80m. Chosen once, and not tuned after recording. What the
    # measurement missed: it was taken with no limit, and Node reads the container's limit as it
    # starts and sizes V8's heap to it, so a process started under 80m needs less than one
    # started under none - it fits, barely, and runs slow. The recording, not the rule, found
    # that; the number stands and the mechanism text was corrected to it.
    memory: "80m"
ground_truth:
  root_cause: >
    The payment service container's memory limit was lowered to 80m, below the 103 MiB its Node
    process was using. The kernel killed it at once, and every process that replaced it read the
    new limit as it started and sized its heap to fit - a heap ceiling within about a megabyte of
    what it needs to hold - so it ran, collecting garbage almost continuously, charging cards in
    seconds instead of milliseconds, and was killed and restarted every minute or two when its
    footprint reached the limit anyway. Orders still complete, slowly, except the few in flight
    when a kill lands. Nothing about payment's image, code or configuration changed; restoring
    the limit fixes it.
  category: resource_exhaustion
expected_evidence:
  # Predicted before the second recording from the first (2026-09-27, t_inject 19:19:44, revert
  # at +13:01), which the ground truth above was corrected to. The first predicted an absence and
  # recorded a starvation: one alert, ServiceHighLatency on payment alone at 8m01s; orders
  # completing at their usual rate; payment killed and back in seconds ten times. The list below
  # states that recording as the prediction, and is checked against the second. The comparators:
  # v2-payment-dependency-latency (dev, the same target slowed by the network - checkout's p95 up
  # and payment's own unchanged, where here payment's own is up and checkout's is not: distinct on
  # (a) and (d)); v2-payment-flag-unreachable (holdout - errors on checkout, no record, payment
  # idle: distinct on (a), (b) and (c)); rows 1, 2 and 4 of this class (distinct on (a): one
  # latency alert on the target against storefront errors, one consumer's silence, and the
  # storefront again).
  - alerts: ServiceHighLatency on payment alone, about eight minutes in - its p95 over 250 ms from
      about +4:45 and the three-minute hold - and nothing else by the fix or after it; it may clear
      and return within the fault as a restart gives a fresh heap (the first recording's cleared at
      +11:45, 76 s before the fix); no ServiceHighErrorRate anywhere (checkout's ratio 0.4 to 0.6 %,
      the frontend's and the proxy's 0.15 %); no ServiceNoTraffic, payment never being absent for a
      window; the flag readers' routine stream reconnect possible and not a page
  - metrics: payment's p95 from 4 to 7 ms to about 30 ms in the first minute (a fresh process on a
      heap sized to 80m) and to 800 to 900 ms from about +4:45 - more than one charge in twenty
      over 800 ms - for the rest of the fault, with its call rate unchanged at 0.2 to 0.3 a second
      and its error ratio zero; checkout's p95 unmoved (its charges are one span in fourteen), its
      error ratio 0.4 to 0.6 %; every other rate, ratio and latency unchanged; orders completing at
      the usual rate (102 in the first recording's thirteen minutes)
  - traces: charges of one to three seconds beneath an otherwise ordinary order - cart, catalog,
      currency and the shipping quote in milliseconds, then Charge at 960 to 3,300 ms; the few
      checkout error traces are PlaceOrder failing at Charge with `connection reset by peer` or
      `error reading from server - EOF` after a one-to-three-second Charge, a kill landing on a
      request in flight; payment server spans present in every minute of the fault
  - logs: payment's `payment gRPC server started on 0.0.0.0:50051` at +3 s and then about every
      minute or two (ten in the first recording's thirteen minutes), each with nothing before it -
      no shutdown line, no error, no exception - and charge records continuing between them; the
      telemetry SDK's resource dump with every record throughout; no `UNAVAILABLE` on the frontend;
      email, accounting and fraud-detection logging every order as usual
  - metrics: payment's V8 old-space heap limit falls from 23.3 to 18.0 MiB at the first restart
      and its used old space sits within about a megabyte of it for the rest of the fault, with
      garbage collections climbing; the 75 Node series never vanish - the SDK carries no instance
      id, so a restart shows in them only as the limit's drop and a counter's reset, not as a gap
  - container: the restart count climbing by one every minute or two (11 in thirteen minutes in the
      first recording), exit code 137 and OOMKilled between a kill and the next start but the
      restart too quick for a ten-second probe to sample (0 of 71); the working set 76 to 78 MiB
      under the 80m limit while running (not agent-visible; the probe samples it)
  - change: a change record at onset - `memory limit lowered on payment`, carrying `memory=80m` -
      and no deploy, no image change, no environment change, no flag
  - discriminator: a service that is slow with its call rate unchanged, its heap ceiling dropped
      and its heap pinned against it, and its start-up line repeating with no error before it,
      whose change record is a memory limit, was starved; the same target slowed by the network
      (v2-payment-dependency-latency) shows checkout's p95 up and payment's own unchanged, with no
      restart and no change to its heap; the flag that fails its charges shows errors, not
      latency, and leaves no record; a bad deploy shows an image in the record; and the storefront
      is untouched here, which no fault on the storefront edge leaves so
expected_remediation_class: config_revert
rehearsed: false
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: payment holds 75 Node runtime series and logs 180 to 1,170 lines a minute (each
# charge is a multi-line record). The first recording (2026-09-27) showed the fault removes
# neither - the process runs, slow, between kills - and holds the mechanism in the runtime series
# (the heap limit's drop); the recorder derived [runtime, logs].
answers_idle_or_absent: [runtime, logs]
