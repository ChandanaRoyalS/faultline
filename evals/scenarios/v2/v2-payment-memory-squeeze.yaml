# v2/resource_exhaustion-3 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, resource_exhaustion reserve -
# new, added 2026-09-27 when row 3 (v2-cart-memory-squeeze) was blocked and the slot could not
# stay empty: slots are a contiguous prefix, and the holdout row 4 waits behind this one. The
# limit is measured on a cold process, the row's rule since row 3, before recording.
#
# Corrected 2026-09-27 after the first recording, before re-recording: the ground truth said a
# process killed before it could listen, and the recording showed a process that started inside
# the new limit and ran at its ceiling - slow, and killed again and again. Corrected once more
# after the second recording, to say only what the captures show: the first correction asserted
# a heap ceiling and continuous garbage collection the series do not support, and a cadence
# ("every minute or two") the second recording contradicted (bursts). The limit stays; the text
# of the mechanism moved twice, which moved the fingerprint, so the scenario was recorded three
# times and the first two are under superseded/.
id: v2-payment-memory-squeeze
title: Payment service memory limit cut to what its runtime can barely run in
fault_class: resource_exhaustion
split: dev
slot: v2/resource_exhaustion-3
world: v2
injection:
  target: payment
  method: v2-payment-memory-squeeze
  params:
    # The memory a fresh Node process holds, and the kernel cannot reclaim, at the moment it
    # first listens: 108.0 MiB in two cold runs of the same image (anon 99.5, the heap's start-up
    # garbage before V8 collects it, kernel 8.5), settling to about 75 afterwards. The rule
    # 16 x (ceil(need / 16) - 2): 80m. Chosen once, and not tuned after recording. What the
    # measurement missed: it was taken with no limit, and Node reads the container's limit as it
    # starts and sizes V8's heap to it, so a process started under 80m needs less than one
    # started under none - it fits, barely, and runs slow. The recording, not the rule, found
    # that; the number stands and the mechanism text was corrected to it.
    memory: "80m"
ground_truth:
  root_cause: >
    The payment service container's memory limit was lowered to 80m, below the 103 MiB its Node
    process was using. The kernel killed it at once. Every process that replaced it started
    inside the new limit and ran at its ceiling, starved for memory, so it served slowly -
    charges taking hundreds of milliseconds to seconds instead of a few milliseconds - and was
    killed and restarted again and again, in bursts, whenever its footprint reached the limit.
    Orders still complete, slowly, except the few in flight when a kill lands. Nothing about
    payment's image, code or configuration changed; restoring the limit fixes it.
  category: resource_exhaustion
expected_evidence:
  # Predicted before the third recording from the first two and checked against the third
  # (2026-09-27, t_inject 20:17:54, revert at +14:46), which the ground truth above describes.
  # The third paged as the first two had - ServiceHighLatency on payment alone, at 9m46s against
  # 8m01s and 9m01s - and every item below held, with the third's numbers. Not predicted: how
  # short the page is - 45 s, cleared by a burst of restarts four minutes before the fix - and
  # that the six failed orders were all refusals inside the bursts, not slow charges cut off.
  # The comparators: v2-payment-dependency-latency (dev, the same target slowed by the network -
  # checkout's p95 up and payment's own unchanged, where here payment's own is up and checkout's
  # is not: distinct on (a) and (d)); v2-payment-flag-unreachable (holdout - errors on checkout,
  # no record, payment idle: distinct on (a), (b) and (c)); rows 1, 2 and 4 of this class
  # (distinct on (a): one latency alert on the target against storefront errors, one consumer's
  # silence, and the storefront again).
  - alerts: ServiceHighLatency on payment alone (page 9m46s) - its p95 over 250 ms from +6:30 and
      the three-minute hold - firing 45 s and clearing at +10:30 when a burst of restarts gave the
      window a fresh process; one alert, none after the fix, the world all clear at the fix; no
      ServiceHighErrorRate anywhere (checkout's ratio at most 2.4 %, the storefront's under 0.8 %);
      no ServiceNoTraffic, payment never being absent for a window; no flag-stream blip this time
  - metrics: payment's p95 from 4 ms to 18 in the first half-minute, 26 to 28 for the next three
      and a half, 5 for a minute and a half, 430 to 450 for four minutes (the page), 3 at +10:30,
      93 at +11:30 and 420 to 460 from +12:30 to the fix, with its call rate unchanged at 0.25 to
      0.34 a second and its error ratio zero; checkout's p95 35 to 45 ms throughout (its charges
      are one span in fourteen), its error ratio 0.4 to 0.5 % in the first four minutes, zero for
      seven, 1.7 to 2.4 % from +11 to the fix; every other rate, ratio and latency unchanged; 122
      orders completed; after the fix p95 read 4 ms within a minute
  - traces: charges of hundreds of milliseconds to over a second beneath otherwise ordinary orders;
      six checkout error traces, every one PlaceOrder failing at Charge with `connection refused`
      at payment's address in 0 to 2 ms after the cart read, the catalog lookups, the currency
      conversions and the shipping quote completed in milliseconds - orders that reached payment
      in the seconds between a kill and the next start; payment server spans in every minute
  - logs: payment's `payment gRPC server started on 0.0.0.0:50051` thirteen times - at +3 s and
      +1:04, two at +6:05 and +6:12, four between +10:43 and +11:10, five between +14:03 and
      +14:37 - each with nothing before it - no shutdown line, no error, no exception; 369 charge
      records between them; the telemetry SDK's resource dump with every record; no `UNAVAILABLE`
      on the frontend; email, accounting and fraud-detection logging every order as usual
  - metrics: payment's 75 Node runtime series never vanish - the SDK carries no instance id, so a
      restart shows only as counters resetting and the heap's spaces starting smaller (old space
      16.6 to 17.6 MiB against 18 to 19), not as a gap; the event loop's utilisation 0.2 to 0.3 %
      at rest and 3 to 4.5 % at +2, +3, +8 and +13; no series names the limit
  - container: the restart count 25 to 38 over the fault, exit code 137 with OOMKilled set caught
      twice by a two-second probe (at +6:02 and +14:34) and `restarting` in the same two samples;
      the limit at 80m through the fault and 140M after (not agent-visible; the probe samples it)
  - change: a change record at onset - `memory limit lowered on payment`, carrying `memory=80m` -
      and no deploy, no image change (the same 2.2.0-payment before and after), no environment
      change, no flag
  - discriminator: a service that is slow with its call rate unchanged, its start-up line repeating
      in bursts with no error before it, and a change record that is its memory limit, was
      starved; the same target slowed by the network (v2-payment-dependency-latency) shows
      checkout's p95 up and payment's own unchanged, with no restart; the flag that fails its
      charges shows errors, not latency, and leaves no record; a bad deploy shows an image in the
      record; and the storefront is untouched here, which no fault on the storefront edge leaves so
expected_remediation_class: config_revert
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: payment holds 75 Node runtime series and logs 180 to 1,170 lines a minute (each
# charge is a multi-line record). The first recording (2026-09-27) showed the fault removes
# neither - the process runs, slow, between kills - and holds the mechanism in the runtime series
# (the heap limit's drop); the recorder derived [runtime, logs].
answers_idle_or_absent: [runtime, logs]
