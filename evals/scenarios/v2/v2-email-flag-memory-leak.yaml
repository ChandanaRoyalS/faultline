# v2/feature_flag-6 (HOLDOUT) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Nothing may be tuned against this scenario (ADR-0008): its bundle lands under artifacts/holdout/
# and never reaches a corpus.
#
# Candidate order and eligibility: docs/design/t7.1-candidates.md, feature_flag row 6. The row's
# design, v2-recommendation-flag-cache-leak, was blocked on its verification: on this world its
# cache never fills, so it leaks nothing. The slot passes to the next reserve in list order,
# emailMemoryLeak, which keeps the row's purpose - memory growth, resource_exhaustion's look-alike,
# by flag. Its variant, 10000x, was chosen before authoring from measurement and is not re-tried.
id: v2-email-flag-memory-leak
title: A feature flag makes the email service keep every confirmation it sends
fault_class: feature_flag
split: holdout
slot: v2/feature_flag-6
world: v2
injection:
  target: email
  method: v2-email-flag-memory-leak
  params:
    flag: "emailMemoryLeak"
    variant: "10000x"
ground_truth:
  root_cause: >
    The emailMemoryLeak feature flag was set to its 10000x variant in the flag service. With it
    set, the email service keeps every confirmation email it sends instead of discarding it, and
    pads each one's body to ten thousand times its length, about 19MB an email. Within a few emails
    the service exceeds its unchanged 100M memory limit, is killed and restarts, and it does so again
    after every few emails for as long as the flag is set. Nothing was deployed or reconfigured and
    no change record exists; the memory limit was not lowered. The fault is the flag's value, and
    turning it off stops it - the next email discards what was kept, and a restarted process starts
    empty.
  category: feature_flag
expected_evidence:
  # Written before the first recording and checked against it (2026-09-26). The page was not
  # predicted as a shape and the guess (errors on checkout) was wrong: it paged latency, so by the
  # row's rule it is a scenario. Re-recorded on the revised world on 2026-09-27 (t_inject
  # 06:11:33, revert at +9:16); the list below states that recording. Probe every 20 s.
  - alerts: ServiceHighLatency on email alone (page 4m16s), then ServiceHighLatency on checkout
      (+6:00) - two alerts by the fix and none after it; checkout's errors stay under the line
      (1.7-3.6%) and no ServiceNoTraffic fires; flag readers and flagd show 0.4-2.3% errors at
      +7 to +10, as they did before onset (flagd's stream reconnect), and nothing alerts on them
  - metrics: email's p95 from 37-43ms to 770ms at +1 and 770-850ms through the fault, with no
      error spans at all and its span rate falling from ~0.5 to 0.2-0.38 a second; checkout's p95
      from ~35ms to 560-585ms from +4; payment, accounting and fraud-detection keep their rates -
      orders complete
  - logs: email's request log shows each completed confirmation taking 0.28-1.14s (0.002-0.04s at
      rest), and its server starting again - `== Sinatra (v4.2.1) has taken the stage` and Puma's
      banner - 30 times in 9 minutes, 1 to 4 a minute, from +14s, each after one or two
      confirmations, with nothing logged before any of them and none after the fix; confirmations
      sent fall from 5-10 to 3-7 a minute
  - traces: email's send_email span holds most of the request's time as self-time with only a fast
      template render beneath it; checkout's HTTP POST to email errors with `EOF`, and once with
      `connect - connection refused` while email restarts, under a PlaceOrder that completes
  - metrics: email has no runtime series and no memory metric, so the telemetry holds no memory
      reading and no kill record; its limit is an unchanged 100M
  - change: nothing recorded - no deploy, no configuration change, no limit change; flagd reloads
      its own file and leaves no change record, and the restarts are the runtime's, not a change
  - discriminator: a service that ran steadily now dies after every one or two requests of the
      same traffic, each request costing tens to hundreds of times the time in its own code, with
      nothing in change history - something changed what a request does without a deploy, and on
      this world that is a feature flag
expected_remediation_class: config_revert
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running
# world 2026-09-26, as the candidate list asks: Prometheus held no runtime series for email (none
# of go_, dotnet_, jvm_, process_, v8js_, nodejs_ or ruby_), and its Loki stream logged 4 to 22
# lines a minute at rest. The first recording confirmed it: 0 runtime series and 482 target log
# lines, and the recorder derived [logs]. The 2026-09-27 re-recording agrees: 0 runtime series,
# 464 target log lines, derived [logs].
answers_idle_or_absent: [logs]
