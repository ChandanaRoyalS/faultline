# v2/dependency_latency-1 (dev) - see SPLIT-V2.md. Slot allocated before authoring; do not move.
# Candidate order and eligibility: docs/design/t7.1-candidates.md, dependency_latency row 1 -
# dev-only: v1's cart-dependency-latency is a published dev design, carried to v2's cart. The
# pumba and tc images were checked present on the host, every container's image present (pumba
# exits at startup otherwise), and cart's interface confirmed eth0, before authoring (2026-09-27).
id: v2-cart-dependency-latency
title: Cart service network path acquires 300ms of delay
fault_class: dependency_latency
split: dev
slot: v2/dependency_latency-1
world: v2
injection:
  target: cart
  method: v2-cart-dependency-latency
  params:
    delay_ms: 300
    jitter_ms: 0
    duration: "1h"
    # cart's one interface (docker exec cart ls /sys/class/net, 2026-09-27). The rule delays
    # packets leaving cart: its answers to callers and its requests to its store both pay it.
    interface: "eth0"
ground_truth:
  root_cause: >
    A traffic-shaping rule attached to the cart service's network namespace adds 300ms of delay
    to every packet leaving the container. Cart's own code, image, configuration and store were
    untouched. Every cart operation pays the delay on its answer and again on each round trip to
    its store, so cart's latency rises to several hundred milliseconds and every caller that
    reads or writes a cart waits on it; nothing fails. Recreating the cart container clears the
    rule, which is bound to the container's network namespace.
  category: dependency_latency
expected_evidence:
  # Carried from v1's design, predicted before recording and checked against the first recording,
  # on the revised world, 2026-09-27 (t_inject 08:42:06, revert at +9:50). Every prediction held:
  # latency on cart and its four callers within a minute of each other, no errors, nothing quiet,
  # cart's process unstrained, the time on cart's egress. Not predicted in size: a caller pays
  # cart's time and then another 300ms on the answer, so the callers' p95s were twice cart's, and a
  # cart page or an order, which touch cart twice, cost 1.8 seconds. The list below states the
  # recording.
  - alerts: ServiceHighLatency on cart, frontend, frontend-proxy and load-generator together (page
      4m50s), and on checkout at +5:30 - five alerts, all latency, none after the fix; no
      ServiceHighErrorRate anywhere and nothing goes quiet
  - metrics: cart's p95 steps from 3ms to 378 at +2, 863 at +3 and 910-934 from +4 (an AddItem or
      EmptyCart is three store round trips); checkout's from ~35ms to ~1.6 s, the frontend's from
      ~41ms to ~1.8 s, frontend-proxy's and load-generator's to ~1.85 s; every error ratio zero
      throughout; the load generator's rate eases from ~5.2 to ~4.6 a second and the frontend's
      from ~12.4 to ~11 as shoppers wait, cart keeps serving, and payment, shipping, currency and
      the catalog hold their rates and their milliseconds
  - traces: in 80 traces drawn under the fault, every HGET, HMSET and EXPIRE beneath cart takes
      300-305ms and so does cart's flag read - GetCart 301ms at cart, AddItem and EmptyCart 903-905;
      each caller's span is another ~300ms longer than cart's answer beneath it (checkout's
      GetCart 602, the frontend's AddItem 1205); the catalog, currency, shipping, payment and email
      answer in their usual milliseconds; no span errors; the agent's trace tool names the
      frontend's call into cart as the degrading hop on cart's and the frontend's traces
  - logs: cart's log goes on as before - GetCartAsync and AddItemAsync called, 52 to 109 lines a
      minute against ~100 at rest - with no error, warning or timeout; the frontend's log shows
      nothing new
  - metrics: cart's 35 .NET runtime series report every 15 s without a gap - CPU time flat,
      working set 115-117MB, thread count 38 to 39, thread pool queue empty, three collections in
      ten minutes - the process is up and unstrained
  - change: a change record at onset under cart's name that is none of the familiar kinds - not a
      deploy, an image, an environment variable or a limit - `traffic-shaping container attached to
      cart's network namespace`, carrying `eth0 delay=300ms jitter=0ms`
  - discriminator: a constant ~300ms on every message leaving cart - each store command, the flag
      read to a different service, and every answer to every caller - with the caller's extra time
      after cart's span rather than before it, is a delay on cart's egress; a slow store would slow
      only store commands and a slow cart only its handler, and neither shows a step that holds
      flat from the first request with the process unstrained
# Carried from v1: the rule lives in the container's network namespace, so recreating the container
# is what clears it - a restart, not a rollback or a config revert.
expected_remediation_class: restart
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: cart holds 35 .NET runtime series and logs 76 to 186 lines a minute. The fault slows
# cart and removes neither. The first recording (2026-09-27) confirmed it: 35 runtime series, 500
# target log lines, and the recorder derived [runtime, logs].
answers_idle_or_absent: [runtime, logs]
