# v2/dependency_latency-4 (holdout) - see SPLIT-V2.md. Slot allocated before authoring; do not
# move. Candidate order and eligibility: docs/design/t7.1-candidates.md, dependency_latency row 4 -
# v1's holdout productcatalog-dependency-latency, carried to v2's product-catalog. The catalog's
# interface, its store round trip and its callers' shares were measured before authoring
# (2026-09-27).
id: v2-product-catalog-dependency-latency
title: The product catalog's network path acquires 300ms of delay, and every page slows
fault_class: dependency_latency
split: holdout
slot: v2/dependency_latency-4
world: v2
injection:
  target: product-catalog
  method: v2-product-catalog-dependency-latency
  params:
    delay_ms: 300
    jitter_ms: 0
    duration: "1h"
    # The catalog's one interface (ip link from a helper in its network namespace, 2026-09-27;
    # the image has no shell). The rule delays packets leaving the catalog: its query to
    # postgresql and its answer to whoever called it.
    interface: "eth0"
ground_truth:
  root_cause: >
    A traffic-shaping rule attached to the product catalog's network namespace adds 300ms of
    delay to every packet leaving the container. The catalog's own code, image, configuration and
    database are untouched. Every product lookup pays the delay once on its query to the database
    and once on its answer, so the catalog's latency rises to several hundred milliseconds, and
    because the storefront, the recommendations and every order look products up, the whole
    store slows at once; nothing fails. Recreating the catalog container clears the rule, which is
    bound to the container's network namespace.
  category: dependency_latency
expected_evidence:
  # Carried from v1's design and not recorded on v2 yet. Written before the first recording and
  # checked against the bundle, as every v2 scenario's list has been, and corrected there.
  # Measured at rest (2026-09-27): the catalog's p95 5.2ms; GetProduct 2.5 and ListProducts 0.19 a
  # second, with one sql.conn.query beneath each; catalog calls are 23.3% of the frontend's
  # non-internal spans, 14.8% of checkout's and 49.8% of recommendation's; 9 Go runtime series
  # and no log stream. The comparators are the row's three recordings: cart (five alerts, cart
  # and its callers), the store (the same five), payment (checkout alone).
  - alerts: ServiceHighLatency on product-catalog and on every path that looks products up -
      frontend, frontend-proxy, load-generator, checkout and recommendation - within a minute or
      two of each other, three to five minutes in; six services, the culprit among them; no
      ServiceHighErrorRate anywhere and nothing goes quiet
  - metrics: the catalog's p95 steps from 5ms to about 300 (one query round trip per lookup);
      the frontend's from ~40ms to several hundred, checkout's from ~31ms to a second or more (an
      order looks up each of its items), recommendation's from ~7ms to about 600, frontend-proxy's
      and load-generator's past the line with the frontend's; every error ratio stays at zero;
      rates hold or ease as shoppers wait
  - traces: every trace touching the catalog is slow at the catalog and nowhere else - its server
      span holds the time, the sql.conn.query beneath it takes ~300ms instead of a fraction of one,
      and the caller's client span exceeds the catalog's server span by another ~300ms; cart,
      currency, shipping, payment and email answer in their usual milliseconds; no span errors;
      the trace tool names the callers' lookups as the degrading hop
  - logs: the catalog has no log stream at rest and none during the fault - its silence is what it
      always is; postgresql's log shows nothing new; the frontend's log shows nothing new
  - metrics: the catalog's 9 Go runtime series report without a gap, goroutines, heap and
      collections flat, no restart - the process is up and unstrained
  - change: a change record at onset under product-catalog's name that is none of the familiar
      kinds - not a deploy, an image, an environment variable or a limit - `traffic-shaping
      container attached to product-catalog's network namespace`, carrying `eth0 delay=300ms
      jitter=0ms`
  - discriminator: a service slow on every request with an unstrained process, its one dependency
      call slow by a constant and its answers slow by the same constant, is a delay at its own
      interface; a slow database would slow only the query and not the answer, and a slow caller
      would slow only its own requests, where here every caller slowed by the same amount at the
      same moment
# Carried from v1: the rule lives in the container's network namespace, so recreating the
# container is what clears it - a restart, not a rollback or a config revert.
expected_remediation_class: restart
rehearsed: false
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: the catalog holds 9 Go runtime series and has no Loki stream (as its flag scenario
# found: it writes no log the tools can read). The fault slows it and removes neither, so runtime
# stays populated and logs stay absent; the recorder derives the record from the capture, and if
# it says otherwise the declaration is corrected against it, not argued with.
answers_idle_or_absent: [runtime]
