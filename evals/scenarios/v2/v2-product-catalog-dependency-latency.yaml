# v2/dependency_latency-4 (holdout) - see SPLIT-V2.md. Slot allocated before authoring; do not
# move. Candidate order and eligibility: docs/design/t7.1-candidates.md, dependency_latency row 4 -
# v1's holdout productcatalog-dependency-latency, carried to v2's product-catalog. The catalog's
# interface, its store round trip and its callers' shares were measured before authoring
# (2026-09-27).
id: v2-product-catalog-dependency-latency
title: The product catalog's network path acquires 300ms of delay, and every page slows
fault_class: dependency_latency
split: holdout
slot: v2/dependency_latency-4
world: v2
injection:
  target: product-catalog
  method: v2-product-catalog-dependency-latency
  params:
    delay_ms: 300
    jitter_ms: 0
    duration: "1h"
    # The catalog's one interface (ip link from a helper in its network namespace, 2026-09-27;
    # the image has no shell). The rule delays packets leaving the catalog: its query to
    # postgresql and its answer to whoever called it.
    interface: "eth0"
ground_truth:
  root_cause: >
    A traffic-shaping rule attached to the product catalog's network namespace adds 300ms of
    delay to every packet leaving the container. The catalog's own code, image, configuration and
    database are untouched. Every product lookup pays the delay once on its query to the database
    and once on its answer, so the catalog's latency rises to several hundred milliseconds, and
    because the storefront, the recommendations and every order look products up, the whole
    store slows at once; nothing fails. Recreating the catalog container clears the rule, which is
    bound to the container's network namespace.
  category: dependency_latency
expected_evidence:
  # Carried from v1's design, predicted before recording and checked against the recording on the
  # revised world, 2026-09-27 (t_inject 11:59:06, revert at +8:50 - the second recording; the
  # first, the same day, was recorded before Q111 and its log capture held the injector's
  # sidecar's own announcement, so it is under superseded/ and this one was taken on the fixed
  # code). Every prediction held: six services, the catalog among them, no errors, nothing quiet,
  # the time inside the catalog's spans and again on its answers. Not predicted in size: a
  # GetProduct query is two exchanges with the database, so it paid 600ms not 300, and concurrent
  # lookups queued behind each other for the catalog's database connection, so the catalog's p95
  # read 1.8 s and the frontend's 4.2. Not predicted in order: recommendation paged alone first.
  - alerts: ServiceHighLatency on recommendation alone (page 3m50s), then on frontend,
      frontend-proxy, load-generator, checkout and product-catalog together at +4:30 - six
      alerts, all latency, none after the fix; no ServiceHighErrorRate anywhere and nothing goes
      quiet; product-reviews, cart, payment and shipping, which do not look products up, never
      move
  - metrics: the catalog's p95 steps from 5-6ms to 791 at +2 and ~1.8 s from +4;
      recommendation's from ~8ms to ~1.7 s; the frontend's from ~43ms to 1.9 s at +2 and ~4.2 s
      from +4, frontend-proxy's and load-generator's with it; checkout's from ~38ms to 860 at +2
      and 1.6-2.2 s from +5; every error ratio zero but the flag readers' routine sliver; rates
      thin as shoppers wait - the frontend's from ~12 to ~10.5 a second, the catalog's from ~5.3 to
      ~4.6
  - traces: in 80 traces drawn under the fault every sql.conn.query beneath a GetProduct takes
      600-605ms and the one beneath a ListProducts 301 (the delay paid twice by a two-exchange
      query, once by a one-exchange one); each caller's span is another ~300ms longer than the
      catalog's answer (the frontend's GetProduct 904 over 602, checkout's 902 over 601,
      recommendation's ListProducts 603 over 301); a recommendations page's four concurrent
      lookups come back 602, 1809, 1812, 1812 - each holding one 601ms query and the rest waiting;
      no span errors; the trace tool names GetProduct to sql.conn.query as the degrading hop on
      the catalog's and the frontend's traces
  - logs: the catalog has no log stream at rest and none under the fault, and the capture says so
      (the injector's sidecar stream that names the target is excluded by name); postgresql's log
      shows its usual two lines every five minutes and nothing else; the frontend's log shows
      nothing new
  - metrics: the catalog's 9 Go runtime series report every 15 s without a gap - goroutines 44-46,
      heap flat, allocations at their usual rate, no restart - the process is up and unstrained
  - change: a change record at onset under product-catalog's name that is none of the familiar
      kinds - not a deploy, an image, an environment variable or a limit - `traffic-shaping
      container attached to product-catalog's network namespace`, carrying `eth0 delay=300ms
      jitter=0ms`; nothing on any of the six services that paged but the catalog, and nothing on
      postgresql
  - discriminator: the shared dependency of everything that slowed is the culprit - six services
      slowed and all of them look products up, the ones that do not never moved; a constant paid
      per exchange with the database (600 for two, 300 for one) and again on every answer is a
      delay at the catalog's own interface, which a slow database (queries only) or a slow
      handler (no constant) cannot produce; the queueing that turned 300ms into seconds is the
      delay times concurrency, not a second fault
# Carried from v1: the rule lives in the container's network namespace, so recreating the
# container is what clears it - a restart, not a rollback or a config revert.
expected_remediation_class: restart
rehearsed: true
alert_timeout_seconds: 900
# Declared before recording, checked against the bundle after (T7.5). Measured on the running world
# 2026-09-27: the catalog holds 9 Go runtime series and has no Loki stream (as its flag scenario
# found: it writes no log the tools can read). The fault slows it and removes neither, so runtime
# stays populated and logs stay absent. The recording (2026-09-27, the second) confirmed it: 9
# runtime series, 0 target log lines, and the recorder derived [runtime].
answers_idle_or_absent: [runtime]
