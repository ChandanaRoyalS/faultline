# resource_exhaustion-2 (dev) - see SPLIT.md. Slot allocated before authoring; do not move.
# Fills the slot currency-cpu-throttle vacated. That scenario stays BLOCKED in place
# (ADR-0013 retired container CPU throttling); SPLIT.md is unchanged, because the slot and
# its split were committed before authoring and only the scenario in the slot changes.
#
# Rehearsed and verified against the bundle. The "silent to users" claim held at the alert
# level and at the error level exactly; two sub-threshold latency movements were measured
# and are recorded below rather than glossed.
id: frauddetection-memory-squeeze
title: Fraud detection service memory limit cut below its working set
fault_class: resource_exhaustion
split: dev
injection:
  target: frauddetection-service
  method: frauddetection-memory-squeeze
  params:
    memory: "200m"
ground_truth:
  root_cause: >
    The fraud detection service's container memory limit was lowered from 500M to 200m,
    well below its measured resting usage of 326MiB. It is a JVM, so the kernel OOM-kills
    it and the restart is slow enough to leave the service absent rather than briefly
    away.

    Nothing calls it synchronously. It consumes from Kafka, so its death removes a
    consumer from a topic rather than breaking a request path: no caller blocks, no
    request fails, and the storefront is unaffected. Work accumulates in Kafka instead of
    erroring.
  category: resource_exhaustion
expected_evidence:
  # Measured against the bundle unless a line says otherwise.
  - container: frauddetection-service exit code 137 with an OOMKilled termination reason.
      NOT VERIFIABLE FROM THIS BUNDLE - a container exit code is a kernel event and never
      appears in the captured logs. Check it live during an investigation
  - container: repeated restarts, memory pinned at the 200m ceiling before each kill.
      Same caveat - restart counts are not in the capture
  - metrics: ServiceNoTraffic on frauddetectionservice and nothing else. Measured - it is
      the only entry in alerts_over_window for the whole incident, firing at +469s
  - metrics: frauddetectionservice stops serving. Measured - call rate 0.197 to 0.014
      req/s, 48 of 56 samples during the fault are exactly zero
  - metrics: no error-rate movement anywhere. Measured and exact - every service reads
      0.0000 at every sample, before, during and after. This is the discriminating claim
      of the scenario - a synchronous dependency dying produces caller errors, and this
      produces none
  - metrics: no latency movement above threshold anywhere, and effectively none at all.
      Measured - every service within 1ms of its baseline mean except shippingservice
      (15.8 to 21.2ms mean, max 47ms) and a brief emailservice excursion (max 30ms).
      Both are two orders of magnitude below the 250ms threshold, and neither is
      established as caused by this fault from a single run
  - metrics: the storefront is unaffected in the ways that matter - frontend and
      checkoutservice hold 0.0000 error ratio and flat p95 throughout. Frontend
      throughput measured lower during the fault (9.33 to 7.63 req/s mean); whether that
      is fault-related or load-generator variation is not established from one run
  - metrics: the container's memory limit is lower than it was before onset; the working
      set did not grow to meet it
  - change: no deploy and no image change - only the container's resource limit moved
  - discriminator: the blast radius is one service wide. Every other resource_exhaustion
      scenario in the catalog reaches a caller; this one has no synchronous caller to
      reach, so an investigation that starts from user-visible symptoms has nothing to
      start from
  - discriminator: work is not lost, only delayed. Kafka retains what the consumer is not
      reading, so the recovery signature is a backlog draining rather than a gap in the
      data - which distinguishes a dead consumer from a dropped dependency
expected_remediation_class: config_revert
rehearsed: true

# Rehearsal hint, not a fault parameter - it stays out of `injection`, so it does not enter
# scenario_fingerprint and is not compared against injector.catalog.
#
# Measured: ServiceNoTraffic/frauddetectionservice fired 675s after injection, against a
# 420s default wait. The recorder timed out first and wrote alerts_at_fire: [] for a
# scenario that alerts perfectly well.
#
# The cause is traffic rate, and it belongs to the scenario rather than the run.
# frauddetectionservice serves 0.099 req/s; every other target in the catalog does 1-10.
# A 2-minute rate window fed one call every ten seconds empties slowly, so the rule's
# 3-minute for-clause starts late. 1200s leaves headroom over the measured 675s.
alert_timeout_seconds: 1200

# ---------------------------- RISK, RESOLVED AT REHEARSAL ----------------------------
# The risk was that nothing would alert at all, leaving the failure invisible the way the
# 48m recommendation case was, and requiring a different target rather than a different
# number. It did alert: ServiceNoTraffic/frauddetectionservice at +469s.
#
# It came closer than the alert set suggests. The recorder's 420s default wait expired
# first, so the first recording wrote alerts_at_fire: [] for a scenario that works. The
# cause is traffic rate - 0.099 req/s against 1-10 for every other target - and it is why
# this scenario carries alert_timeout_seconds. See CATALOG.md.
# ------------------------------------------------------------------------------------
