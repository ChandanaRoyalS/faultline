# dependency_latency-2 (HOLDOUT) - see SPLIT.md. Nothing may be tuned against this scenario.
id: productcatalog-dependency-latency
title: Product catalog network path acquires 300ms of delay, slowing every caller
fault_class: dependency_latency
split: holdout
injection:
  target: product-catalog-service
  method: productcatalog-dependency-latency
  params:
    delay_ms: 300
    jitter_ms: 0
    duration: "1h"
    interface: "eth0"
ground_truth:
  root_cause: >
    A 300ms netem delay was applied to the product catalog service container's network
    interface. Product catalog sits on the storefront listing path and the checkout path
    at once, so several unrelated-looking callers slow down simultaneously.
  category: dependency_latency
expected_evidence:
  # The trap: the loudest signal is on a caller, and there are several callers. The
  # investigation has to converge on what they share, not rank what they show.
  - metrics: latency rises across several services at the same instant - simultaneity
      across otherwise unrelated call paths is itself the evidence, since independent
      regressions do not start together
  - metrics: the set of slowed services is exactly the set that calls product catalog;
      services that do not call it are unaffected, which localises the fault by
      intersection rather than by magnitude
  - traces: every slowed request contains a product catalog span, and the added time is
      attributable to that span in all of them
  - traces: the delay appears in the gap before product catalog's handler begins, not
      inside its handler - the service is not itself doing more work
  # The multiplier is per-service: cart measured ~2x its injected per-hop delay because a
  # cart operation makes two Redis round-trips. Product catalog's own round-trip count is
  # unmeasured, so expect several hundred milliseconds rather than a specific figure.
  - metrics: product catalog's own p95 rises by the same amount for every caller, rather
      than varying by caller, which is what a shared network path looks like
  - metrics: no error-rate increase anywhere; the incident is purely latency
  - change: no deploy or configuration change on product catalog or on any caller
  - discriminator: the caller with the largest absolute latency increase is whichever one
      was slowest already, and it is not the fault - ranking services by how bad they look
      points at a symptom, and only the shared dependency explains all of them at once
  - discriminator: product catalog's CPU, memory and downstream calls are all normal, so
      the service is not overloaded and is not waiting on anything beneath it
# Settled by the measurement on cart-dependency-latency: pumba binds to the container
# that existed when the sidecar started, so recreating the target durably clears the
# delay and does not re-acquire it. Same mechanism here, same label.
expected_remediation_class: restart
rehearsed: true
