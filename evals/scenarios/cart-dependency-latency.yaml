# dependency_latency-1 (dev) - see SPLIT.md. Slot allocated before authoring; do not move.
id: cart-dependency-latency
title: Cart service network path acquires 300ms of delay
fault_class: dependency_latency
split: dev
injection:
  target: cart-service
  method: cart-dependency-latency
  params:
    delay_ms: 300
    jitter_ms: 0
    duration: "1h"
    interface: "eth0"
ground_truth:
  root_cause: >
    A 300ms netem delay was applied to the cart service container's network interface.
    Every call in and out of cart pays it, so checkout and the storefront slow down while
    nothing returns an error.
  category: dependency_latency
expected_evidence:
  - alerts: ServiceHighLatency, with no accompanying error-rate alert - the incident is
      entirely a latency incident
  # Separation from healthy behaviour is by DURATION, not magnitude. cartservice p95 is
  # bimodal unfaulted, reaching 353ms for ~105s about once every 29 minutes (ADR-0012).
  # The fault's ~650ms is the same order as that, so a single latency sample cannot tell
  # them apart - what distinguishes them is that the fault holds for the whole dwell while
  # the healthy excursion is under two minutes. The `for: 3m` clause does the work here,
  # not the 250ms threshold.
  #
  # Measured at ~650ms against a 1.9ms baseline for a 300ms egress delay. The doubling is
  # expected and worth stating: the delay is paid per packet leaving the container, and a
  # cart operation makes two Redis round-trips, so server-side p95 lands at roughly twice
  # the injected figure. A reader expecting +300ms will think the measurement is wrong.
  - metrics: cartservice p95 steps from single-digit milliseconds to several hundred at
      onset - roughly twice the injected per-hop delay, because each cart operation pays
      it on more than one round trip - and it is a step, not a ramp
  - metrics: cart's error ratio stays at zero throughout; requests are slow, not failing
  - traces: the added time sits in the network gap between caller span start and cart
      server span start, not inside cart's own handler duration
  - metrics: callers slow by approximately cart's own increase and no more, which places
      the origin at cart rather than at something cart depends on
  - change: no deploy, image change, configuration change, or traffic increase at onset -
      the latency appears against an otherwise unchanged system
  - discriminator: cart's own CPU, memory and Redis latency are all normal, ruling out
      resource exhaustion and a slow dependency underneath cart
# Measured, not inferred. With one pumba sidecar running throughout, cartservice p95
# went 1.9ms at baseline -> ~650ms under the fault. After `docker restart cart-service`
# it decayed 668 -> 600 -> 495 -> 390 -> 3.7 -> 1.9ms over about two minutes - the rate
# window emptying, not a slow recovery - and stayed at 1.9ms. It did not come back.
# Pumba binds to the container that existed when it started, so a recreated container
# is simply not re-shaped. Restarting the target is therefore a real fix and `restart`
# is the correct label, not a least-bad reading of four options.
expected_remediation_class: restart
rehearsed: true
