# The golden set (T6.4). `PREREGISTRATION-T6.4.md` §2.2.
#
# **The queries are harvested, not invented.** Every `query` below is the exact text this
# pipeline sent to retrieval during a recorded investigation, read out of
# `trajectory_retrievals` by `faultline-retrieval harvest`. `source_trajectory` and `seq` are
# what makes that checkable afterwards. Nothing here was written to be answerable.
#
# **Queries harvested from holdout runs are excluded**, and this is a channel nobody had
# considered: a synthesizer query carries four specialist findings in its text, so committing a
# holdout-derived query would put a holdout run's findings into a file in this repository,
# permanently, where anyone authoring against the golden set would read them. That is ADR-0008
# axis 1 arriving somewhere no existing guard looks, because a golden set is not a retrieval
# corpus. Seven of 243 distinct queries were dropped for this; `test_golden_set.py` enforces it.
#
# **The sample is a deterministic stratified draw, fixed before any query was read**: sort the
# distinct queries by (role, origin, trajectory, seq), then take the first 3 planner and 2
# synthesizer per scenario. No RNG and no selection, so "the author picked the queries they
# could label well" is not available as an explanation of the number.
#
# **The labelling rule, applied uniformly**: a document is relevant if a fact stated in it lets a
# reader answer something the query asks or asserts, *from the query text alone*. Topical
# adjacency is not relevance. Planner queries get a mechanical label rather than a judgement -
# the seed service's own runbook, taken from the query's "starting at" clause, plus
# `alert-high-latency` when the severity is `warning`, which is the only rule carrying it.
#
# **The residual weakness, stated rather than caveated**: the labels and 25 of the 40 runbooks
# have the same author. §2.3's three-way split is the instrument pointed at it, and the label
# concentration below is the other thing to read before trusting the number.

# Label concentration - 80 labels over 19 documents, of 50 in the corpus:
#    13  runbook:world-change-records-have-no-prior-value
#     8  runbook:service-checkoutservice
#     7  runbook:service-frontend
#     7  runbook:class-dependency-latency
#     6  runbook:service-cartservice
#     5  runbook:world-blast-radius-traversal
#     5  runbook:class-bad-config
#     4  runbook:alert-high-latency
#     4  runbook:world-what-a-recreate-removes
#     4  runbook:alert-high-error-rate
#     3  runbook:service-frauddetectionservice
#     3  runbook:service-paymentservice
#     3  runbook:class-resource-exhaustion
#     2  runbook:world-alert-timing
#     2  runbook:alert-no-traffic
#     1  runbook:service-adservice
#     1  runbook:class-bad-deploy
#     1  runbook:service-productcatalogservice
#     1  runbook:service-redis-cart
#
# **No query in this sample is unanswerable**, and the pre-registration predicted at least
# two. That clause of prediction 3 fails. It is reported rather than fixed: manufacturing an
# unanswerable query would be inventing one, which §2.2 forbids, and widening the sample
# until two appeared would be selecting for a prediction. A golden set with no
# unanswerable query cannot detect a corpus that always has an answer, and this one cannot.

