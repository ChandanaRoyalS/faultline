# T7.0 attempt A6 - "cert expiry", in the only form this world can express it.
#
# The demo has no TLS between services and therefore no certificate to expire. Its credentialed
# links are three `DB_CONNECTION_STRING`s (accounting, product-catalog, product-reviews), so
# "expired or wrong credential" is a wrong password in one of them. This picks `accounting`: it is
# the one service whose only job is to write to that database, so a bad credential there is the
# whole service failing rather than one code path.
#
# **This is a compose override of an environment variable, which is `BadConfigFault`'s exact
# mechanism.** The attempt cannot produce a new class; it is pre-registered anyway because rule 7
# requires a failed attempt before a substitute, and because whether it PAGES is a real open
# question (`Consumer.cs` catches exceptions in `ProcessMessage`). If it pages, it is a `bad_config`
# scenario for T7.1. Layered as a fourth -f on top of the v2 triple; removed by bringing the
# service up without it.
services:
  accounting:
    environment:
      - DB_CONNECTION_STRING=Host=postgresql;Username=otelu;Password=WRONG-t70-attempt;Database=otel
