# T6.8 - the only way out of `faultline-deploy-net`.
#
# The platform network is `--internal` since T6.8 (README §3.3, §3.12): nothing on it has a route
# to the internet. This proxy sits on that network and on `faultline-deploy-egress`, and forwards
# exactly two things: a CONNECT to the model provider, and a CONNECT to Slack's webhook host. The
# orchestrator reaches it through `HTTPS_PROXY` (compose.yml); nothing else on the platform has a
# reason to leave, so nothing else is given the variable.
#
# **An allowlist, not a blocklist.** The Caddyfile's inbound rules are the other shape - a route is
# public unless a `handle` says otherwise - and README §4 records that as a known weakness. Egress is
# the direction an injected instruction would use (*exfiltrate what you read*; THREAT-MODEL thesis
# 1), so here the default is `deny all` and every permitted destination is a line in this file.
# `tests/test_deploy.py` reads this file and pins the destinations to the two named below.

http_port 3128
visible_hostname egress

# Where a request may go, and how. CONNECT on 443 only: the two clients speak TLS end to end and
# the proxy sees a hostname and a byte count, never a request body or a key.
acl model_provider dstdomain api.anthropic.com
acl slack_webhooks dstdomain hooks.slack.com
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !tls_port
http_access allow CONNECT model_provider
http_access allow CONNECT slack_webhooks
http_access deny all

# Nothing is cached - there is nothing cacheable in a model call - and nothing about the caller
# is forwarded upstream.
cache deny all
forwarded_for delete
via off

# One line per tunnel, to the file the image makes writable for the `proxy` user squid drops to.
# **Not `/dev/stdout`**: the first deployment of this file (2026-09-20, README §3.9) crash-looped
# on `FATAL: Cannot open '/dev/stdout' for writing` - the device is root's inside the container
# and squid re-opens it by path after dropping privileges. `docker compose exec -T egress tail
# /var/log/squid/access.log` is the record of every byte that left the platform: when, to which
# host, how many. That log is the egress clause's evidence; README §3.12 reads it.
access_log stdio:/var/log/squid/access.log squid
logfile_rotate 0
shutdown_lifetime 2 seconds
