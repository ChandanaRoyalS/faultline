# T5.5 — the deployment's platform half.
#
# T5.5's deliverable is *"Live instance at a stable URL + documented deploy procedure"*, and its
# task text is *"the same images CI builds, running continuously on a single small VM — demo
# environment plus platform, TLS in front, basic auth on the UI."*
#
# **This file is the platform. `compose.world.yml` is the demo environment**, and the deployment is
# both — the spec's size note offers a choice of *sizes* (the full stack, or platform plus a
# trimmed demo profile), not a choice of whether a demo environment is present at all. An earlier
# version of this file served a Postgres snapshot with no world, which is neither of the two.
#
#   deploy/README.md          the procedure, the rollback, the cost, and what runs where
#   deploy/compose.world.yml  the world, on the network this file names
#   docker-compose.yml        the development profiles; this file is not that one
#
# Not `docker-compose.yml` with another profile, deliberately. That file publishes 5432, 6379 and
# 9000 on the host for a developer's convenience; the same lines on a public VM are a database and
# an object store open to the internet. A deployment whose exposure depends on remembering which
# profile is selected is one profile flag away from an incident of its own.

# **`faultline-deploy`, not `faultline`.** Compose derives a project name from the directory when
# none is given, so the repository's own `docker-compose.yml` is project `faultline` - and this
# file naming itself the same thing does not create a deployment, it *joins* the developer's one.
#
# Found on the first rehearsal, which is the entire reason `compose.rehearsal.yml` exists. With
# `name: faultline` this file attached to the running `faultline-postgres-1`, reported the dev
# Redis and MinIO as orphans it might remove, and pointed the deployment's DSN at the development
# database. It failed safe by luck rather than design: `POSTGRES_PASSWORD` initialises only an
# empty volume, so the existing one kept the old password, authentication failed and the container
# exited. Had the volume been empty, a `--build` in the wrong directory would have been enough to
# hand a public deployment the developer's database, and `docker compose down -v` in either
# directory would have destroyed the other's data.
#
# The project name is what separates the two, so it is the first line of the file.
name: faultline-deploy

# **One network, named here and joined by the world.** The platform and the demo environment are
# two compose projects - the world is a pinned clone of somebody else's repository (ADR-0026),
# never vendored into this one, so it cannot become a service in this file. They still have to
# reach each other: the orchestrator queries Prometheus, Loki and Tempo, and the world's
# Alertmanager posts to the receiver.
#
# `external: true` rather than a shared default, because otherwise the creating project owns the
# network's lifetime - `docker compose down` on the platform would tear out from under the world a
# network the world is still attached to. The operator creates it once; README §3.2 says so.
networks:
  faultline:
    external: true
    name: faultline-deploy-net

services:
  postgres:
    # Same image as development. `pgvector/pgvector:pg16` rather than plain postgres because
    # ADR-0002 puts the vector store inside the system of record — and because a snapshot taken
    # from a pgvector database will not restore into one without the extension.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: faultline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: faultline
    # **No `ports:`.** Reachable only from the compose network, which is the whole difference
    # between this file and the development one. The snapshot goes in through `docker compose exec`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - faultline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultline"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # The event bus (T2.2). The receiver writes an alert to a stream and the orchestrator consumes
    # it; without this the deployment can serve the record of past investigations and cannot
    # produce a new one - which is the state the previous version of this file was stuck in.
    #
    # No password. It is on the compose network only, published nowhere, and holds alert envelopes
    # in flight rather than anything durable: the incident is in Postgres before the consumer acks
    # (T2.3). A password here would be a secret to manage, protecting data that is already
    # somewhere else by the time it matters.
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - faultline
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  faultline:
    # **The image CI published, named by its commit - never built here.**
    #
    # T5.5 says *"the same images CI builds"* and *"images pulled from the registry CI publishes
    # to"*. This file used `build: context: ..`, which compiles a fresh image on the VM out of
    # whatever the working tree happens to hold. That is a different artifact from the one CI
    # tested, it requires the source on the VM at all, and it makes "what is running?" a question
    # the registry cannot answer.
    #
    # `.github/workflows/ci.yml` pushes `ghcr.io/chandanaroyals/faultline:<sha>` and `:latest` on
    # every commit that lands on main. The variable is mandatory and has no default **so that a
    # deployment names a commit**: `:latest` moves under a running VM, and a rollback to "whatever
    # latest was on Tuesday" is archaeology. Rollback is this variable and `up -d` - README §3.6.
    image: ${FAULTLINE_IMAGE:?set FAULTLINE_IMAGE in deploy/.env - a sha tag, never :latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # The read surface mounts only when this is passed, and refuses to start without a
      # password — see `faultline.api.auth`. Both come from deploy/.env.
      FAULTLINE_API_USER: ${FAULTLINE_API_USER:-faultline}
      FAULTLINE_API_PASSWORD: ${FAULTLINE_API_PASSWORD:?set FAULTLINE_API_PASSWORD in deploy/.env}
      FAULTLINE_INGEST_REDIS_URL: redis://redis:6379/0
      # **The database password reaches libpq here, not through the DSN below.** Two reasons,
      # and the first was found by running it:
      #
      # 1. A DSN is a URL. `openssl rand -base64 24` emits `/` and `+`, and a `/` in the
      #    password ends the authority section - libpq then read the host as `faultline` and the
      #    password's tail as the port, and the container crash-looped on
      #    `Servname not supported for ai_socktype`. Percent-encoding in YAML would work and
      #    would be one more thing for an operator to get right at 2am; not putting a secret in
      #    a URL at all is free.
      # 2. `command:` is visible in `docker inspect`, `docker compose config` and the process
      #    list. `PGPASSWORD` is at least confined to the container's environment.
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # **What `faultline-migrate` connects to**, and it is not the flag below.
      #
      # `--dsn` defaults to none, which falls through to `OrchestratorSettings.postgres_dsn`,
      # whose default is `localhost:5432` - correct on a developer's machine and wrong inside a
      # container, where localhost is the container. The documented
      # `docker compose exec faultline faultline-migrate` failed on `Connection refused` while the
      # platform beside it was serving happily from the same compose network, because the two
      # resolve their database independently.
      #
      # Set here rather than added to the documented command, so that anything else run inside
      # this container - a second migration, `psql`, whatever a future task needs - reaches the
      # same database without each caller remembering. `test_the_migration_and_the_app_agree`
      # asserts the two DSNs name one database.
      FAULTLINE_ORCH_POSTGRES_DSN: postgresql://faultline@postgres:5432/faultline
      # **And the comment above was written one prefix short.** `faultline-seed` reads
      # `ContextSettings.postgres_dsn`, prefix `FAULTLINE_CONTEXT_`, and the documented
      # `docker compose exec faultline faultline-seed` failed on the VM with the same `Connection
      # refused` to `127.0.0.1` that the migration had failed with a day earlier - fixed for one
      # settings class, reproduced by the next (T5.5c). Three settings classes carry a
      # `postgres_dsn`; `test_every_settings_class_with_a_dsn_is_pointed_at_the_one_database`
      # now derives the list from the code rather than from anyone's memory.
      FAULTLINE_CONTEXT_POSTGRES_DSN: postgresql://faultline@postgres:5432/faultline
      # **Where a reader is sent when they click a citation - set on the container that renders
      # the page.** `api.view.deep_link` builds the Grafana URL at request time from
      # `ToolSettings.grafana_url`, read in *this* process. The first version set it on the
      # orchestrator, which holds every other `FAULTLINE_TOOLS_*` endpoint and never renders a page,
      # and the guard asserted the orchestrator's value; the live instance served every citation as
      # `http://localhost:3000/...` - a visitor's own machine (T5.5c, defect twenty-seven). Found by
      # reading the live API from outside, minutes after the certificate was issued.
      #
      # `/grafana` because the demo's own frontend-proxy already serves Grafana there and Caddy
      # forwards that prefix to it, behind the same credential as this page.
      FAULTLINE_TOOLS_GRAFANA_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}/grafana
    command:
      - faultline-ingest
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      # No password in the DSN - libpq takes it from PGPASSWORD above.
      - --postgres-dsn
      - postgresql://faultline@postgres:5432/faultline
    # **No `ports:` either.** Caddy is the only way in, so the credential is never sent over
    # plain HTTP — basic auth is base64, not encryption, and a password posted to port 8000 in
    # the clear is a password published.
    expose:
      - "8000"
    # **Without this, `--wait` does not wait.** Compose treats a service with no healthcheck as
    # ready the moment its process starts, and `faultline-ingest` needs a second or two to bind the
    # port - longer under emulation. The rollback rehearsal (README §3.7) ran `up -d --wait` and
    # then `curl /healthz`, and the curl got *connection reset by peer*, twice, while `ps` read
    # `Up Less than a second`.
    #
    # That is T5.4b's defect one service over: `make up` returned before Postgres accepted
    # connections because `--wait` was missing; here `--wait` was present and had nothing to wait
    # on. Postgres's healthcheck below has been in this file from the start. This one was not,
    # because nothing had ever asked the question - and a rollback is exactly the moment an
    # operator needs "it is back" to mean serving rather than started.
    #
    # `python`, not curl: the image is `python:3.12-slim` with the venv on PATH, and adding curl
    # to the image for a check the interpreter can do would be a dependency for a one-liner.
    # `start_period` is generous because an arm64 laptop runs this image under emulation and a
    # rehearsal that flapped on its own healthcheck would teach operators to distrust it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - faultline

  orchestrator:
    # **The half that makes this a deployment of the MVP rather than a museum of one.**
    #
    # Phase 5 opens by saying the MVP is *"a complete story: world, investigation, grounding,
    # evaluation"*. A deployed instance with a world and no orchestrator alerts on a fault and
    # investigates nothing: the demo's second beat ends exactly where it should begin.
    #
    # Same image, different command. `faultline-orchestrate` consumes the alert stream, opens
    # incidents and runs the investigation, so this is the one container on the VM that makes model
    # calls and the only one that holds the key.
    image: ${FAULTLINE_IMAGE:?set FAULTLINE_IMAGE in deploy/.env - a sha tag, never :latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FAULTLINE_ORCH_REDIS_URL: redis://redis:6379/0
      FAULTLINE_ORCH_POSTGRES_DSN: postgresql://faultline@postgres:5432/faultline
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # **Telemetry endpoints are configuration and never come from an agent** - ADR-0004's runtime
      # contract, and THREAT-MODEL thesis 2: an agent that could name a host could point a tool
      # anywhere. These are the world's service names on the shared network, which is what the
      # network is for.
      FAULTLINE_TOOLS_PROMETHEUS_URL: http://prometheus:9090
      FAULTLINE_TOOLS_LOKI_URL: http://loki:3100
      # T6.1: the trace tool reads this repository's Tempo, which `compose/telemetry.yml` adds to
      # the world and `compose.world.yml` puts on the shared network. Jaeger stays behind
      # frontend-proxy as the demo's own UI; nothing here reads it any more.
      FAULTLINE_TOOLS_TEMPO_URL: http://tempo:3200
      FAULTLINE_TOOLS_POSTGRES_DSN: postgresql://faultline@postgres:5432/faultline
      # Retrieval (ADR-0008's leave-one-out corpus) reads through `ContextSettings`; without this
      # an investigation in this container would look for its corpus on the container's own
      # loopback and find nothing there. See the same line on `faultline` above (T5.5c).
      FAULTLINE_CONTEXT_POSTGRES_DSN: postgresql://faultline@postgres:5432/faultline
      # T5.2's links into T5.1's screen, for the same reason: a Slack message has no origin, so
      # this is configuration or the message carries a marked absence instead of a link.
      FAULTLINE_NOTIFY_PUBLIC_BASE_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      # Empty is a supported state - `from_settings` returns a notifier that sends nothing and says
      # so once. A deployment without Slack still investigates.
      FAULTLINE_NOTIFY_SLACK_WEBHOOK_URL: ${FAULTLINE_NOTIFY_SLACK_WEBHOOK_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in deploy/.env}
      # **This is what makes the container that holds the key spend it** (T5.5c, defect
      # twenty-nine). `faultline-orchestrate` correlates and admits; in every recorded run the
      # *harness* then ran `faultline-investigate`, and the harness is not deployed. The first
      # live incident sat in TRIAGING with "not yet investigated" on the public page. With this
      # set, the orchestrator runs the investigation itself 90s after each incident opens, with
      # the bounds `make eval` uses. Off everywhere else, because `make demo` and `make eval`
      # launch the investigation themselves and would otherwise pay twice.
      FAULTLINE_ORCH_INVESTIGATE: "1"
    command:
      - faultline-orchestrate
    networks:
      - faultline

  caddy:
    # Automatic TLS from Let's Encrypt on first request, which is the cheapest correct answer to
    # "a stable URL" and the reason this container exists at all rather than a bare port.
    image: caddy:2-alpine
    restart: unless-stopped
    # `service_healthy`, now that faultline has a healthcheck to be healthy against. The short form
    # meant "after faultline's process starts", so Caddy's first upstream requests during a deploy
    # or rollback landed on a port nobody was listening on and became 502s - a visitor's view of
    # the same race the rollback rehearsal saw as a connection reset.
    depends_on:
      faultline:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      FAULTLINE_API_USER: ${FAULTLINE_API_USER:-faultline}
      # **A bcrypt hash, not the password.** Caddy's `basic_auth` takes a hash; `caddy
      # hash-password` produces one and README §3.1 says so. The world's UIs have no auth of their
      # own, so Caddy is the only thing standing in front of Grafana and Jaeger - and the plaintext
      # credential never needs to enter this container to do it.
      FAULTLINE_API_PASSWORD_HASH: ${FAULTLINE_API_PASSWORD_HASH:?set FAULTLINE_API_PASSWORD_HASH in deploy/.env - run `caddy hash-password`}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - faultline

volumes:
  pgdata:
  caddydata:
  caddyconfig:
