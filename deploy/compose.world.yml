# T5.5 — the demo environment half, as an overlay on the world's own compose files.
#
# T5.5 says the deployment is *"demo environment plus platform"*. The world is a pinned clone of
# somebody else's repository (ADR-0026) and is never vendored into this one, so it cannot become a
# service in `deploy/compose.yml`. It comes up from its own compose file under our overlays,
# exactly as `make world-up` does on a development machine - with this third file added:
#
#   cd world && docker compose \
#     -f docker-compose.yml \
#     -f ../compose/world-arm64.override.yml \
#     -f ../compose/telemetry.yml \
#     -f ../deploy/compose.world.yml \
#     up -d --no-build
#
# README §3.4 is the authority; this comment is here so the file explains itself when found alone.
#
# **`world-arm64.override.yml` is applied on the VM, and the first version of this file said the
# opposite.** The name misled its author. That overlay is not an Apple Silicon accommodation - it is
# the world's operational configuration, and almost none of it is about the platform: kafka's heap
# cap and `MALLOC_ARENA_MAX` fix a glibc arena problem that exists on any Linux (T7.27); redis-cart's
# eviction policy is platform-independent (T7.19); a dozen memory limits were raised because
# containers sat at 95%+ *idle* and tripped the baseline gate's 90% guard; and `featureflagservice`
# is replaced with the stub every recorded scenario ran against (ADR-0005, ADR-0006).
#
# It is also one of the three files `evalharness.provenance.compose_digest` hashes. **A world
# brought up without it is world generation something-other-than-`f5bd108f4f70`** - a different
# world from the one every figure in docs/RESULTS.md was measured on, wearing the same demo image
# tag. This file is a fourth layer on top of those three and is not in the digest, so applying it
# leaves the generation intact.
#
# What this overlay does, and all it does:
#
#   1. puts the four services the platform talks to on the platform's network **as well as** the
#      world's own
#   2. points Alertmanager at the receiver's container rather than at a developer's host
#
# **`default` is listed on every one of them, and the first live deployment is why.** The demo's
# compose file names no network per service; every container sits on the implicit `default`
# (named `opentelemetry-demo` at the top of the file). A compose overlay that says
# `networks: [faultline]` does not *add* a network to that - it **replaces** the implicit membership
# with the explicit list. So the first version of this file quietly took Alertmanager, Prometheus,
# Loki and the frontend-proxy *off the world*: Prometheus lost every scrape target (2 targets, 0 up),
# Promtail could not reach Loki, and Envoy answered a citation click with "no healthy upstream"
# because it could no longer resolve `grafana` (T5.5c, defect twenty-eight). No rule fired - a
# Prometheus with no data has nothing to alert on - so the orchestrator spent nothing, which was luck.
# The guard in `tests/test_deploy.py` now asserts both networks on every service this file touches.
#
# It publishes nothing and unpublishes nothing. **The world's own compose files publish a dozen
# host ports** - 8080, 3000, 3100, 9090, 9093 and more - and a compose overlay cannot remove a
# published port, only add one. On a public VM every one of those is reachable on the IP,
# bypassing Caddy and the only credential in front of Grafana. **The host firewall is what closes
# them, it is not optional, and README §3.2 runs it before anything is brought up.**

networks:
  faultline:
    external: true
    name: faultline-deploy-net

services:
  # **`restart: always` on every telemetry container, because a reboot took them all down and
  # left the shop up (2026-09-11).** The VM's first deliberate reboot brought back every service
  # the demo gives `restart: always` - the shop, kafka, the platform - and not one of these seven:
  # the demo declares no policy on grafana, prometheus and frontendproxy, and compose/telemetry.yml
  # declared none on loki, promtail, tempo and alertmanager. The public page answered, the world
  # served traffic, and nothing could alert. A policy is deployment configuration - how this host
  # keeps the world running - so it belongs in this overlay and not in the hashed telemetry.yml,
  # where it would move the world generation for a change no bundle can observe. `tests/test_deploy.py`
  # holds the seven to it.

  # Where alerts go. The world fires them; the platform is what listens.
  alertmanager:
    restart: always
    networks:
      - default
      - faultline
    # **A second config file rather than an edit to the first.** `compose/prometheus/alertmanager.yml`
    # posts to `host.docker.internal:8000`, which is right on a development machine - the receiver
    # runs on the host there, not in a container - and resolves to nothing useful on the VM, where
    # the receiver is a container named `faultline` on this network.
    #
    # Alertmanager does not expand environment variables in its configuration, so one file cannot
    # serve both. Mounted at a different path and selected by `command`, which an overlay replaces
    # rather than merges - so the development config stays mounted, unused, and unchanged.
    volumes:
      - ../deploy/alertmanager.yml:/etc/alertmanager/alertmanager.deploy.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.deploy.yml
      - --web.listen-address=:9093

  # Queried by the metrics specialist as `http://prometheus:9090`.
  prometheus:
    restart: always
    networks:
      - default
      - faultline

  # Queried by the logs specialist as `http://loki:3100`.
  loki:
    restart: always
    networks:
      - default
      - faultline

  # Queried by the traces specialist as `http://tempo:3200` (T6.1). This repository's service, not
  # the demo's, so it is defined in compose/telemetry.yml and only joins the network here.
  tempo:
    restart: always
    networks:
      - default
      - faultline

  # One job since T6.1. Caddy forwards `/grafana*` and `/jaeger*` to it so a citation deep link
  # lands a reader in the real data behind one hostname and one credential; the traces specialist
  # used to reach Jaeger through it at `/jaeger/ui` and now reads Tempo directly.
  #
  # **`frontendproxy`, not `frontend-proxy`.** The demo names the *service* `frontendproxy` and the
  # *container* `frontend-proxy`; the URLs above use the container name because Docker's DNS
  # resolves it, and an overlay must use the service key because that is what compose merges on.
  # The first version of this file used the container name here, so compose saw a brand-new service
  # with no image and refused the whole project - on the VM, at deploy time, after two rehearsals
  # on a machine where the world was never brought up under this file (T5.5c). The guard in
  # `tests/test_deploy.py` now checks every key here against `injector.world.SERVICE_CONTAINERS`.
  frontendproxy:
    restart: always
    networks:
      - default
      - faultline

  # Not on the platform's network - nothing queries them across projects - but they did not survive
  # the reboot either. Grafana is what a citation click lands in; promtail is how logs reach Loki.
  grafana:
    restart: always
  promtail:
    restart: always
