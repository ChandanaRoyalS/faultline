# The service catalog (T2.4).
#
# GENERATED ONCE, then maintained by hand. `depends_on` came from the measured graph in
# docs/evidence/t2.4-dependency-graph/, not from anyone's memory of the architecture -
# and `tests/test_services.py` compares the two on every run, so a declaration that stops
# matching what the world does is a failing test rather than a stale document.
#
# See ADR-0035 for what each field is grounded in, and which one is not.

