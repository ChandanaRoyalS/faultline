# The service catalog for the v2 world (Q122, 2026-10-01).
#
# v1's is knowledge/services.yaml, and this follows its rules (ADR-0035):
# - `depends_on` is every cross-service edge between two of these services in v2's snapshot of
#   record, docs/evidence/t7.2-topology/q121-v2-dependencies-1h.json, self-edges aside. As on v1
#   the load generator's edges are declared: they are measured, and excluding them is the graph's
#   decision, not the catalog's.
# - The SLOs are compose/prometheus/alert-rules-v2.yml's thresholds, which that file says are
#   inherited from v1 and have no measured v2 baseline yet.
# - `kind`, `tier` and `owner` follow each service's v1 counterpart. Services new in v2: flagd and
#   flagd-ui as v1's flag service; product-reviews and llm as storefront core; image-provider as
#   storefront edge; postgresql as infrastructure; opensearch as telemetry.
# - `runbooks` is empty everywhere: no v2 runbook exists, and v1's carry v1's edge tables.
#
# tests/test_services.py checks every one of these against its source.

catalog_version: 1
services:
  - name: accounting
    container: accounting
    kind: application
    tier: async
    owner: demo/risk
    depends_on: []
    runbooks: []
    slo:
      p95_latency_ms: 250
      error_ratio: 0.05
      source: compose/prometheus/alert-rules-v2.yml
