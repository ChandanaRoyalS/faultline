[project]
name = "faultline"
version = "0.0.1"
description = "An open, benchmarked incident-investigation agent system for the OpenTelemetry stack"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Chandana Sorakundla" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
faultline-inject = "injector.cli:run"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline", "src/injector", "src/evalharness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# gRPC servicer methods must match the PascalCase names in the generated base
# class; renaming them would silently break the contract.
"compose/ffs-stub/server*.py" = ["N802"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["faultline", "injector", "evalharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
