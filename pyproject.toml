[project]
name = "faultline"
version = "0.0.1"
description = "An open, benchmarked incident-investigation agent system for the OpenTelemetry stack"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Chandana Sorakundla" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    # T2.1. Neither existed before the ingest API: FastAPI because the payload validation
    # is already Pydantic and this keeps one model doing both jobs, redis-py because
    # ADR-0001 chose Redis Streams for the bus.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "redis>=5.0",
    "psycopg[binary]>=3.2",  # T2.2: incident persistence, ADR-0016
    "alembic>=1.19.1",
]

[project.scripts]
faultline-migrate = "faultline.migrate:main"
faultline-inject = "injector.cli:run"
faultline-ingest = "faultline.ingest.app:run"
faultline-orchestrate = "faultline.orchestrator.cli:run"
faultline-investigate = "faultline.agents.cli:run"
faultline-eval = "evalharness.run:run_cli"
faultline-judge = "evalharness.judge_cli:run_cli"
faultline-demo = "evalharness.demo:run_cli"
faultline-render = "evalharness.bundle_render:run_cli"
faultline-seed = "faultline.context.cli:run"

[project.optional-dependencies]
# The local embedding model (ADR-0018). Optional because it pulls torch, and `make check`
# runs in under three seconds without it - nothing in the seeding or retrieval path imports
# it until something asks for a vector.
embeddings = ["sentence-transformers>=3.0"]
# The agent runtime's model client (ADR-0020). Optional and lazily imported for the same
# reason: `make check` never calls a model, and the fake is the only one tests touch.
agents = ["anthropic>=1.0"]
archive = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-pyyaml",
    "httpx2",  # starlette 1.x testclient wants httpx2; drives the app in-process over ASGI
    # T2.3's named method. Deselected by default so `make check` stays hermetic and Gate 0's
    # clean-clone run needs no Docker; `make test-integration` opts in.
    "testcontainers[postgres,redis]>=4.8",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline", "src/injector", "src/evalharness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# gRPC servicer methods must match the PascalCase names in the generated base
# class; renaming them would silently break the contract.
"compose/ffs-stub/server*.py" = ["N802"]

[[tool.mypy.overrides]]
# Optional dependencies (faultline[embeddings], faultline[agents], faultline[archive]); the module is
# imported lazily inside a function so nothing in `make check` loads it, and there are no stubs to install.
module = ["sentence_transformers.*", "anthropic.*", "boto3.*"]
ignore_missing_imports = true

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["faultline", "injector", "evalharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are deselected here rather than skipped inside the test, so a clean clone
# with no Docker reports "607 passed" instead of a wall of skips that reads like a broken
# checkout. `make test-integration` runs them.
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs Docker - real Postgres, Redis and MinIO via testcontainers (T2.3)",
]
